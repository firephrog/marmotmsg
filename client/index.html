  const msg=document.querySelector('.msg[data-k="m'+CSS.escape(pop.dataset.react)+'"] .bub');
  if(!msg){this.emojiClose();return}
  const r=msg.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight,pad=8;
  const left=Math.max(pad,Math.min(r.left,innerWidth-w-pad));
  const top=r.top-h-8>=pad?r.top-h-8:Math.min(r.bottom+8,innerHeight-h-pad);
  pop.style.left=left+'px';pop.style.top=Math.max(pad,top)+'px'},
 /** A click on a reaction chip, or a pick in the reaction picker: mine goes on, or comes off if it is there. */
 async react(id,e){

 /** Fills the grid: every category with its heading, or the matches for q. */

 emojiJump(i){

 /** Who wrote m: me, the group member it came from, or the person a direct chat is with. */
 sender(conv,m){return m.dir==='out'?M.me.userId:m.from||conv},
 /** Whether b directly follows a in one run: same sender (for Discord, same author), no system
     line between, within a minute, on the same day, and b is not a reply (a reply starts its own
     run). A run is drawn as one group. */
 joins(conv,a,b){
  if(!a||!b||a.dir==='sys'||b.dir==='sys'||a.dir!==b.dir||(b.re&&!b.deleted))return false;
  const who=m=>isDiscord(conv)&&m.dir==='in'?'d:'+m.author+'|'+m.src:this.sender(conv,m);
  return who(a)===who(b)&&b.ts-a.ts<=60000&&dayLabel(a.ts)===dayLabel(b.ts)},
 /** Whether shown[i] ends a run of messages from one sender, so it carries their picture and the time. */
 runEnd(conv,shown,i){return !this.joins(conv,shown[i],shown[i+1])},
 /** Whether shown[i] starts a run, so it carries the sender's name. */
 runStart(conv,shown,i){return !this.joins(conv,shown[i-1],shown[i])},
 /** The run classes for shown[i]: ' cont' if it continues one, ' mid' if more follow it. */

 /** The quoted message, as it reads now if it is still here, else as it was quoted. */
 quoteHTML(conv,re,jump){

  const tag=jump?'button':'div';
  return '<'+tag+' class="quote"'+(jump?' data-jump="'+esc(re.id)+'" title="Jump to message"':'')+'><b>'+esc(name)+'</b>'+
   '<span'+(gone||veil?' class="gone"':'')+'>'+esc(text.slice(0,200))+'</span></'+tag+'>'},

 /** Delete for me, or — for my own messages in an encrypted chat — for everyone. */
 askDelete(id){
  const conv=this.cur(),m=conv&&M.get('msg:'+conv+':'+id);if(!m)return;
  const all=m.dir==='out'&&!m.deleted&&!isDiscord(conv)&&(isGroup(conv)?!!M.group(conv):M.isFriend(conv));
  // staff can take someone else's message down for everyone in a chat they are in
  const mod=m.dir==='in'&&!m.deleted&&!isDiscord(conv)&&(isGroup(conv)?!!M.group(conv):true)&&(M.can('delete')||M.can('purge'));
  const note=m.deleted?'This removes the placeholder from your history.'
   :all?'Delete for everyone replaces it with “message deleted” on every copy in this chat, including people who have not opened it yet. Delete for me only removes it from your history.'
   :isDiscord(conv)?'This removes it from your Marmot history only. It stays in the Discord channel.'
   :'This removes it from your history only. '+(m.dir==='out'?'Others in the chat keep their copy.':'The sender and anyone else in the chat keep theirs.');
  const preview=m.deleted?'':'<div class="quote" style="margin:0 0 4px"><b>'+esc(m.dir==='out'?'you':m.author||M.displayName(m.from||conv))+' · '+esc(hm(m.ts))+'</b><span>'+esc(gist(m).slice(0,200))+'</span></div>';
  this.modal('<h3>'+(m.deleted?'Remove placeholder?':'Delete message?')+'</h3>'+preview+'<div class="note">'+esc(note)+'</div>'+

   '<button class="'+(all?'tbtn danger':'hang')+'" data-m="me">'+(m.deleted?'REMOVE':'DELETE FOR ME')+'</button>'+
   (all?'<button class="hang" data-m="all">DELETE FOR EVERYONE</button>':'')+
   (mod?'<button class="hang" data-m="mod" title="Replaces it with “removed by staff” for everyone in this chat">REMOVE AS STAFF</button>':'')+'</div>',
   async(act,btn)=>{

    catch(e){err.textContent=e.message;document.querySelectorAll('#overlay [data-m]').forEach(b=>b.disabled=false)}});

 /* ---------- the group control panel ----------

 /** The OWNER / MOD chip beside someone's name in a group, and MUTED HERE if they are muted in it. */

 async gpAct(act,btn){
  const P=this._gp;if(!P)return;
  const id=P.id,gid=id.replace(/^g:/,''),[k,u,x]=act.split(':'),err=$('#gpErr');
  const redraw=()=>{P.html='';this.renderGroupPanel()};
  if(k==='close')return this.close();
  if(k==='invite')return this.groupInvite(id);
  if(k==='tab'){P.tab=u;P.muting=P.kicking=null;return redraw()}
  if(k==='peer'){this.close();return this.showPeer(u)}
  if(k==='muting'){P.muting=P.muting===u?null:u;P.kicking=null;return redraw()}
  if(k==='kicking'){P.kicking=u||null;P.muting=null;return redraw()}
  if(k==='vis'||k==='tmode'){P.draft[k==='vis'?'vis':'mode']=u;return redraw()}
  if(k==='tag-reset'){const g=M.group(id);P.draft=Object.assign({emoji:''},g&&g.tag);P.picking=false;return redraw()}
  if(k==='emo'){P.picking=!P.picking;P.eq='';redraw();const q=$('#gpEmoQ');if(q&&matchMedia('(hover:hover)').matches)q.focus();return}
  if(k==='emoji'){P.draft.emoji=act.slice(6);P.picking=false;return redraw()}
  if(k==='emoji-clear'){P.draft.emoji='';P.picking=false;return redraw()}
  if(P.busy)return;
  if(err)err.textContent='';
  P.busy=true;if(btn)btn.disabled=true;
  try{
   if(k==='mod'||k==='unmod'){await M.setGroupMod(gid,u,k==='mod');toast(M.displayName(u)+(k==='mod'?' is now a group moderator':' is no longer a group moderator'))}
   else if(k==='mute'){await M.muteInGroup(gid,u,Number(x));P.muting=null;toast(M.displayName(u)+' is muted in this group')}
   else if(k==='unmute'){await M.muteInGroup(gid,u,null);toast(M.displayName(u)+' can talk in this group again')}
   else if(k==='kick'){const n=M.displayName(u);await M.kickFromGroup(gid,u);P.kicking=null;toast(n+' was removed from the group')}
   else if(k==='inv')await M.groupSettings(gid,{invite:u});
   else if(k==='tag-save'){
    const d=P.draft,text=String(d.text||'').trim().replace(/^#/,'');
    if(/\s/.test(text))throw new Error('a group tag is one word');
    if([...text].length>4)throw new Error('a group tag can be at most 4 characters');
    await M.groupSettings(gid,{tag:{text,emoji:d.emoji||'',vis:d.vis,mode:d.mode}});
    const g=M.group(id);P.draft=Object.assign({emoji:''},g&&g.tag);P.picking=false;toast('group tag saved')}
   else if(k==='name-save'){const n=(P.name||'').trim();if(n!==M.groupName(id)){await M.renameGroup(id,n);toast(n?'group renamed':'group name removed')}P.name=M.groupName(id)}
   else if(k==='icon-pick'){const f=await pickImage();if(f){await M.setGroupIcon(id,await shrinkImage(f));toast('group icon changed')}}
   else if(k==='icon-clear'){await M.setGroupIcon(id,'');toast('group icon removed')}
   else if(k==='showtag'){await M.showTag(gid);toast('your profile shows the group tag')}
   else if(k==='hidetag'){await M.showTag('');toast('the group tag is off your profile')}
   else if(k==='accept'||k==='deny'){const n=M.displayName(u);await M.answerApp(gid,u,k==='accept');toast(k==='accept'?n+' is in the group':'request from '+n+' declined')}}
  catch(e){const el=$('#gpErr');if(el)el.textContent=e.message;else toast(e.message)}
  finally{if(this._gp===P){P.busy=false;redraw()}}},

 /** Someone's group tag was clicked: join, apply, or say why not. */
 async tagClick(via){
  const me=via===M.me.userId;let pf=null;
  if(!me)try{pf=await M.fetchProfile(via)}catch(e){return toast(e.message)}
  const tag=me?M.myTag():pf&&pf.tag;
  if(!tag)return toast('that group tag is gone');
  const gid=tag.groupId,label=tagLabel(tag);
  if(M.group(gid)){this.closeSide();return this.open('g:'+gid)}
  const who=M.displayName(via),foot=b=>'<div class="err" id="tjErr"></div><div class="modal-foot"><span class="grow"></span><button class="tbtn" data-m="cancel">CLOSE</button>'+(b||'')+'</div>';
  const head='<h3>'+esc(label)+'</h3><div class="note">A group chat with '+tag.n+' member'+(tag.n===1?'':'s')+', shown on '+esc(who)+'’s profile. '+
   'Its messages are end-to-end encrypted; you see them from when you join, not before. Other members can message you there.</div>';
  const run=async(fn,btn)=>{const err=$('#tjErr');err.textContent='';btn.disabled=true;
   try{await fn()}catch(e){err.textContent=e.message;btn.disabled=false}};
  if(tag.vis==='friends'&&!M.isFriend(via))
   return this.modal(head+'<div class="note">Only friends of '+esc(who)+' can join through this tag.</div>'+foot(),()=>this.close());
  if(M.applied.has(gid))
   return this.modal(head+'<div class="note">Your request to join is waiting for a group moderator.</div>'+foot('<button class="tbtn danger" data-m="withdraw">WITHDRAW REQUEST</button>'),
    (act,btn)=>{if(act==='cancel')return this.close();if(act==='withdraw')run(async()=>{await M.withdrawApp(gid);this.close();toast('request withdrawn')},btn)});
  if(tag.mode==='apply')
   return this.modal(head+'<div class="field"><div class="lbl">WHY DO YOU WANT TO JOIN?</div><textarea class="inp" id="tjWhy" rows="3" maxlength="200" placeholder="the moderators see this"></textarea></div>'+
    foot('<button class="send" data-m="go">SEND REQUEST</button>'),
    (act,btn)=>{if(act==='cancel')return this.close();if(act!=='go')return;
     const why=$('#tjWhy').value.trim();if(!why){$('#tjErr').textContent='say why you want to join';return}
     run(async()=>{await M.joinByTag(gid,via,why);this.close();toast('request sent to the moderators of '+label)},btn)});
  this.modal(head+foot('<button class="send" data-m="go">JOIN GROUP</button>'),
   (act,btn)=>{if(act==='cancel')return this.close();if(act!=='go')return;
    run(async()=>{await M.joinByTag(gid,via);this.close();this.closeSide();this.open('g:'+gid);toast('you joined '+label)},btn)})},

 async groupLeave(id){
  const ok=await this.confirm('Leave '+M.displayName(id)+'?','You stop receiving its messages. Your copy of the history stays on this account. A member who is your friend can invite you back.','LEAVE');
  if(!ok)return;
  try{await M.leaveGroup(id)}catch(e){toast(e.message)}},

 async joinPublic(linkId){

 /** Removes the latest messages in a chat for everyone in it (the purge permission). */

  const list=M.thread(conv).filter(m=>m.dir!=='sys'&&!m.deleted&&m.state!=='sending'&&m.state!=='failed');
  const authors=[...new Set(list.map(m=>this.sender(conv,m)))];

  this.modal('<h3>Purge messages</h3><div class="note">Removes the most recent messages in '+esc(M.displayName(conv))+' for everyone in it; each becomes “removed by staff”. '+

   '<div class="field"><div class="lbl">HOW MANY · LATEST FIRST</div><input class="inp" id="purgeN" type="number" min="1" max="500" value="'+Math.min(20,Math.max(1,list.length))+'"></div>'+
   '<div class="field"><div class="lbl">FROM</div><select class="inp" id="purgeWho"><option value="">everyone</option>'+

   '<div class="err" id="purgeErr"></div><div class="modal-foot"><span class="grow"></span><button class="tbtn" data-m="cancel">CANCEL</button><button class="hang" data-m="go">PURGE</button></div>',
   async(act,btn)=>{

 /* ---- autocomplete: @people, /commands and :emoji: ---- */

 /** Who can be pinged from conv: its members first, then friends (and accounts staff have looked up). */
 acPeople(conv){
  const seen=new Map(),add=(id,name)=>{if(id&&name&&id!==M.me.userId&&!seen.has(name.toLowerCase()))seen.set(name.toLowerCase(),{id,name})};
  const g=isGroup(conv)&&M.group(conv);
  if(g)for(const m of g.members)add(m.userId,M.username(m.userId)||m.username);
  if(conv&&!isGroup(conv)&&!isDiscord(conv))add(conv,M.username(conv));
  for(const p of M.peers.values())if(p.state==='friend')add(p.userId,M.username(p.userId)||p.username);
  if(M.staff&&this.S.adm)for(const u of this.S.adm.users)add(u.userId,u.username);
  if(this.S.screen==='servers'&&this.S.srv)for(const m of M.smembers.get(this.S.srv)||[])add(m.userId,m.username);
  return [...seen.values()]},
 /** Opens, updates or closes the suggestion list for the word being typed. */
 acUpdate(){
  const ta=$('#composer'),box=$('#composerBox');if(!ta||!box)return this.acClose();
  const before=ta.value.slice(0,ta.selectionStart==null?ta.value.length:ta.selectionStart);
  let items=[],start=0;
  const at=/(^|[^\w@])@([A-Za-z0-9._-]{0,24})$/.exec(before);
  const cmd=/^\/(\w*)$/.exec(before);
  const ec=/(^|[\s(])(:([a-z0-9_+-]{2,32}))$/i.exec(before);
  if(ec){
   const q=ec[3].toLowerCase(),seen=new Set(),hit=[];start=before.length-ec[2].length;
   const exact=ECODE.get(q);if(exact){seen.add(exact);hit.push([q,exact])}
   for(const [n,e] of ECODE)if(hit.length<8&&!seen.has(e)&&n.startsWith(q)){seen.add(e);hit.push([n,e])}
   for(const [n,e] of ECODE)if(hit.length<8&&!seen.has(e)&&n.includes(q)){seen.add(e);hit.push([n,e])}
   items=hit.map(([n,e])=>({value:e+' ',html:'<span class="emo">'+e+'</span><b>:'+esc(n)+':</b>'}))}
  else if(at){
   const q=at[2].toLowerCase();start=before.length-at[2].length-1;
   items=this.acPeople(this.cur()).filter(p=>p.name.toLowerCase().startsWith(q)).concat(
    this.acPeople(this.cur()).filter(p=>!p.name.toLowerCase().startsWith(q)&&p.name.toLowerCase().includes(q)))
    .slice(0,8).map(p=>{const dn=M.displayName(p.id);
     return {value:'@'+p.name+' ',html:this.av(p.id,'av-26',p.name,' style="background:var(--avatar);color:var(--avatar-fg)"')+'<span>'+esc(dn)+'</span>'+this.staffTag(p.id)+(dn!==p.name?'<span class="d">@'+esc(p.name)+'</span>':'')}})}
  else if(cmd){
   const q=cmd[1].toLowerCase();
   items=FUN.concat(M.staff?this.cmdList():[['help','','show all commands']]).filter(c=>c[0].startsWith(q)).map(c=>({value:'/'+c[0]+' ',html:'<b>/'+c[0]+'</b><span class="d">'+esc(c[1]||c[2])+'</span>'}))}
  if(!items.length)return this.acClose();
  let pop=$('#acPop');
  if(!pop){pop=document.createElement('div');pop.className='acpop';pop.id='acPop';pop.setAttribute('role','listbox');box.appendChild(pop)}
  const sel=this._ac&&this._ac.items.length===items.length?Math.min(this._ac.sel,items.length-1):0;
  this._ac={items,start,end:before.length,sel};
  pop.innerHTML=items.map((it,i)=>'<button type="button" data-ac="'+i+'" role="option" aria-selected="'+(i===sel)+'">'+it.html+'</button>').join('')},
 acMove(d){const a=this._ac;if(!a)return;a.sel=(a.sel+d+a.items.length)%a.items.length;
  document.querySelectorAll('#acPop [data-ac]').forEach((b,i)=>{b.setAttribute('aria-selected',String(i===a.sel));if(i===a.sel)b.scrollIntoView({block:'nearest'})})},
 acPick(i){
  const a=this._ac,ta=$('#composer');if(!a||!ta)return;
  const it=a.items[i==null?a.sel:i];if(!it)return;
  ta.setRangeText(it.value,a.start,a.end,'end');ta.focus();
  this.acClose();this.acUpdate()},

 /** A toast for a message in another chat. While the tab is hidden they are only counted,

 notify(peer,text){

 back(){

 /* ---------- voice ---------- */
 async call(id,ids){
  try{await M.voice.start(id,ids)}
  catch(e){toast(/permission|denied|notallowed/i.test(e.name+' '+e.message)?'microphone access was blocked — allow it in the browser to call':'call failed: '+e.message,7000)}},
 async answer(){
  try{await M.voice.accept()}

 /** Whether someone can be rung into a group call: signed in and showing it, and not on do not disturb. */
 callable(id){const p=M.presence(id);return p==='online'||p==='idle'},
 /** CALL in a group: pick who to ring. With `invite`, rings more people into the call already going. */
 groupCall(id,invite){
  const g=M.group(id),vc=M.voice.call;if(!g)return;
  const gid=String(id).replace(/^g:/,'');
  if(!invite&&vc&&vc.group===gid&&vc.state==='ringing')return this.answer();
  if(invite&&!(vc&&vc.group===gid&&vc.state!=='ringing'))return;
  const inCall=invite?vc.links:new Map();
  const others=g.members.filter(m=>m.userId!==M.me.userId&&!inCall.has(m.userId)).map(m=>m.userId);
  // who can be rung first, then everyone else, each by name
  const ok=others.filter(u=>this.callable(u)),rank=u=>ok.includes(u)?0:1;
  others.sort((a,b)=>rank(a)-rank(b)||M.displayName(a).localeCompare(M.displayName(b)));
  const why=u=>{const p=M.presence(u);return p==='dnd'?'do not disturb':p==='idle'?'idle':p==='online'?'online':'offline'};
  const rows=others.map(u=>{const can=ok.includes(u);
   return '<label class="pick'+(can?'':' off')+'" data-name="'+esc(M.displayName(u).toLowerCase()+' '+(M.username(u)||'').toLowerCase())+'">'+
    '<input type="checkbox" value="'+esc(u)+'"'+(can?'':' disabled')+'>'+this.av(u,'av-26')+
    '<span class="row-main">'+esc(M.displayName(u))+'</span><span class="pstate">'+why(u)+'</span></label>'}).join('');
  const label=n=>(invite?'INVITE':'CALL')+(n?' '+n:'');
  this.modal('<h3>'+(invite?'Invite to the call':'Call '+esc(M.displayName(id)))+'</h3>'+
   '<div class="note">Pick who to ring. Only members who are online and not on do not disturb can be called'+(invite?'.':'; you can invite more once the call is going.')+'</div>'+
   (others.length?'<input class="search" id="pickFilter" placeholder="filter members…" autocomplete="off" style="margin:0 0 8px;width:100%"><div class="picks" id="picks">'+rows+'</div>'
    :'<div class="picks"><div class="grouplbl">'+(invite?'EVERYONE IN THE GROUP IS IN THE CALL':'NO ONE ELSE IS IN THIS GROUP')+'</div></div>')+
   '<div class="err" id="gErr"></div><div class="modal-foot">'+(ok.length>1?'<button class="tbtn" data-m="all">SELECT ALL</button>':'')+
   '<span class="grow"></span><button class="tbtn" data-m="cancel">CANCEL</button><button class="send" data-m="go" id="gGo" disabled>'+label(0)+'</button></div>',
   async(act,btn)=>{
    if(act==='cancel')return this.close();
    if(act==='all'){document.querySelectorAll('#picks input:not(:disabled)').forEach(i=>{i.checked=true});
     const b=$('#gGo');b.textContent=label(this.picked().length);b.disabled=false;return}
    if(act!=='go')return;
    const ids=this.picked();if(!ids.length)return;
    if(!invite){this.close();return this.call('g:'+gid,ids)}
    const err=$('#gErr');err.textContent='';btn.disabled=true;
    try{const n=await M.voice.invite(ids);this.close();toast('ringing '+n+(n===1?' person':' people'))}
    catch(e){err.textContent='could not invite: '+e.message;btn.disabled=false}});
  this.wirePicker(n=>{const b=$('#gGo');b.textContent=label(n);b.disabled=!n})},

 /** The call bar along the top. It sits outside the panes so a call survives switching screens. */
 renderCall(){
  const box=$('#callbar'),c=M.voice.call;
  this.renderCallAudio(c);
  Ring.set(!!c&&c.dir==='in'&&c.state==='ringing'&&M.presenceMode!=='dnd');
  $('#app').classList.toggle('with-call',!!c);
  if(!c){
   clearInterval(this._callTick);this._callTick=0;this._callId=null;
   if(box.classList.contains('callbar')&&!box.classList.contains('out')){
    box.classList.add('out');
    setTimeout(()=>{if(!M.voice.call){box.innerHTML='';box.className=''}},180)}
   this.renderStage(null);
   return}
  // a new call shows its window again, even if the last one was hidden
  if(this._callId!==c.id){this._callId=c.id;this._stageOff=false;this._pin=null}
  if(!this._callTick)this._callTick=setInterval(()=>this.renderCall(),1000);
  const ringing=c.dir==='in'&&c.state==='ringing',grp=c.group?'g:'+c.group:null;
  const ls=[...c.links.values()],on=ls.filter(l=>l.state==='active').length;
  const vs=c.chan?M.srv(c.server):null,vch=vs&&vs.channels.find(x=>x.id===c.chan);
  const who=c.chan?(vch?vch.name:'voice channel')+(vs?' · '+vs.name:''):grp?M.displayName(grp):M.displayName(c.peer);
  const st=c.state==='active'?(c.unstable?'reconnecting… · ':'')+clock(Math.floor((Date.now()-c.started)/1000))+
    (c.chan?' · '+(on+1)+' in channel':grp?' · '+(on+1)+' in call':'')+(c.muted?' · muted':'')
   :ringing?(grp?'group call from '+M.displayName(c.peer):'incoming voice call')
   :{calling:grp?'ringing '+ls.length+'…':'calling…',connecting:'connecting…'}[c.state];
  const html=(c.chan?'<div class="av av-34 stile">'+ICON.speaker+'</div>':this.av(grp||c.peer,'av-34'))+
   '<div class="grow"><button class="who-btn" data-act="call-open"><div class="pane-title">'+esc(who)+
   (!grp&&!c.chan&&M.peer(c.peer).verified?' <span class="chip ok">VERIFIED</span>':'')+'</div></button>'+
   '<div class="meta'+(c.unstable?' warn':'')+'"'+(c.relayed?' title="no direct or TURN connection: audio goes through the server, still encrypted"':'')+'>'+esc(st)+(c.relayed?' · relayed':'')+
   (c.chan?(vs&&vs.e2ee?' · voice channel · end-to-end encrypted':' · voice channel'):' · end-to-end encrypted')+'</div></div>'+
   '<div class="cacts">'+(ringing?'<button class="hang" data-act="call-decline">DECLINE</button><button class="send ok" data-act="call-accept">'+(grp?'JOIN':'ACCEPT')+'</button>'
    :(grp?'<button class="tbtn" data-act="call-invite">INVITE</button>':'')+
     (M.voice.canVideo()?'<button class="tbtn" data-act="call-cam" aria-pressed="'+c.cam+'">CAMERA</button>':'')+
     (M.voice.canScreen()?'<button class="tbtn" data-act="call-screen" aria-pressed="'+c.screen+'">SCREEN</button>':'')+
     '<button class="tbtn" data-act="call-mute" aria-pressed="'+c.muted+'">'+(c.muted?'UNMUTE':'MUTE')+'</button>'+
     '<button class="tbtn" data-act="call-view" aria-pressed="'+!this._stageOff+'" title="show or hide the call window">VIEW</button>'+
     '<button class="hang" data-act="call-hangup">'+(grp||c.chan?'LEAVE':'HANG UP')+'</button>')+'</div>';
  box.className='callbar'+(ringing?' ringing':'');
  if(box.innerHTML!==html)box.innerHTML=html;
  this.renderStage(c)},

 /** One audio element per person on the call (a relayed link plays through its own audio context instead). */
 renderCallAudio(c){
  const box=$('#callAudios'),want=new Map();
  if(c)for(const l of c.links.values())if(l.remote)want.set(l.peer,l.remote);
  for(const a of [...box.children])if(!want.has(a.dataset.peer)){a.srcObject=null;a.remove()}
  for(const [peer,src] of want){
   let a=[...box.children].find(x=>x.dataset.peer===peer);
   if(!a){a=document.createElement('audio');a.autoplay=true;a.setAttribute('playsinline','');a.dataset.peer=peer;box.appendChild(a)}
   if(a.srcObject!==src){a.srcObject=src;a.play().catch(()=>{})}}},

 async video(kind){
  const c=M.voice.call;if(!c)return;
  const on=!c[kind];
  try{await (kind==='cam'?M.voice.setCamera(on):M.voice.setScreen(on))}
  catch(e){
   // closing the screen picker without choosing is not an error worth a toast
   if(kind==='screen'&&/^(NotAllowedError|AbortError)$/.test(e.name))return;
   toast(/permission|denied|notallowed/i.test(e.name+' '+e.message)?'camera access was blocked — allow it in the browser to turn it on'
    :(kind==='cam'?'camera':'screen share')+' failed: '+e.message,7000)}},

 /** The call window: a tile for everyone in the call and one for each screen being shared. */
 renderStage(c){
  const st=$('#stage'),box=$('#tiles');
  if(!c||c.state==='ringing'||this._stageOff){
   if(!st.hidden&&document.fullscreenElement===st)document.exitFullscreen().catch(()=>{});
   st.hidden=true;
   if(!c){st.classList.remove('big');this._pin=null;for(const v of box.querySelectorAll('video'))v.srcObject=null;box.innerHTML=''}
   return}
  st.hidden=false;
  const me=M.me.userId,tiles=[];
  for(const l of c.links.values()){
   const name=M.displayName(l.peer);
   const wait=l.state!=='active',stat=l.state==='calling'?(l.ring?'ringing…':'connecting…'):l.state==='connecting'?'connecting…'
    :l.unstable?'reconnecting…':l.relay?'relayed':'';
   tiles.push({k:'p:'+l.peer,id:l.peer,src:l.peerCam&&l.remoteCam||null,label:name,muted:l.peerMuted,wait,stat,warn:l.unstable});
   if(l.peerScreen&&l.remoteScreen)tiles.push({k:'s:'+l.peer,id:l.peer,src:l.remoteScreen,label:name+' · screen',screen:true})}
  tiles.push({k:'p:me',id:me,src:c.cam&&c.camStream||null,label:'you',muted:c.muted,mine:true});
  if(c.screen&&c.screenStream)tiles.push({k:'s:me',id:me,src:c.screenStream,label:'your screen',screen:true,mine:true});
  // one tile large: the one picked, else a screen being shared; otherwise everyone the same size
  // ('grid' when the large one was clicked back down)
  const main=tiles.length>1&&this._pin!=='grid'&&(tiles.find(t=>t.k===this._pin)||tiles.find(t=>t.screen&&!t.mine)||tiles.find(t=>t.screen))||null;
  const rest=main?tiles.length-1:tiles.length;
  box.classList.toggle('focus',!!main);
  // under a large tile the rest sit in a row, never wider than a quarter each
  box.style.setProperty('--cols',main?Math.max(4,rest):rest<=1?1:rest<=4?2:rest<=9?3:4);
  // keep each tile's element, so a playing video is never pulled out of the page
  const keep=new Set(tiles.map(t=>t.k));
  for(const el of [...box.children])if(!keep.has(el.dataset.tile)){const v=el.querySelector('video');if(v)v.srcObject=null;el.remove()}
  tiles.forEach((t,i)=>{
   let el=[...box.children].find(x=>x.dataset.tile===t.k);
   if(!el){
    el=document.createElement('button');el.className='tile';el.dataset.act='stage-pin';el.dataset.tile=t.k;
    el.innerHTML='<video autoplay playsinline muted></video><div class="tav"></div><span class="tag"></span><span class="tst"></span>'}
   if(box.children[i]!==el)box.insertBefore(el,box.children[i]||null);
   const v=el.firstElementChild,s=t.src||null;
   if(v.srcObject!==s){v.srcObject=s;if(s)v.play().catch(()=>{})}
   el.classList.toggle('cam',!!s);el.classList.toggle('screen',!!t.screen);el.classList.toggle('mine',!!t.mine);
   el.classList.toggle('wait',!!t.wait);el.classList.toggle('main',main===t);
   el.title=main===t?'click to show everyone the same size':'click to show '+t.label+' large';
   const av='<div class="av">'+this.avInner(t.id,t.mine?M.displayName(me):t.label,false)+'</div>';
   const tav=el.querySelector('.tav');if(tav.innerHTML!==av)tav.innerHTML=av;
   const tag=(t.muted?ICON.micOff:'')+'<span>'+esc(t.label)+'</span>';
   const tg=el.querySelector('.tag');if(tg.innerHTML!==tag)tg.innerHTML=tag;
   tg.title=t.muted?t.label+' is muted':'';
   const ts=el.querySelector('.tst');if(ts.textContent!==(t.stat||''))ts.textContent=t.stat||'';ts.classList.toggle('warn',!!t.warn)});
  st.querySelector('[data-act=stage-size]').textContent=st.classList.contains('big')?'SHRINK':'EXPAND';
  const fs=st.querySelector('[data-act=stage-full]');
  fs.hidden=!st.requestFullscreen;fs.textContent=document.fullscreenElement===st?'EXIT FULLSCREEN':'FULLSCREEN'}
};

/** Incoming-call tone, synthesised so the file stays standalone. */
const Ring={ctx:null,timer:0,on:false,
 set(on){
  if(on===this.on)return;
  this.on=on;clearInterval(this.timer);
  if(on){this.beep();this.timer=setInterval(()=>this.beep(),2200)}},
 beep(){
  try{
   const a=this.ctx||(this.ctx=new AudioContext());
   if(a.state==='suspended')a.resume().catch(()=>{});
   const t=a.currentTime;
   for(const [d,f] of [[0,880],[0.28,660]]){
    const o=a.createOscillator(),g=a.createGain();
    o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(0.12,t+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.24);
    o.connect(g).connect(a.destination);o.start(t+d);o.stop(t+d+0.26)}}
  catch(e){}}};

  case 'disc-on':case 'disc-off':{

/* ---------- updates ---------- */
/* With auto-update on (the default), boot asks the server which client it serves
   before anything else starts. If that one is newer, GET /api/client carries the
   whole file and document.write puts it in place of this page; the new copy then
   shows its patch notes and offers itself as a download, since a current file on
   disk starts without the swap. With auto-update off, a newer client is only
   offered as a download. */
function newerVer(a,b){
 const x=a.split('.').map(Number),y=b.split('.').map(Number);
 for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d>0}
 return false}
const autoUpdates=()=>store.get('autoupdate')!=='off';
/** The server to update from, or '' before one is known. */
async function updateBase(){const b=SERVER?await reachServer():store.get('server');return b?b.replace(/\/+$/,''):''}
async function getJSON(url,ms){
 const ac=new AbortController(),t=setTimeout(()=>ac.abort(),ms);
 try{const r=await fetch(url,{signal:ac.signal,cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}
 finally{clearTimeout(t)}}
/** The newest client the server has, {v,html}, or null when this copy is current. */
async function latestClient(){
 const base=await updateBase();if(!base)return null;
 const {v}=await getJSON(base+'/api/client/version',4000);
 if(typeof v!=='string'||!newerVer(v,VERSION))return null;
 const c=await getJSON(base+'/api/client',20000);
 // the file must really be the version it claims, or every boot would swap again
 if(c.v!==v||typeof c.html!=='string'||!c.html.includes("const VERSION='"+v+"'"))throw new Error('server sent a mismatched client');
 return c}
/** Swaps this page for the server's newer client. Resolves when there is nothing to swap;
    after a swap it never resolves, so this copy's boot stops where it is. */
async function autoUpdate(){
 let c;
 try{c=await latestClient()}catch(e){console.warn('Marmot auto-update skipped:',e.message)}
 if(!c)return;
 window.__marmotUpdate={from:VERSION,to:c.v,html:c.html};
 document.open();document.write(c.html);document.close();
 return new Promise(()=>{})}
/** Auto-update off: offers a newer client as a download instead. */
async function checkUpdate(){
 let c;
 try{c=await latestClient()}catch(e){console.warn('Marmot update check failed:',e.message);return}
 if(!c)return;
 popup(brandHTML()+'<h3 style="margin-top:16px">Update available</h3>'+
  '<div class="note" style="margin:0">Version '+esc(c.v)+' is out. Download the new file and open it in place of this one, or turn auto-update on in Settings.</div>'+
  '<div class="pnotes">'+notesHTML(VERSION,c.html)+'</div>'+
  '<div class="modal-foot"><span class="grow"></span><button class="tbtn" data-u="later">LATER</button>'+dlButton(c)+'</div>',
  k=>{if(k==='get')toast('saved marmot.html — open it and close this tab',8000)})}
/** The server turned something away because this client is too old to speak with the
    others: say so, with the server's client to swap in now or to download. Once per page. */
let outdatedShown=false;
async function outdatedPopup(msg){
 if(outdatedShown)return;outdatedShown=true;
 let c=null;
 try{const base=await updateBase();const r=base&&await getJSON(base+'/api/client',20000);
  if(r&&typeof r.v==='string'&&typeof r.html==='string'&&r.html.includes("const VERSION='"+r.v+"'"))c=r}
 catch(e){console.warn('Marmot could not fetch the current client:',e.message)}
 popup(brandHTML()+'<h3 style="margin-top:16px">Update needed</h3>'+
  '<div class="note" style="margin:0">'+esc(msg||'Your client is using the old group chat protocol, please update your client')+'</div>'+
  (c?'':'<div class="note">The server could not send the new version just now. Try again in a moment.</div>')+
  '<div class="modal-foot"><span class="grow"></span><button class="tbtn" data-u="later">LATER</button>'+
  (c?'<button class="tbtn" data-u="swap">UPDATE NOW</button>'+dlButton(c):'')+'</div>',
  k=>{
   if(k==='later')outdatedShown=false;
   if(k==='get')toast('saved marmot.html — open it and close this tab',8000);
   if(k==='swap'&&c){window.__marmotUpdate={from:VERSION,to:c.v,html:c.html};document.open();document.write(c.html);document.close()}})}
function brandHTML(){return '<div class="brand" style="padding:0">'+LOGO+'<b>MARMOT</b><div class="ver">v'+esc(VERSION)+'</div></div>'}
function dlButton(c){
 const url=URL.createObjectURL(new Blob([c.html],{type:'text/html'}));
 return '<a class="send" style="text-decoration:none" data-u="get" href="'+url+'" download="marmot.html">DOWNLOAD v'+esc(c.v)+'</a>'}
/** Patch notes for the versions after `since` (every one without it), newest first.
    With `html`, they are read out of that copy of the client (as data, never run). */
function notesHTML(since,html){
 let list=PATCH_NOTES;
 if(html)try{list=JSON.parse(html.match(/<script type="application\/json" id="patchNotes">([\s\S]*?)<\/script>/)[1])}catch(e){return ''}
 const part=(t,a)=>Array.isArray(a)&&a.length?'<div class="lbl">'+t+'</div><ol>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>':'';
 return (Array.isArray(list)?list:[]).filter(n=>n&&typeof n.v==='string'&&(!since||newerVer(n.v,since))).map(n=>
  '<div class="pnote"><div class="pnote-v">v'+esc(n.v)+'</div>'+part('NEW FEATURES',n.features)+part('BUG FIXES',n.fixes)+'</div>').join('')}
/** A dialog above everything, the login screen included. pick gets each [data-u] click and
    closes the dialog unless it returns false; a click outside closes it too. */
function popup(html,pick){
 const box=document.createElement('div');
 box.innerHTML='<div class="scrim top"><div class="modal" role="alertdialog" aria-modal="true">'+html+'</div></div>';
 const scrim=box.firstChild;
 const shut=()=>{scrim.classList.add('out');setTimeout(()=>scrim.remove(),180)};
 scrim.addEventListener('click',e=>{const b=e.target.closest('[data-u]');
  if(e.target===scrim)shut();else if(b&&(!pick||pick(b.dataset.u)!==false))shut()});
 document.body.appendChild(scrim);
 const f=scrim.querySelector('[data-u]');if(f)f.focus();
 return scrim}
/** After an auto-update: what changed, and the new file to keep. */
function showUpdated(u){
 popup(brandHTML()+'<h3 style="margin-top:16px">Updated to v'+esc(VERSION)+'</h3>'+
  '<div class="note" style="margin:0">Your copy was v'+esc(u.from)+', so Marmot loaded the latest version from the server. '+
  'Download it to start faster next time, or keep auto-updating.</div>'+
  '<div class="pnotes">'+notesHTML(u.from)+'</div>'+
  '<div class="modal-foot"><span class="grow"></span><button class="tbtn" data-u="keep">KEEP AUTO-UPDATING</button>'+dlButton({v:VERSION,html:u.html})+'</div>',
  k=>{if(k==='get')toast('saved marmot.html — open it in place of the old file',8000)})}
/** Patch notes with nothing to decide: after opening a newer file, or from Settings. */
function showNotes(since){
 popup(brandHTML()+'<h3 style="margin-top:16px">Patch notes</h3>'+
  '<div class="pnotes">'+(notesHTML(since)||'<div class="note">Nothing new.</div>')+'</div>'+
  '<div class="modal-foot"><span class="grow"></span><button class="send" data-u="ok">OK</button></div>')}
/** Settings → DOWNLOAD LATEST: saves the newest client the server has. */
async function saveLatest(){
 const base=await updateBase();if(!base)throw new Error('no server to download from');
 const c=await getJSON(base+'/api/client',20000);
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([c.html],{type:'text/html'}));a.download='marmot.html';
 document.body.appendChild(a);a.click();a.remove();
 toast('saved marmot.html (v'+c.v+')',6000)}

/* ---------- boot ---------- */
(async function boot(){
 Theme.apply();
 const subtle=window.crypto&&crypto.subtle;
 let ok=!!subtle;
 if(ok){try{await crypto.subtle.generateKey({name:'X25519'},false,['deriveBits']);await crypto.subtle.generateKey({name:'Ed25519'},false,['sign'])}catch(e){ok=false}}
 if(!ok){
  document.body.innerHTML='<div style="font:13px/1.8 monospace;color:#ddd;background:#111;padding:40px;min-height:100vh">'+
   'Marmot needs WebCrypto with X25519 and Ed25519 — any current Chrome, Edge, Firefox or Safari.<br>'+
   'If you opened this file from disk and see this, serve it over http://localhost or open it from the Marmot server instead.</div>';
  return}
 if(ON_PAGES)$('#dlHtml').classList.remove('hidden');
 $('.rail .ver').textContent='v'+VERSION;
 UI.renderNow();
 // this page is the copy an auto-update just wrote: it is current, so no second check
 const upd=window.__marmotUpdate;
 if(!upd){if(autoUpdates())await autoUpdate();else checkUpdate()}
 const seen=store.get('seen');
 if(upd&&upd.to===VERSION)showUpdated(upd);
 else if(seen?newerVer(VERSION,seen):store.get('server'))showNotes(seen);   // a newer file opened by hand
 store.set('seen',VERSION);
 const s=store.sget();
 if(s&&s.token){
  try{await M.resume(s);UI.render();UI.accountPrefs();return}
  catch(e){store.sset(null);UI.auth('login',e.network?e.message:'session ended — sign in again');return}}
 UI.auth('login');
})();
}
