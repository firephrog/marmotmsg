<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marmot</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2216%22%20height%3D%2216%22%3E%3Crect%20width%3D%2216%22%20height%3D%2216%22%20fill%3D%22%23151311%22%2F%3E%3Crect%20x%3D%22.5%22%20y%3D%22.5%22%20width%3D%2215%22%20height%3D%2215%22%20fill%3D%22none%22%20stroke%3D%22%23f0a92a%22%2F%3E%3Cg%20transform%3D%22translate(1.75%201.25)%22%3E%3Cg%20transform%3D%22scale(.8)%22%3E%3Cline%20x2%3D%225.5%22%20stroke%3D%22%23f0a92a%22%20x1%3D%221.5%22%20y1%3D%2213.5%22%20y2%3D%2213.5%22%20stroke-width%3D%221.5%22%2F%3E%3Cline%20x2%3D%2214%22%20stroke%3D%22%23f0a92a%22%20y2%3D%222.5%22%20x1%3D%2214%22%20y1%3D%2214.5%22%20stroke-width%3D%222%22%2F%3E%3Cline%20x2%3D%229%22%20stroke%3D%22%23f0a92a%22%20y2%3D%222.5%22%20x1%3D%229%22%20y1%3D%2214.5%22%20stroke-width%3D%222%22%2F%3E%3Cpolyline%20fill%3D%22none%22%20stroke%3D%22%23f0be72%22%20points%3D%225.5%2014%201%2014%207%202.5%2015%202.5%22%2F%3E%3C%2Fg%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0e0d;--rail:#151311;--list:#121110;--row:#1d1a17;--bubble:#1f1c19;--panel:#1a1816;--input:#161412;--line:rgba(255,255,255,0.07);--line2:rgba(255,255,255,0.12);--text:#efece8;--muted:#a39d95;--dim:#837d75;--faint:#6f6962;--avatar:#2d2925;--avatar-fg:#d6d0c8;--accent:#f0a92a;--accent-soft:#f5c36a;--accent-ink:#2a1a02;--accent-wash:rgba(240,169,42,0.12);--ok:#6ecfa8;--ok-line:rgba(110,207,168,0.4);--warn:#e8b64c;--bad:#ff7a63}
[data-theme=light]{--bg:#f8f6f3;--rail:#efebe6;--list:#f3f0ec;--row:#e7e2dc;--bubble:#e9e4de;--panel:#ebe6e0;--input:#efebe6;--line:rgba(40,32,24,0.1);--line2:rgba(40,32,24,0.18);--text:#221d18;--muted:#5f5850;--dim:#736b62;--faint:#8b837a;--avatar:#d9d2ca;--avatar-fg:#3b352f;--accent:#a8620a;--accent-soft:#8a4e04;--accent-ink:#fff7ec;--accent-wash:rgba(168,98,10,0.1);--ok:#1f8a63;--ok-line:rgba(31,138,99,0.4);--warn:#8a6410;--bad:#c2381f}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;width:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,'Segoe UI',sans-serif;overflow:hidden}
.mono,.lbl,.note,.chip,.time,.badge,.grouplbl,.status,.meta,.tbtn,.pill,.send,.stamp,.sys,.kv,.fp,.live,.seg button,.toast,.sn,.search,.inp,.empty{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
.app{position:fixed;inset:0;display:flex;background:var(--bg);overflow:hidden;transition:top .22s ease}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:disabled{opacity:.4;cursor:default}
.hidden{display:none!important}
/* rail */
.rail{width:210px;flex:none;display:flex;flex-direction:column;padding:20px 0 16px;background:var(--rail);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;padding:0 16px}
.logo{width:22px;height:22px;flex:none}
[data-theme=light] .logo>rect:first-child{fill:var(--accent)}
[data-theme=light] .logo>rect+rect{stroke:var(--accent)}
[data-theme=light] .logo line{stroke:var(--accent-ink)}
[data-theme=light] .logo polyline{stroke:#ffe1ad}
.brand b{font-size:17px;font-weight:700;letter-spacing:.04em}
.ver{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--accent);border:1px solid var(--accent);padding:2px 4px}
.tagline{padding:6px 16px 0;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim)}
.rule{height:1px;margin:18px 16px;background:var(--line)}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.nav button{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px 0 12px;color:var(--muted);font-size:13.5px;transition:background .15s,color .15s}
.nav button .dot{width:6px;height:6px;flex:none;border:1px solid var(--faint)}
.nav button .n{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim)}
.nav button:hover{background:var(--row);color:var(--text)}
.nav button[aria-current=page]{background:var(--accent-wash);border-left:2px solid var(--accent);padding-left:10px;color:var(--accent-soft);font-weight:500}
.nav button[aria-current=page] .dot{background:var(--accent);border-color:var(--accent)}
.spacer{flex:1}
.dl{display:block;margin:0 12px 8px;text-align:center}
.me{margin:0 12px 12px;padding:12px;background:var(--panel);border:1px solid var(--line)}
.me-top{display:flex;align-items:center;gap:8px;min-width:0}
.me-top div:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{flex:none;display:flex;align-items:center;justify-content:center;background:var(--avatar);color:var(--avatar-fg);font-family:'JetBrains Mono',monospace}
.av-26{width:26px;height:26px;font-size:11px;background:var(--accent);color:var(--accent-ink)}
.av-34{width:34px;height:34px;font-size:11px}
.fp{margin-top:8px;font-size:9.5px;line-height:1.6;color:var(--dim);word-break:break-all}
.live{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:9.5px;color:var(--ok)}
.live i{width:5px;height:5px;background:currentColor}
.live.off{color:var(--faint)}.live.warn{color:var(--warn)}
.seg{display:flex;gap:1px;margin:0 12px;border:1px solid var(--line2)}
.seg button{flex:1;text-align:center;padding:7px 0;font-size:10px;color:var(--dim);transition:background .2s,color .2s}
.seg button[aria-pressed=true]{background:var(--row);color:var(--text)}
/* list column */
.col{width:340px;flex:none;display:flex;flex-direction:column;background:var(--list);border-right:1px solid var(--line)}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 14px}
.col-head h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em}
.pill{font-size:10px;color:var(--accent-soft);border:1px solid var(--accent);padding:5px 9px}
.pill{transition:background .15s}
.pill:hover{background:var(--accent-wash)}
.search{margin:0 14px 12px;padding:9px 10px;width:calc(100% - 28px);background:var(--input);border:1px solid var(--line);color:var(--text);font-size:11px;transition:border-color .15s}
.search::placeholder,.inp::placeholder{color:var(--faint)}
.search:focus,.inp:focus{outline:none;border-color:var(--accent)}
.rows{flex:1;display:flex;flex-direction:column;overflow-y:auto}
.row{display:flex;gap:11px;align-items:center;padding:12px 16px 12px 18px;width:100%;transition:background .15s,border-color .15s,padding .15s}
.row:hover{background:var(--row)}
.row[aria-current=true]{background:var(--row);border-left:2px solid var(--accent);padding-left:16px}
.row-main{flex:1;min-width:0}
.row-top{display:flex;align-items:center;gap:6px}
.row-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{margin-top:3px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:9px;color:var(--dim);border:1px solid var(--line2);padding:1px 4px;white-space:nowrap}
.chip.ok{color:var(--ok);border-color:var(--ok-line)}
.row-right{flex:none;text-align:right}
.time{font-size:9.5px;color:var(--dim)}
.badge{margin-top:5px;min-width:18px;padding:1px 4px;background:var(--accent);color:var(--accent-ink);font-size:9.5px;text-align:center}
.grouplbl{padding:14px 18px 10px;font-size:9px;letter-spacing:.12em;color:var(--faint);line-height:1.8}
.status{display:flex;align-items:center;gap:8px;padding:11px 16px;border-top:1px solid var(--line);font-size:9.5px;color:var(--dim)}
.status i{width:5px;height:5px;flex:none;background:var(--ok)}
.status i.bad{background:var(--bad)}.status i.idle{background:var(--faint)}
/* main pane */
.pane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.pane-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);min-height:65px}
.pane-title{font-size:15px;font-weight:600}
.meta{margin-top:3px;font-size:9.5px;color:var(--dim)}
.acts{margin-left:auto;display:flex;align-items:center;gap:6px}
.tbtn{padding:7px 10px;border:1px solid var(--line2);font-size:10px;color:var(--muted);white-space:nowrap;transition:border-color .15s,color .15s,background .15s}
.tbtn:hover{border-color:var(--accent);color:var(--accent-soft)}
.tbtn.danger:hover{border-color:var(--bad);color:var(--bad)}
.thread{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;padding:20px 22px;overflow-y:auto}
.day{display:flex;align-items:center;gap:12px}
.day span{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;color:var(--faint)}
.day i{flex:1;height:1px;background:var(--line)}
.msg{max-width:68%}
.msg.in{align-self:flex-start}
.msg.out{align-self:flex-end}
.msg .body{padding:10px 13px;background:var(--bubble);font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;transition:opacity .2s,background .2s,color .2s}
.msg.out .body{background:var(--accent);color:var(--accent-ink)}
.msg.sending .body{opacity:.65}
.msg.failed .body{background:var(--bubble);color:var(--muted);border:1px dashed var(--bad)}
.stamp{margin-top:5px;font-size:9.5px;color:var(--faint)}
.msg.out .stamp{text-align:right}
.stamp button{color:var(--bad);text-decoration:underline}
.sys{align-self:center;max-width:80%;text-align:center;font-size:9.5px;line-height:1.7;color:var(--faint)}
.composer{margin:0 18px 18px;border:1px solid var(--line2);background:var(--input);transition:border-color .15s}
.composer:focus-within{border-color:var(--accent)}
.composer textarea{display:block;width:100%;height:48px;max-height:180px;padding:13px 14px;background:none;border:0;resize:none;color:var(--text);font:400 14px/1.4 'Space Grotesk',system-ui,sans-serif}
.composer textarea:focus{outline:none}
.composer textarea::placeholder{color:var(--faint)}
.composer-bar{display:flex;align-items:center;gap:10px;padding:0 10px 10px}
.hint{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint)}
.send{padding:7px 14px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:500;transition:filter .15s,background .15s,opacity .15s}
.send:hover{filter:brightness(1.08)}
.empty{flex:1;display:grid;place-items:center;font-size:11px;color:var(--faint);text-align:center;line-height:2;padding:20px}
/* settings */
.sheet{flex:1;overflow-y:auto;padding:20px 22px 26px}
.sec{margin-bottom:28px}
.sec h3{margin:0 0 4px;font-size:14px;font-weight:600}
.note{font-size:9.5px;line-height:1.7;color:var(--dim);margin-bottom:14px;max-width:64ch}
.field{margin-bottom:14px}
.lbl{font-size:9px;letter-spacing:.12em;color:var(--faint);margin-bottom:6px}
.inp{width:100%;padding:9px 10px;background:var(--input);border:1px solid var(--line2);color:var(--text);font-size:11px;transition:border-color .15s}
.btnrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.kv{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:10px;max-width:640px}
.kv b{flex:none;width:150px;font-weight:400;color:var(--faint)}
.kv span{color:var(--muted);word-break:break-all}
.err{color:var(--bad);font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.6;min-height:16px;margin-top:8px}
/* overlays */
.scrim{position:fixed;inset:0;background:rgba(10,9,8,.62);display:grid;place-items:center;z-index:20;padding:16px;animation:fade .2s ease both}
.scrim.solid{background:var(--bg)}
.modal{width:440px;max-width:100%;max-height:90vh;overflow-y:auto;background:var(--rail);border:1px solid var(--line2);padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:lift .28s cubic-bezier(.2,.85,.25,1) both}
.modal h3{margin:0 0 4px;font-size:16px;font-weight:600}
.modal-foot{display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.modal-foot .grow{flex:1}
.auth-seg{display:flex;border:1px solid var(--line2);margin:16px 0}
.auth-seg button{flex:1;text-align:center;padding:9px 0;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;color:var(--dim);transition:background .2s,color .2s}
.auth-seg button[aria-pressed=true]{background:var(--accent-wash);color:var(--accent-soft)}
.toasts{position:fixed;left:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:40;max-width:380px}
.toast{padding:10px 12px;background:var(--panel);border:1px solid var(--line2);border-left:2px solid var(--accent);font-size:10px;line-height:1.6;color:var(--muted);animation:slide .25s ease}
.sn{font-size:14px;line-height:2;letter-spacing:.08em;color:var(--text);background:var(--input);border:1px solid var(--line2);padding:12px;text-align:center;word-spacing:.4em}
.back{display:none}
/* peers */
.chip.warn{color:var(--warn);border-color:var(--warn)}
.chip.bad{color:var(--bad);border-color:var(--bad)}
.chip.dc{color:var(--muted);border-color:var(--line2)}
.who{margin-bottom:4px;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--muted)}
.who i{font-style:normal;color:var(--faint)}
.plain{align-self:center;max-width:80%;text-align:center;font-family:'JetBrains Mono',monospace;font-size:9.5px;line-height:1.7;color:var(--warn)}
.grouplbl.note2{padding-top:4px;letter-spacing:.06em}
.more{margin:4px 18px 10px;align-self:flex-start}
.gate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 18px 18px;padding:12px 14px;border:1px dashed var(--line2);font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)}
.gate .grow{flex:1;min-width:160px;line-height:1.6}
.tbtn[aria-pressed=true]{border-color:var(--accent);color:var(--accent-soft);background:var(--accent-wash)}
/* group chats */
.av.grp{font-size:10px;box-shadow:inset 0 0 0 1px var(--accent)}
.picks{max-height:260px;overflow-y:auto;border:1px solid var(--line2);background:var(--input)}
.pick{display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}
.pick:last-child{border-bottom:0}
.pick:hover{background:var(--row)}
.pick input{accent-color:var(--accent);margin:0;flex:none}
.pick .row-main{font-weight:500}
.pick .chip{margin-left:auto}
.picks .grouplbl{padding:12px 10px}
.tabs{display:none}
.tabs button{flex:1;padding:11px 0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;color:var(--dim)}
.tabs button[aria-current=page]{color:var(--accent-soft);box-shadow:inset 0 2px 0 var(--accent)}
.tabs .n{margin-left:4px;color:var(--accent)}
/* voice */
/* while a call is up the whole app moves down and the bar sits above it, so it covers nothing */
.app.with-call{top:58px}
.callbar{position:fixed;top:0;left:0;right:0;height:58px;z-index:30;display:flex;align-items:center;gap:10px;padding:0 16px 0 18px;background:var(--rail);border-bottom:1px solid var(--line2);box-shadow:inset 3px 0 0 var(--accent);animation:drop .22s ease both}
.callbar.ringing{box-shadow:inset 3px 0 0 var(--ok);background:linear-gradient(90deg,var(--accent-wash),transparent 60%),var(--rail)}
.callbar.ringing .av{animation:pulse 1.4s ease-in-out infinite}
.callbar .grow{flex:1;min-width:0}
.callbar .pane-title{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.callbar .who-btn{display:block;max-width:100%}
.callbar .meta{font-variant-numeric:tabular-nums}
.callbar .meta.warn{color:var(--warn)}
.send.ok{background:var(--ok)}
.hang{padding:7px 12px;background:var(--bad);color:#fff;font-size:10px;font-weight:500;font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
.hang{transition:filter .15s}
.hang:hover{filter:brightness(1.08)}
.callbar.out{animation:rise .18s ease both;pointer-events:none}
.scrim.out{animation:fadeout .18s ease both;pointer-events:none}
.scrim.out .modal{animation:sink .18s ease both}
.toast.out{animation:slideout .25s ease both}
/* entering a pane, a column or a message: only when it changes, never on a plain re-render */
.pane.enter{animation:paneIn .24s cubic-bezier(.2,.85,.25,1) both}
.rows.enter{animation:rowsIn .22s ease both}
.msg.new{animation:msgIn .26s cubic-bezier(.2,.85,.25,1) both}
.msg.in.new{transform-origin:left bottom}.msg.out.new{transform-origin:right bottom}
.sys.new{animation:fade .3s ease both}
/* theme switch: everything eases between palettes for a moment */
.theme-fade,.theme-fade *,.theme-fade *::before,.theme-fade *::after{transition:background-color .3s ease,color .3s ease,border-color .3s ease,box-shadow .3s ease!important}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
@keyframes rise{to{opacity:0;transform:translateY(-8px)}}
@keyframes fadeout{to{opacity:0}}
@keyframes sink{to{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes slideout{to{opacity:0;transform:translateX(-14px)}}
@keyframes paneIn{from{opacity:0;transform:translateY(6px)}}
@keyframes paneSide{from{opacity:0;transform:translateX(24px)}}
@keyframes rowsIn{from{opacity:0;transform:translateY(4px)}}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.97)}}
@keyframes pulse{50%{box-shadow:0 0 0 5px var(--accent-wash)}}
@keyframes fade{from{opacity:0}}
@keyframes lift{from{opacity:0;transform:translateY(12px) scale(.98)}}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
/* narrow screens: one column at a time */
@media (max-width:820px){
 .rail{display:none}
 .col{width:100%;border-right:0}
 .app.in-pane .col{display:none}
 .app:not(.in-pane) .pane{display:none}
 .back{display:inline-block}
 .tabs{display:flex;border-top:1px solid var(--line)}
 .gate{margin:0 12px 12px}
 .pane-head .meta,.pane-head .pane-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .callbar .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .msg{max-width:86%}
 .thread{padding:16px}
 .composer{margin:0 12px 12px}
 .pane.enter{animation-name:paneSide}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="rail">
    <div class="brand"><svg class="logo" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" fill="#151311"/><rect x=".5" y=".5" width="15" height="15" fill="none" stroke="#f0a92a"/><g transform="translate(1.75 1.25)"><g transform="scale(.8)"><line x2="5.5" stroke="#f0a92a" x1="1.5" y1="13.5" y2="13.5" stroke-width="1.5"/><line x2="14" stroke="#f0a92a" y2="2.5" x1="14" y1="14.5" stroke-width="2"/><line x2="9" stroke="#f0a92a" y2="2.5" x1="9" y1="14.5" stroke-width="2"/><polyline fill="none" stroke="#f0be72" points="5.5 14 1 14 7 2.5 15 2.5"/></g></g></svg><b>MARMOT</b><div class="ver">v0.4</div></div>
    <div class="tagline">Signal Protocol messaging</div>
    <div class="rule"></div>
    <div class="nav" id="nav">
      <button data-screen="messages" aria-current="page"><i class="dot"></i>Messages<span class="n" id="navUnread"></span></button>
      <button data-screen="peers"><i class="dot"></i>Peers<span class="n" id="navPeers"></span></button>
      <button data-screen="discord" id="navDiscord" class="hidden"><i class="dot"></i>Discord<span class="n" id="navDc"></span></button>
      <button data-screen="settings"><i class="dot"></i>Settings<span class="n"></span></button>
    </div>
    <div class="spacer"></div>

/*<marmot-core>*/
/* Everything between these markers is DOM-free: the protocol, the account
   crypto and the client engine. server/test runs this exact code in Node to
   exercise real clients against a real server. */

/* ---------------------------------------------------------------- utils */
const te=new TextEncoder(),td=new TextDecoder();
function rand(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return a}
function b64(buf){const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)}
function ub64(str){const s=atob(str),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function cat(...parts){const p=parts.map(x=>new Uint8Array(x));const out=new Uint8Array(p.reduce((n,x)=>n+x.length,0));let o=0;for(const x of p){out.set(x,o);o+=x.length}return out}
function hex(buf){return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
const uid=()=>crypto.randomUUID?crypto.randomUUID():hex(rand(16));
const Z32=new Uint8Array(32);
const MAXTEXT=8000,DCTEXT=2000,MAXSDP=60000;
const isDiscord=id=>String(id).startsWith('dc:');
const isGroup=id=>String(id).startsWith('g:');
const GID=/^[0-9a-f]{24}$/,MAXNAME=64;

/* --------------------------------------------------------------- crypto */
/* The Signal construction on WebCrypto primitives:
     agreement      X25519            (X3DH with one-time prekeys, 4 DHs)
     signatures     Ed25519           (signed prekey)
     KDF chains     HKDF-SHA256 / HMAC-SHA256
     payload        AES-256-GCM, header + both identities as associated data
   Signal uses one Curve25519 key for both DH and signing (XEdDSA); WebCrypto
   has no XEdDSA, so an identity here is an X25519 key plus an Ed25519 key,
   and the user id is the hash of the pair. */
const CR={
 async pair(kind){
  const alg=kind==='sign'?{name:'Ed25519'}:{name:'X25519'};
  const k=await crypto.subtle.generateKey(alg,true,kind==='sign'?['sign','verify']:['deriveBits']);
  return {pub:b64(await crypto.subtle.exportKey('raw',k.publicKey)),priv:b64(await crypto.subtle.exportKey('pkcs8',k.privateKey))}},
 async dh(privB64,pubB64){
  const priv=await crypto.subtle.importKey('pkcs8',ub64(privB64),{name:'X25519'},false,['deriveBits']);
  const pub=await crypto.subtle.importKey('raw',ub64(pubB64),{name:'X25519'},false,[]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'X25519',public:pub},priv,256))},
 async sign(privB64,data){
  const k=await crypto.subtle.importKey('pkcs8',ub64(privB64),{name:'Ed25519'},false,['sign']);
  return b64(await crypto.subtle.sign('Ed25519',k,data))},
 async verify(pubB64,sigB64,data){
  try{const k=await crypto.subtle.importKey('raw',ub64(pubB64),{name:'Ed25519'},false,['verify']);
   return await crypto.subtle.verify('Ed25519',k,ub64(sigB64),data)}catch(e){return false}},
 async sha256(bytes){return new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))},
 async hkdf(ikm,salt,info,len){
  const k=await crypto.subtle.importKey('raw',ikm,'HKDF',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'HKDF',hash:'SHA-256',salt,info:te.encode(info)},k,len*8))},
 async hmacKey(raw){return crypto.subtle.importKey('raw',raw,{name:'HMAC',hash:'SHA-256'},false,['sign'])},
 async hmac(key,data){
  if(!(key instanceof CryptoKey))key=await this.hmacKey(key);
  return new Uint8Array(await crypto.subtle.sign('HMAC',key,data))},
 async aesKey(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt'])},
 async pbkdf2(pass,salt,iter){
  const base=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,256))},
 /** Seals a JSON value under an AES-GCM key, bound to `aad`. */
 async seal(key,obj,aad){
  const iv=rand(12);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:aad||new Uint8Array()},key,te.encode(JSON.stringify(obj)));
  return {iv:b64(iv),ct:b64(ct)}},
 async open(key,box,aad){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(box.iv),additionalData:aad||new Uint8Array()},key,ub64(box.ct));
  return JSON.parse(td.decode(pt))},
 /* Double Ratchet KDFs */
 async kdfRoot(rk,dhOut){const b=await this.hkdf(dhOut,rk,'Marmot_Ratchet',64);return [b.slice(0,32),b.slice(32,64)]},
 async kdfChain(ck){const k=await this.hmacKey(ck);return [await this.hmac(k,new Uint8Array([2])),await this.hmac(k,new Uint8Array([1]))]},  // [next chain key, message key]
 async aead(mk,data,aad,decrypt){
  const m=await this.hkdf(mk,Z32,'Marmot_Message',44);
  const key=await this.aesKey(m.slice(0,32)),iv=m.slice(32,44);
  return new Uint8Array(decrypt
   ?await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:aad},key,data)
   :await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:aad},key,data))}
};

/* ------------------------------------------------------- account crypto */
/* The password never leaves the browser. PBKDF2 stretches it once and HKDF
   splits the result in two: an auth key the server checks (it stores only an
   scrypt verifier of it), and a vault key the server never sees, which
   decrypts the vault holding the identity private keys and the data key that
   encrypts everything else the server stores for this account. */
const Acct={
 ITER:600000,MINPASS:10,
 checkPass(p){if(!p||p.length<this.MINPASS)throw new Error('use at least '+this.MINPASS+' characters — this password is the only thing protecting your keys');return p},
 async derive(pass,saltB64,iter){
  const m=await CR.pbkdf2(pass,ub64(saltB64),iter);
  const auth=await CR.hkdf(m,Z32,'Marmot_Auth',32);
  const vk=await CR.hkdf(m,Z32,'Marmot_Vault',32);
  return {auth:b64(auth),vkRaw:b64(vk),vaultKey:await CR.aesKey(vk)}},
 async userId(ikPub,skPub){return hex(await CR.sha256(cat(ub64(ikPub),ub64(skPub)))).slice(0,32)},
 async newIdentity(){
  const ik=await CR.pair('dh'),sk=await CR.pair('sign'),spk=await CR.pair('dh');
  spk.id=1;spk.sig=await CR.sign(sk.priv,ub64(spk.pub));
  return {ik,sk,spk}},
 async opks(start,n){const out=[];for(let i=0;i<n;i++){const p=await CR.pair('dh');out.push({id:start+i,pub:p.pub,priv:p.priv})}return out},
 /** Safety number: 30 digits per identity, the two halves in canonical order.
     Both people see the same 60 digits iff each holds the other's real keys. */
 async safety(a,b){
  const half=async x=>{
   const h=await CR.sha256(cat(te.encode('Marmot_Safety_1'),ub64(x.ik),ub64(x.sk)));
   let s='';for(let i=0;i<6;i++){let n=0;for(let j=0;j<5;j++)n=n*256+h[i*5+j];s+=String(n%100000).padStart(5,'0')}
   return s};
  const [x,y]=[await half(a),await half(b)].sort();
  return (x+y).match(/.{5}/g).join(' ')}
};

/* -------------------------------------------------------- double ratchet */
/* Pure functions over plain-JSON session state: every step works on a copy,
   and the caller persists the result atomically with whatever the step
   produced (a stored message, an outgoing envelope, a mailbox ack). A forged
   or corrupt frame therefore cannot advance — or destroy — a session. */
const Ratchet={
 MAX_SKIP:1000,MAX_KEPT:2000,ARCHIVE:3,
 F:new Uint8Array(32).fill(255),
 clone:x=>JSON.parse(JSON.stringify(x)),
 empty:()=>({active:null,archived:[],eks:[]}),
 aad(st,h){return te.encode('Marmot_v1|'+st.ad+'|'+h.dh+'|'+h.pn+'|'+h.n)},

 /** X3DH, initiator side, from a fetched prekey bundle. */
 async initiate(me,b){
  if(!await CR.verify(b.sk,b.spk.sig,ub64(b.spk.pub)))throw new Error('signed prekey failed verification');
  const ek=await CR.pair('dh');
  const parts=[this.F,await CR.dh(me.ik.priv,b.spk.pub),await CR.dh(ek.priv,b.ik),await CR.dh(ek.priv,b.spk.pub)];
  if(b.opk)parts.push(await CR.dh(ek.priv,b.opk.pub));
  const sk=await CR.hkdf(cat(...parts),Z32,'Marmot_X3DH',32);
  const st={rk:b64(sk),cks:null,ckr:null,dhs:null,dhr:b.spk.pub,ns:0,nr:0,pn:0,skipped:{},
   ad:me.ik.pub+'.'+b.ik,peer:{ik:b.ik,sk:b.sk},
   pre:{ik:me.ik.pub,sk:me.sk.pub,ek:ek.pub,spk:b.spk.id,opk:b.opk?b.opk.id:null}};
  await this._sendStep(st);
  return st},

 /** X3DH, responder side, from the prekey header on an inbound message. */
 async respond(me,pre,spk,opk){
  const parts=[this.F,await CR.dh(spk.priv,pre.ik),await CR.dh(me.ik.priv,pre.ek),await CR.dh(spk.priv,pre.ek)];
  if(opk)parts.push(await CR.dh(opk.priv,pre.ek));
  const sk=await CR.hkdf(cat(...parts),Z32,'Marmot_X3DH',32);
  return {rk:b64(sk),cks:null,ckr:null,dhs:{pub:spk.pub,priv:spk.priv},dhr:null,ns:0,nr:0,pn:0,skipped:{},
   ad:pre.ik+'.'+me.ik.pub,peer:{ik:pre.ik,sk:pre.sk},pre:null}},

 /** Makes a freshly initiated session active, keeping the old one to decrypt
     anything still in flight under it. */
 install(rec,st){
  const r=this.clone(rec);r.eks=r.eks||[];
  if(r.active)r.archived=[r.active].concat(r.archived||[]).slice(0,this.ARCHIVE);
  r.active=st;return r},

 async _sendStep(st){
  const kp=await CR.pair('dh');st.dhs=kp;
  const [rk,ck]=await CR.kdfRoot(ub64(st.rk),await CR.dh(kp.priv,st.dhr));
  st.rk=b64(rk);st.cks=b64(ck);st.ns=0},

 async _dhRatchet(st,their){
  st.pn=st.ns;st.ns=0;st.nr=0;st.dhr=their;
  const [rk,ck]=await CR.kdfRoot(ub64(st.rk),await CR.dh(st.dhs.priv,their));
  st.rk=b64(rk);st.ckr=b64(ck);
  await this._sendStep(st)},

 async _skip(st,until){
  if(!st.ckr)return;
  if(until-st.nr>this.MAX_SKIP)throw new Error('too many skipped messages');
  while(st.nr<until){
   const [next,mk]=await CR.kdfChain(ub64(st.ckr));
   st.skipped[st.dhr+'|'+st.nr]=b64(mk);st.ckr=b64(next);st.nr++}
  const keys=Object.keys(st.skipped);
  if(keys.length>this.MAX_KEPT)keys.slice(0,keys.length-this.MAX_KEPT).forEach(k=>delete st.skipped[k])},

 async encrypt(rec,inner){
  const r=this.clone(rec),st=r.active;
  if(!st||!st.cks)throw new Error('no sending chain');
  const [next,mk]=await CR.kdfChain(ub64(st.cks));
  st.cks=b64(next);
  const h={dh:st.dhs.pub,pn:st.pn,n:st.ns};st.ns++;
  const ct=await CR.aead(mk,te.encode(JSON.stringify(inner)),this.aad(st,h));
  const env={v:1,h,ct:b64(ct)};
  if(st.pre)env.pre=st.pre;          // repeated until the peer replies
  return {rec:r,env}},

 async _open(st,env){
  const h=env.h;
  if(!h||typeof h.dh!=='string'||!Number.isInteger(h.n)||!Number.isInteger(h.pn)||h.n<0||h.pn<0)throw new Error('malformed header');
  const ct=ub64(env.ct),aad=this.aad(st,h),sk=h.dh+'|'+h.n;
  if(st.skipped[sk]){
   const pt=await CR.aead(ub64(st.skipped[sk]),ct,aad,true);
   delete st.skipped[sk];return JSON.parse(td.decode(pt))}
  if(h.dh!==st.dhr){await this._skip(st,h.pn);await this._dhRatchet(st,h.dh)}
  await this._skip(st,h.n);
  if(!st.ckr)throw new Error('no receiving chain');
  const [next,mk]=await CR.kdfChain(ub64(st.ckr));
  st.ckr=b64(next);st.nr++;
  const pt=await CR.aead(mk,ct,aad,true);
  st.pre=null;                       // the peer has answered: handshake complete
  return JSON.parse(td.decode(pt))},

 /** Tries the active session, then superseded ones, then — if the frame
     carries a prekey header — a new responder handshake. Whichever opens the
     frame becomes active, so two people who start a session at the same
     moment converge on one instead of losing messages.
     ctx: {me, peerId, spk(id), opk(id)} */
 async decrypt(rec,env,ctx){
  if(!env||env.v!==1||typeof env.ct!=='string')throw new Error('malformed envelope');
  const tries=[];
  if(rec.active)tries.push([rec.active,-1]);
  (rec.archived||[]).forEach((a,i)=>tries.push([a,i]));
  let last=null;
  for(const [s,i] of tries){
   try{const st=this.clone(s);const inner=await this._open(st,env);return {rec:this._promote(rec,st,i),inner,opk:null}}
   catch(e){last=e}}
  const pre=env.pre;
  if(!pre)throw last||new Error('no session with this sender');
  if(await Acct.userId(pre.ik,pre.sk)!==ctx.peerId)throw new Error('handshake keys do not belong to the sender');
  if((rec.eks||[]).includes(pre.ek))throw new Error('replayed handshake');
  const spk=ctx.spk(pre.spk);
  if(!spk)throw new Error('handshake targets an unknown signed prekey');
  let opk=null;
  if(pre.opk!=null){opk=ctx.opk(pre.opk);if(!opk)throw new Error('handshake used a one-time prekey that is already spent')}
  const st=await this.respond(ctx.me,pre,spk,opk);
  const inner=await this._open(st,env);
  const r=this._promote(rec,st,-2);
  r.eks=[pre.ek].concat(r.eks||[]).slice(0,64);
  return {rec:r,inner,opk:pre.opk}},

 _promote(rec,st,idx){
  const r=this.clone(rec);r.archived=r.archived||[];r.eks=r.eks||[];
  if(idx===-1){r.active=st;return r}
  const keep=r.archived.filter((_,i)=>i!==idx);
  if(r.active)keep.unshift(r.active);
  r.archived=keep.slice(0,this.ARCHIVE);r.active=st;return r}
};

/* ----------------------------------------------------------- the engine */
/* Records live in memory under logical keys and are mirrored to the server
   as blobs, each AES-GCM sealed with the account's data key and stored under
   an HMAC of its logical key — the server sees neither names nor contents.
     prof              {nextOpk}
     opk:<id>          one-time prekey pair
     peer:<userId>     pinned identity {userId,username,ik,sk,verified}
     sess:<userId>     ratchet record {active,archived,eks}
     msg:<userId>:<id> message {id,peer,dir,text,ts,state}
   Relationships (friends, requests, blocks) are not records: the server
   holds them, because it is the server that refuses traffic between
   strangers. They are kept in this.peers as {userId,username,state,since}.
   Discord channels are conversations too, under the id "dc:<linkId>". They
   are NOT end-to-end encrypted: the server relays them in plaintext. Their
   messages arrive as server-originated envelopes and are stored like any
   other msg: record; this.links holds the channels this account is in.
   Group chats are conversations under the id "g:<groupId>". Who is in a
   group is held by the server (this.groups), because it is the server that
   lets members who are not friends reach each other. Everything said in a
   group, its name included, is end-to-end encrypted: each message is sent
   once per member over the ordinary pairwise ratchet, tagged with the group.
     grp:<groupId>     {members:[userId]} as last seen, to tell joins and leaves apart
     gname:<groupId>   {name,ts,by} the group's name, newest wins
     msg:g:<groupId>:<id>  message, with `from` on inbound ones and `got`
                       (who has confirmed delivery) on outbound ones */
class Tx{
 constructor(c){this.c=c;this.puts=[];this.dels=[];this.ack=[];this.send=[];this.opks=[];this.mem=new Map()}
 async put(logical,d){
  const k=await this.c.name(logical);
  const box=await CR.seal(this.c.key,{k:logical,d},te.encode(k));
  this.puts=this.puts.filter(p=>p.k!==k);this.puts.push({k,v:JSON.stringify(box)});
  this.mem.set(logical,[d,k]);return this}
 async del(logical){const k=await this.c.name(logical);this.dels.push(k);this.mem.set(logical,[null,k]);return this}
 body(){return {puts:this.puts,dels:this.dels,ack:this.ack,send:this.send,opks:this.opks}}
 apply(){for(const [l,[d,k]] of this.mem)d===null?this.c._del(l):this.c._set(l,d,k)}
 async commit(){
  const r=await this.c.api('POST','/api/commit',this.body());
  this.apply();
  if(r.opkCount!=null)this.c.opkCount=r.opkCount;
  this.c.emit('change');return r}
}

/* ---------------------------------------------------------------- voice */
/* Voice calls are WebRTC, so the audio is SRTP keyed by a DTLS handshake
   between the two browsers. What makes that end-to-end is the signalling: the
   offer and answer, which carry each side's DTLS certificate fingerprint,
   travel as ordinary Double Ratchet messages. The server relays them but can
   neither read nor alter them, so it cannot put itself in the middle of the
   DTLS handshake. A TURN relay, when one is needed, forwards SRTP it cannot
   decrypt.
   One call at a time. Signals are {k:'call', t, call:<id>, sdp?} with t one
   of offer | answer | decline | busy | end. Each call leaves one line in the
   chat history, stored like any other record. */
class Voice{
 constructor(c,opts){
  this.c=c;this.call=null;
  this.RTC=opts.RTCPeerConnection||globalThis.RTCPeerConnection||null;
  const md=globalThis.navigator&&globalThis.navigator.mediaDevices;
  this.getMedia=opts.getUserMedia||(md&&md.getUserMedia?k=>md.getUserMedia(k):null);
  this.ring=opts.ring||45000;        // how long an unanswered call rings
  this.connect=opts.connectWait||20000;
  this.grace=opts.grace||10000;      // how long a dropped connection may take to recover
  this.gather=opts.gather||4000}
 supported(){return !!(this.RTC&&this.getMedia)}
 why(){return this.RTC?'voice calls need microphone access: open Marmot over https or from localhost':'this browser does not support voice calls'}
 emit(){this.c.emit('call',this.call)}
 send(call,t,extra){return this.c._sendInner(call.peer,Object.assign({k:'call',t,call:call.id},extra))}

 async start(peerId){
  const cur=this.call;
  if(cur&&cur.peer===peerId&&cur.dir==='in'&&cur.state==='ringing')return this.accept();
  if(cur)throw new Error('you are already in a call');
  if(!this.supported())throw new Error(this.why());
  if(!this.c.isFriend(peerId))throw new Error('you can only call friends');
  const call=this.call={id:uid(),peer:peerId,dir:'out',state:'calling',created:Date.now(),muted:false};
  this.emit();
  try{
   await this._open(call);
   await call.pc.setLocalDescription(await call.pc.createOffer());
   await this._gathered(call.pc);
   if(this.call!==call)return null;
   call.timer=setTimeout(()=>{if(this.call===call&&call.state==='calling')this.hangup('timeout')},this.ring);
   await this.send(call,'offer',{sdp:call.pc.localDescription.sdp});
  }catch(e){
   if(this.call!==call)return null;        // hung up while starting
   this._finish(call,'failed',e.message);this.send(call,'end').catch(()=>{});throw e}
  return call}

 async accept(){
  const call=this.call;
  if(!call||call.dir!=='in'||call.state!=='ringing')return null;
  if(!this.supported()){const e=new Error(this.why());this.decline();throw e}
  call.state='connecting';clearTimeout(call.timer);this.emit();
  try{
   await this._open(call);
   await call.pc.setRemoteDescription({type:'offer',sdp:call.offer});
   await call.pc.setLocalDescription(await call.pc.createAnswer());
   await this._gathered(call.pc);
   if(this.call!==call)return null;
   call.timer=setTimeout(()=>{if(this.call===call&&call.state!=='active')this.hangup('lost')},this.connect);
   await this.send(call,'answer',{sdp:call.pc.localDescription.sdp});
  }catch(e){
   if(this.call!==call)return null;
   this.hangup('failed',e.message);throw e}
  return call}

 decline(){
  const call=this.call;
  if(!call||call.dir!=='in'||call.state!=='ringing')return;
  this._finish(call,'declined');return this.send(call,'decline').catch(()=>{})}

 /** Resolves once the other side has been told (or telling them failed). */
 hangup(how,detail){
  const call=this.call;if(!call)return Promise.resolve();
  if(call.dir==='in'&&call.state==='ringing'&&!how)return this.decline();
  this._finish(call,how||'ended',detail);return this.send(call,'end').catch(()=>{})}

 setMuted(on){
  const call=this.call;if(!call)return;
  call.muted=!!on;
  if(call.stream)call.stream.getTracks().forEach(t=>{t.enabled=!on});
  this.emit()}

 /** Microphone, ICE servers and the peer connection, checking after each wait
     that the call was not hung up meanwhile (and releasing the mic if it was). */
 async _open(call){
  const stream=await this.getMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
  if(this.call!==call){stream.getTracks().forEach(t=>t.stop());throw new Error('call ended')}
  call.stream=stream;
  if(call.muted)stream.getTracks().forEach(t=>{t.enabled=false});
  let ice={iceServers:[]};
  try{ice=await this.c.api('GET','/api/ice')}catch(e){}
  if(this.call!==call)throw new Error('call ended');
  const pc=call.pc=new this.RTC({iceServers:ice.iceServers||[]});
  for(const t of stream.getTracks())pc.addTrack(t,stream);
  pc.ontrack=ev=>{if(this.call!==call)return;call.remote=(ev.streams&&ev.streams[0])||null;this.emit()};
  const watch=()=>{
   if(this.call!==call)return;
   const s=pc.connectionState||pc.iceConnectionState;
   if(s==='connected'||s==='completed'){
    clearTimeout(call.lost);call.unstable=false;
    if(call.state!=='active'){call.state='active';call.started=Date.now();clearTimeout(call.timer)}
    this.emit()}
   else if(s==='disconnected'&&call.state==='active'&&!call.unstable){
    call.unstable=true;this.emit();
    call.lost=setTimeout(()=>{if(this.call===call&&call.unstable)this.hangup('lost')},this.grace)}
   else if(s==='failed')this.hangup('lost')};
  pc.onconnectionstatechange=watch;pc.oniceconnectionstatechange=watch}

 /** Waits for ICE gathering so the offer/answer carries every candidate:
     one signal each way instead of a stream of trickled candidates. */
 _gathered(pc){
  if(pc.iceGatheringState==='complete')return Promise.resolve();
  return new Promise(res=>{
   const done=()=>{clearTimeout(t);res()},t=setTimeout(done,this.gather);
   pc.onicegatheringstatechange=()=>{if(pc.iceGatheringState==='complete')done()};
   pc.onicecandidate=ev=>{if(!ev.candidate)done()}})}

 /** Inbound signal from a friend, already authenticated by the ratchet. */
 _signal(peer,s,ts){
  const call=this.call,mine=!!call&&call.peer===peer&&call.id===s.call;
  if(s.t==='offer'){
   if(typeof s.sdp!=='string')return;
   if(call&&call.peer===peer&&call.dir==='out'&&call.state==='calling'){
    // both called at once: the call from the lower user id goes ahead, the other side answers it
    if(this.c.me.userId<peer)return;
    this._drop(call)}
   else if(call){
    if(call.peer!==peer)this.c._logCall(peer,'call-'+s.call,ts,'missed voice call (you were on another call)',true).catch(()=>{});
    this.send({peer,id:s.call},'busy').catch(()=>{});return}
   const glare=!!call;
   const c=this.call={id:s.call,peer,dir:'in',state:'ringing',created:ts,offer:s.sdp,muted:false};
   c.timer=setTimeout(()=>{if(this.call===c&&c.state==='ringing')this._finish(c,'timeout')},Math.max(1000,this.ring-(this.c.serverNow()-ts)));
   this.emit();
   if(glare)this.accept().catch(()=>{});
   return}
  if(!mine)return;
  if(s.t==='answer'&&call.dir==='out'&&call.state==='calling'&&typeof s.sdp==='string'){
   call.state='connecting';clearTimeout(call.timer);this.emit();
   call.timer=setTimeout(()=>{if(this.call===call&&call.state!=='active')this.hangup('lost')},this.connect);
   call.pc.setRemoteDescription({type:'answer',sdp:s.sdp}).catch(e=>{if(this.call===call)this.hangup('failed',e.message)})}
  else if((s.t==='decline'||s.t==='busy')&&call.dir==='out')this._finish(call,s.t==='busy'?'busy':'declined');
  else if(s.t==='end')this._finish(call,'ended')}

 /** Ends a call without a trace: sign-out, or yielding to a crossing call. */
 _drop(call){
  call=call||this.call;if(!call||this.call!==call)return;
  this.call=null;
  clearTimeout(call.timer);clearTimeout(call.lost);
  if(call.stream)call.stream.getTracks().forEach(t=>t.stop());
  if(call.pc)try{call.pc.close()}catch(e){}
  this.emit()}

 _finish(call,how,detail){
  if(this.call!==call)return;
  this._drop(call);
  let text;
  if(call.started)text='voice call · '+clock(Math.round((Date.now()-call.started)/1000))+(how==='lost'?' · connection lost':'');
  else if(call.dir==='in')text={declined:'declined voice call',lost:'voice call failed: could not connect',
   failed:'voice call failed: '+detail}[how]||'missed voice call';
  else text={timeout:'no answer',declined:'voice call declined',busy:'they were on another call',
   lost:'voice call failed: could not connect',failed:'voice call failed: '+detail}[how]||'cancelled voice call';
  const missed=call.dir==='in'&&call.state==='ringing'&&how!=='declined';
  this.c._logCall(call.peer,'call-'+call.id,call.created,text,missed).catch(()=>{})}
}

class MarmotClient{
 constructor(opts){
  opts=opts||{};
  this.WS=opts.WebSocket||globalThis.WebSocket;
  this.iter=opts.iter||Acct.ITER;
  this.opkBatch=opts.opkBatch||50;
  this.handlers=new Map();this.server='';this.ws=null;
  this.voice=new Voice(this,opts);
  this._reset()}

 _reset(){
  this.closing=true;
  this.voice._drop();
  if(this.ws){try{this.ws.close()}catch(e){}}
  clearTimeout(this._wsTimer);clearTimeout(this._retryTimer);
  Object.assign(this,{token:null,vk:null,me:null,vault:null,key:null,mac:null,ws:null,wsState:'closed',
   recs:new Map(),names:new Map(),byPeer:new Map(),pending:new Map(),done:new Set(),queued:new Set(),
   locks:new Map(),inq:Promise.resolve(),unread:new Map(),opkCount:null,_backoff:0,
   peers:new Map(),peersLoaded:false,discoverable:false,links:new Map(),publicLinks:[],discordEnabled:false,skew:0,
   groups:new Map()})}

 /** The server's clock, as of the last socket handshake. Envelope timestamps are server time. */
 serverNow(){return Date.now()+this.skew}

 on(ev,fn){if(!this.handlers.has(ev))this.handlers.set(ev,[]);this.handlers.get(ev).push(fn);return this}
 emit(ev,...a){for(const fn of this.handlers.get(ev)||[]){try{fn(...a)}catch(e){console.error(e)}}}

 setServer(url){
  url=String(url||'').trim().replace(/\/+$/,'');
  if(!/^https?:\/\/[^\s/]+/i.test(url))throw new Error('server address must start with http:// or https://');
  this.server=url}

 async api(method,path,body){
  let res;
  try{res=await fetch(this.server+path,{method,
   headers:Object.assign({'Content-Type':'application/json'},this.token?{Authorization:'Bearer '+this.token}:{}),
   body:body===undefined?undefined:JSON.stringify(body)})}
  catch(e){const err=new Error('cannot reach the server at '+this.server);err.network=true;throw err}
  let j={};try{j=await res.json()}catch(e){}
  if(!res.ok||j.ok===false){
   const err=new Error(j.error||('server error '+res.status));err.status=res.status;
   if(res.status===401&&this.token&&path!=='/api/account/delete')this._signedOut(err.message);
   throw err}
  return j}

 /** Serialise async work per key — a ratchet must never be stepped twice at once. */
 lock(key,fn){
  const prev=this.locks.get(key)||Promise.resolve();
  const run=prev.then(fn,fn);
  this.locks.set(key,run.catch(()=>{}));
  return run}

 /* ---- record store ---- */
 async name(logical){
  let k=this.names.get(logical);if(k)return k;
  k=hex(await CR.hmac(this.mac,te.encode(logical))).slice(0,32);
  this.names.set(logical,k);return k}
 get(logical){return this.recs.get(logical)}
 _set(logical,d,k){
  this.recs.set(logical,d);if(k)this.names.set(logical,k);
  if(logical.startsWith('msg:')){let m=this.byPeer.get(d.peer);if(!m)this.byPeer.set(d.peer,m=new Map());m.set(d.id,d)}}
 _del(logical){
  const d=this.recs.get(logical);this.recs.delete(logical);
  if(d&&logical.startsWith('msg:')){const m=this.byPeer.get(d.peer);if(m)m.delete(d.id)}}
 async _loadStore(){
  const r=await this.api('GET','/api/store');
  let bad=0;
  for(const b of r.blobs){
   try{const o=await CR.open(this.key,JSON.parse(b.v),te.encode(b.k));
    if(await this.name(o.k)!==b.k)throw new Error('misfiled');   // a blob moved under another name
    this._set(o.k,o.d,b.k)}
   catch(e){bad++}}
  if(bad)console.warn(bad+' stored records could not be opened');}

 async _install(vault,info){
  this.vault=vault;
  this.key=await CR.aesKey(ub64(vault.dataKey));
  this.mac=await CR.hmacKey(ub64(vault.macKey));
  this.me={userId:info.userId,username:info.username,ik:vault.ik,sk:vault.sk,spk:vault.spk,created:vault.created}}
 _spk(id){const v=this.vault;if(v.spk.id===id)return v.spk;return (v.spks||[]).find(s=>s.id===id)||null}

 /* ---- account ---- */
 async signup(username,pass){
  username=String(username||'').trim();
  Acct.checkPass(pass);
  try{
   const salt=b64(rand(16));
   const d=await Acct.derive(pass,salt,this.iter);
   const id=await Acct.newIdentity();
   const userId=await Acct.userId(id.ik.pub,id.sk.pub);
   const vault={v:1,ik:id.ik,sk:id.sk,spk:id.spk,spks:[],dataKey:b64(rand(32)),macKey:b64(rand(32)),created:Date.now()};
   const sealed=await CR.seal(d.vaultKey,vault,te.encode('Marmot_Vault'));
   await this._install(vault,{userId,username});
   const opks=await Acct.opks(1,this.opkBatch);
   const tx=new Tx(this);
   for(const o of opks)await tx.put('opk:'+o.id,o);
   await tx.put('prof',{nextOpk:this.opkBatch+1});
   const r=await this.api('POST','/api/signup',{username,userId,salt,iter:this.iter,auth:d.auth,vault:sealed,
    identity:{ik:id.ik.pub,sk:id.sk.pub},spk:{id:id.spk.id,pub:id.spk.pub,sig:id.spk.sig},
    opks:opks.map(o=>({id:o.id,pub:o.pub})),puts:tx.puts});
   tx.apply();
   this.token=r.token;this.vk=d.vkRaw;this.me.username=r.username;this.opkCount=opks.length;this.peersLoaded=true;
  }catch(e){this._reset();throw e}
  this.connect();this.emit('change');
  return this.me}

 async login(username,pass){
  username=String(username||'').trim();
  try{
   const pre=await this.api('POST','/api/prelogin',{username});
   const d=await Acct.derive(pass,pre.salt,pre.iter);
   const r=await this.api('POST','/api/login',{username,auth:d.auth});
   this.token=r.token;this.vk=d.vkRaw;this.discoverable=!!r.discoverable;
   await this._openVault(r.vault,d.vaultKey,r.userId,r.username);
  }catch(e){this._reset();throw e}
  this.connect();this.replenish().catch(()=>{});this.emit('change');
  return this.me}

 /** Picks a signed-in tab back up after a reload (token + vault key kept in sessionStorage). */
 async resume(s){
  this.setServer(s.server);this.token=s.token;this.vk=s.vk;
  try{
   const me=await this.api('GET','/api/me');
   const v=await this.api('GET','/api/vault');
   await this._openVault(v.vault,await CR.aesKey(ub64(s.vk)),me.userId,me.username);
   this.opkCount=me.opkCount;this.discoverable=!!me.discoverable;
  }catch(e){this._reset();throw e}
  this.connect();this.replenish().catch(()=>{});this.emit('change');
  return this.me}

 async _openVault(box,vaultKey,userId,username){
  let v;
  try{v=await CR.open(vaultKey,box,te.encode('Marmot_Vault'))}catch(e){throw new Error('could not open the account vault')}
  // the server could have swapped the record: bind the recovered keys to the id
  if(await Acct.userId(v.ik.pub,v.sk.pub)!==userId)throw new Error('account record does not match its keys — refusing to sign in');
  await this._install(v,{userId,username});
  await this._loadStore();
  await this.loadPeers();
  await this.loadGroups().catch(()=>{});
  await this.loadLinks().catch(()=>{})}

 session(){return this.token?{server:this.server,token:this.token,vk:this.vk}:null}

 async logout(){
  await this.voice.hangup();
  try{await this.api('POST','/api/logout')}catch(e){}
  this._reset();this.emit('signedout','');this.emit('change')}

 async deleteAccount(pass){
  const pre=await this.api('POST','/api/prelogin',{username:this.me.username});
  const d=await Acct.derive(pass,pre.salt,pre.iter);
  await this.api('POST','/api/account/delete',{auth:d.auth});
  this._reset();this.emit('signedout','account deleted');this.emit('change')}

 _signedOut(reason){
  if(!this.token)return;
  this._reset();this.emit('signedout',reason||'signed out');this.emit('change')}

 /* ---- live connection ---- */
 connect(){
  if(!this.WS||!this.token)return;
  this.closing=false;
  const ws=new this.WS(this.server.replace(/^http/i,'ws')+'/ws');
  this.ws=ws;this.wsState='connecting';this.emit('status');
  ws.onopen=()=>ws.send(JSON.stringify({t:'auth',token:this.token}));
  ws.onmessage=ev=>{
   let m;try{m=JSON.parse(ev.data)}catch(e){return}
   if(m.t==='ready'){if(Number.isFinite(m.ts))this.skew=m.ts-Date.now();this.wsState='live';this._backoff=0;this.emit('status');this.drain().catch(()=>{});this.loadPeers().catch(()=>{});this.loadGroups().catch(()=>{});this.loadLinks().catch(()=>{})}
   else if(m.t==='env'&&m.env)this._enqueue(m.env);
   else if(m.t==='peers')this.loadPeers().catch(()=>{});
   else if(m.t==='groups')this.loadGroups().catch(()=>{});
   else if(m.t==='links')this.loadLinks().catch(()=>{});
   else if(m.t==='prekeys')this.replenish().catch(()=>{});
   else if(m.t==='revoked')this._signedOut('this account was signed in on another device')};
  ws.onerror=()=>{};
  ws.onclose=()=>{
   if(this.ws!==ws)return;
   this.ws=null;this.wsState='closed';this.emit('status');
   if(this.closing||!this.token)return;
   this._backoff=Math.min(30000,(this._backoff||500)*2);
   this._wsTimer=setTimeout(()=>this.connect(),this._backoff)}}

 /** Pulls everything waiting in the mailbox. Envelopes the socket already
     delivered are skipped, so the two paths never double-process a frame. */
 async drain(){
  if(this._draining)return this._draining;
  this._draining=(async()=>{
   try{
    for(let round=0;round<20;round++){
     const r=await this.api('GET','/api/inbox');
     r.envelopes.forEach(e=>this._enqueue(e));
     await this.inq;
     if(r.envelopes.length<300)break}
   }finally{this._draining=null}})();
  return this._draining}

 _enqueue(e){
  if(!this.token||this.done.has(e.id)||this.queued.has(e.id))return;
  this.queued.add(e.id);
  this.inq=this.inq.then(()=>this._handle(e)).catch(err=>{
   console.warn('envelope '+e.id+' not processed yet:',err.message);
   this._retrySoon()}).finally(()=>this.queued.delete(e.id))}

 _retrySoon(){clearTimeout(this._retryTimer);this._retryTimer=setTimeout(()=>{if(this.token)this.drain().catch(()=>{})},4000)}

 async _peerRecord(peerId,tx){
  const have=this.get('peer:'+peerId);if(have)return have;
  let p={userId:peerId,username:null,verified:false,added:Date.now()};
  try{const r=await this.api('GET','/api/users/lookup?id='+encodeURIComponent(peerId));
   if(await Acct.userId(r.user.ik,r.user.sk)===peerId)p=Object.assign(p,{username:r.user.username,ik:r.user.ik,sk:r.user.sk})}
  catch(e){if(e.network)throw e}
  await tx.put('peer:'+peerId,p);return p}

 /** One inbound envelope → one atomic commit: the advanced ratchet, the stored
     message, the receipt going back, the spent prekey and the mailbox ack all
     land together, or nothing does and the envelope is retried. */
 async _handle(e){
  if(this.done.has(e.id)||!this.token)return;
  if(isDiscord(e.from))return this._handleDiscord(e);
  const peerId=e.from;
  let note=null,sig=null;
  await this.lock(peerId,async()=>{
   if(this.done.has(e.id))return;
   let env=null;try{env=JSON.parse(e.payload)}catch(x){}
   const rec=this.get('sess:'+peerId)||Ratchet.empty();
   let out=null,why='';
   try{out=await Ratchet.decrypt(rec,env,{me:this.me,peerId,spk:id=>this._spk(id),opk:id=>this.get('opk:'+id)})}
   catch(x){why=x.message||'authentication failed'}
   const tx=new Tx(this);tx.ack.push(e.id);
   await this._peerRecord(peerId,tx);
   if(!out){
    const id='x'+e.id;
    await tx.put('msg:'+peerId+':'+id,{id,peer:peerId,dir:'sys',ts:e.ts,text:'a message could not be decrypted ('+why+')'});
   }else{
    let sess=out.rec;
    const inner=out.inner||{};
    if(out.opk!=null)await tx.del('opk:'+out.opk);
    if(inner.g!=null){
     const r=await this._groupInner(peerId,inner,e,tx,sess);
     sess=r.sess;note=r.note}
    else if(inner.k==='text'&&typeof inner.t==='string'&&inner.id){
     const key='msg:'+peerId+':'+inner.id;
     if(!this.get(key)){
      const ts=Math.min(Number(inner.ts)||e.ts,e.ts);
      await tx.put(key,{id:String(inner.id),peer:peerId,dir:'in',text:inner.t.slice(0,MAXTEXT),ts,state:'received'});
      note={peer:peerId,text:inner.t}}
     const r=await Ratchet.encrypt(sess,{k:'receipt',ids:[inner.id]});
     sess=r.rec;tx.send.push({to:peerId,payload:JSON.stringify(r.env),optional:true});
    }else if(inner.k==='receipt'&&Array.isArray(inner.ids)){
     for(const id of inner.ids.slice(0,100)){
      const key='msg:'+peerId+':'+id,m=this.get(key);
      if(m&&m.dir==='out'&&m.state!=='delivered')await tx.put(key,Object.assign({},m,{state:'delivered'}))}}
    else if(inner.k==='call'&&typeof inner.call==='string'&&inner.call.length<=64&&
     ['offer','answer','decline','busy','end'].includes(inner.t)&&(inner.sdp==null||(typeof inner.sdp==='string'&&inner.sdp.length<=MAXSDP))){
     const key='msg:'+peerId+':call-'+inner.call;
     // an offer that waited in the mailbox past its ring time is a missed call, not a ringing phone
     if(inner.t==='offer'&&this.serverNow()-e.ts>this.voice.ring){
      if(!this.get(key)){
       await tx.put(key,{id:'call-'+inner.call,peer:peerId,dir:'sys',ts:e.ts,text:'missed voice call'});
       note={peer:peerId,text:'missed voice call'}}}
     else sig=inner}
    await tx.put('sess:'+peerId,sess)}
   await tx.commit();
   this.done.add(e.id);
   if(this.done.size>5000)this.done=new Set([...this.done].slice(-2500))});
  if(sig)this.voice._signal(peerId,sig,e.ts);
  if(note){this.unread.set(note.peer,(this.unread.get(note.peer)||0)+1);this.emit('message',note.peer,note.text)}}

 /** The group part of an inbound message: a text, a receipt for one of mine,
     or a new name. Only counts if the sender is in the group, as far as the
     server says; a message can beat the push about who joined, so an unknown
     sender means the member list is reloaded once before giving up. */
 async _groupInner(peerId,inner,e,tx,sess){
  const gid=String(inner.g),none={sess,note:null};
  if(!GID.test(gid))return none;
  if(!this.inGroup(gid,peerId))await this.loadGroups().catch(()=>{});
  if(!this.inGroup(gid,peerId))return none;
  const conv='g:'+gid;
  if(inner.k==='text'&&typeof inner.t==='string'&&inner.id){
   const key='msg:'+conv+':'+inner.id;let note=null;
   if(!this.get(key)){
    const ts=Math.min(Number(inner.ts)||e.ts,e.ts);
    await tx.put(key,{id:String(inner.id),peer:conv,from:peerId,dir:'in',text:inner.t.slice(0,MAXTEXT),ts,state:'received'});
    note={peer:conv,text:this.displayName(peerId)+': '+inner.t}}
   const r=await Ratchet.encrypt(sess,{k:'receipt',g:gid,ids:[inner.id]});
   tx.send.push({to:peerId,payload:JSON.stringify(r.env),optional:true});
   return {sess:r.rec,note}}
  if(inner.k==='receipt'&&Array.isArray(inner.ids)){
   for(const id of inner.ids.slice(0,100)){
    const key='msg:'+conv+':'+id,m=this.get(key);
    if(m&&m.dir==='out'&&!(m.got||[]).includes(peerId))
     await tx.put(key,Object.assign({},m,{state:'delivered',got:(m.got||[]).concat(peerId)}))}
   return none}
  if(inner.k==='group'&&inner.t==='name'&&typeof inner.name==='string'&&Number.isFinite(inner.ts)){
   const name=inner.name.trim().slice(0,MAXNAME),cur=this.get('gname:'+gid);
   // newest name wins; a tie goes to the lower user id, so every member settles on the same one
   if(cur&&(inner.ts<cur.ts||(inner.ts===cur.ts&&peerId>cur.by)))return none;
   await tx.put('gname:'+gid,{name,ts:inner.ts,by:peerId});
   if(inner.announce&&(!cur||cur.name!==name))
    await tx.put('msg:'+conv+':n'+e.id,{id:'n'+e.id,peer:conv,dir:'sys',ts:e.ts,
     text:this.displayName(peerId)+(name?' renamed the group to “'+name+'”':' removed the group name')})}
  return none}

 /* ---- group chats ---- */

 inGroup(gid,userId){const g=this.group(gid);return !!g&&g.members.some(m=>m.userId===userId)}

 /** Who is in which group, from the server. Joins and leaves since this account
     last looked become lines in the group's history. */
 async loadGroups(){
  if(!this.token)return;
  return this.lock('__groups',async()=>{
   const r=await this.api('GET','/api/groups');
   if(!this.token)return;
   const now=new Map(r.groups.map(g=>[g.groupId,g]));
   const known=new Map();for(const g of now.values())for(const m of g.members)known.set(m.userId,m.username);
   const name=id=>!id?'someone':id===this.me.userId?'you':known.get(id)||this.displayName(id);
   const tx=new Tx(this);
   let n=0;const line=async(gid,text)=>{const id='j'+Date.now().toString(36)+'-'+(n++);
    await tx.put('msg:g:'+gid+':'+id,{id,peer:'g:'+gid,dir:'sys',ts:this.serverNow(),text})};
   for(const g of now.values()){
    const ids=g.members.map(m=>m.userId).sort(),rec=this.get('grp:'+g.groupId);
    if(!rec||rec.left){
     const me=g.members.find(m=>m.userId===this.me.userId)||{};
     await line(g.groupId,me.invitedBy?name(me.invitedBy)+' added you':'you created this group')}
    else{
     for(const m of g.members)if(!rec.members.includes(m.userId))await line(g.groupId,name(m.invitedBy)+' added '+name(m.userId));
     for(const id of rec.members)if(!ids.includes(id))await line(g.groupId,name(id)+' left')}
    if(!rec||rec.left||rec.members.join()!==ids.join())await tx.put('grp:'+g.groupId,{members:ids})}
   for(const [k,rec] of this.recs)if(k.startsWith('grp:')&&!rec.left&&!now.has(k.slice(4))){
    await line(k.slice(4),'you left this group');await tx.put(k,{members:[],left:true})}
   this.groups=now;
   if(tx.puts.length)await tx.commit();
   this.emit('change')})}

 async createGroup(name,invite){
  name=String(name||'').trim().slice(0,MAXNAME);
  const r=await this.api('POST','/api/groups',{invite:invite||[]});
  const gid=r.group.groupId;
  await this.loadGroups();

  const n=this.get('gname:'+gid);

 /** Names (or, with '', unnames) a group for every member. */

  gid=String(gid).replace(/^g:/,'');
  name=String(name||'').trim().slice(0,MAXNAME);
  if(!this.group(gid))throw new Error('you are not in this group');
  announce=announce!==false;
  const ts=Math.max(Date.now(),((this.get('gname:'+gid)||{}).ts||0)+1);
  await this._sendGroup(gid,{k:'group',t:'name',g:gid,name,ts,announce},async tx=>{
   await tx.put('gname:'+gid,{name,ts,by:this.me.userId});
   if(announce){const id='n'+uid();await tx.put('msg:g:'+gid+':'+id,{id,peer:'g:'+gid,dir:'sys',ts:Date.now(),
    text:name?'you renamed the group to “'+name+'”':'you removed the group name'})}})}

 /** Encrypts `inner` to every other member (or just `only`) and commits it all at
     once with whatever `more(tx)` adds. Each member's ratchet is locked in a
     fixed order, so two sends to overlapping groups never wait on each other.
     A member the server no longer lets this account reach (one of you blocked
     the other) is skipped rather than failing the send for everyone. */
 async _sendGroup(gid,inner,more,only){
  const g=this.group(gid);if(!g)throw new Error('you are not in this group');
  const to=g.members.map(m=>m.userId).filter(id=>id!==this.me.userId&&(!only||only.includes(id))).sort();
  const run=async()=>{
   const tx=new Tx(this);
   for(const id of to){
    let env;
    try{env=await this._encryptTo(id,inner,tx)}catch(e){if(e.status===403||e.status===404)continue;throw e}
    tx.send.push({to:id,payload:JSON.stringify(env),optional:true})}
   if(more)await more(tx);
   await tx.commit()};
  await to.reduceRight((fn,id)=>()=>this.lock(id,fn),run)()}

 /** Looks a user up by exact username and pins their identity locally. */
 async pinUser(username){
  username=String(username||'').trim();
  if(username.toLowerCase()===this.me.username.toLowerCase())throw new Error('that is you');
  const r=await this.api('GET','/api/users/lookup?username='+encodeURIComponent(username));
  const u=r.user;
  if(await Acct.userId(u.ik,u.sk)!==u.userId)throw new Error('the server returned keys that do not match this user');
  const clash=[...this.recs.entries()].find(([k,p])=>k.startsWith('peer:')&&p.userId!==u.userId&&
   p.username&&p.username.toLowerCase()===u.username.toLowerCase());
  if(!this.get('peer:'+u.userId)){
   const tx=new Tx(this);
   await tx.put('peer:'+u.userId,{userId:u.userId,username:u.username,ik:u.ik,sk:u.sk,verified:false,added:Date.now(),
    replaced:clash?clash[1].userId:undefined});
   await tx.commit()}
  return {userId:u.userId,username:u.username,changed:!!clash}}

  if(this.get('peer:'+id))return;
  await this.lock(id,async()=>{
   if(this.get('peer:'+id))return;
   const tx=new Tx(this);await this._peerRecord(id,tx);await tx.commit()})}

  if(!this.token)return;
  const r=await this.api('GET','/api/peers');

  this.peers=new Map(r.peers.map(p=>[p.userId,p]));this.peersLoaded=true;
  for(const p of this.peers.values()){
   const was=before.get(p.userId);
   if(!first&&p.state==='incoming'&&(!was||was.state!=='incoming'))this.emit('peer','request',p);
   if(!first&&p.state==='friend'&&was&&was.state==='outgoing')this.emit('peer','accepted',p);
   if(p.state==='friend'&&!this.get('peer:'+p.userId))this._pinId(p.userId).catch(()=>{})}
  this.emit('change')}

 async peerAction(action,target){
  const body={action};
  if(typeof target==='string')body.userId=target;
  else{
   // pin the identity first, so the keys we later message are the ones looked up here
   const u=await this.pinUser(target.username);body.userId=u.userId;
   if(u.changed)this.emit('peer','changed',{userId:u.userId,username:u.username})}
  const r=await this.api('POST','/api/peers',body);
  const p=r.peer;
  if(p.state==='none')this.peers.delete(p.userId);else this.peers.set(p.userId,p);
  if(p.state==='friend')await this._pinId(p.userId).catch(()=>{});
  this.emit('change');return p}

 async setDiscoverable(on){

  this.discoverable=r.discoverable;this.emit('change');return r.discoverable}

 relation(id){const p=this.peers.get(id);return p?p.state:'none'}

 /** Discord traffic is plaintext from the server: no ratchet, just store and ack. */
 async _handleDiscord(e){
  const peer=e.from;let p=null,note=null;
  try{p=JSON.parse(e.payload)}catch(x){}
  await this.lock(peer,async()=>{
   if(this.done.has(e.id))return;
   const tx=new Tx(this);tx.ack.push(e.id);
   if(p&&p.k==='dc'&&p.t==='msg'&&typeof p.text==='string'&&p.id){
    const key='msg:'+peer+':'+p.id;
    if(!this.get(key)){
     await tx.put(key,{id:String(p.id),peer,dir:'in',text:p.text.slice(0,MAXTEXT),author:String(p.author||'someone').slice(0,80),
      src:p.src==='marmot'?'marmot':'discord',ts:Number(p.ts)||e.ts,state:'received'});
     note={peer,text:p.text}}}
   else if(p&&p.k==='dc'&&p.t==='sys'&&typeof p.text==='string'){
    const id='s'+e.id;await tx.put('msg:'+peer+':'+id,{id,peer,dir:'sys',ts:e.ts,text:p.text.slice(0,500)})}
   await tx.commit();

  if(note){this.unread.set(peer,(this.unread.get(peer)||0)+1);this.emit('message',peer,note.text)}}

 async _sendDiscord(peerId,text,reuseId){
  const linkId=peerId.slice(3);
  if(!this.links.has(linkId))throw new Error('you are not in this channel');
  if(text.length>DCTEXT)throw new Error('Discord messages are limited to '+DCTEXT+' characters');
  const m={id:reuseId||uid(),peer:peerId,dir:'out',text,ts:Date.now(),state:'sending'};
  this.pending.set(m.id,m);this.emit('change');
  let r;
  try{r=await this.api('POST','/api/discord/send',{link:linkId,text})}
  catch(e){m.state='failed';m.error=e.message;this.emit('change');throw e}
  // it is in Discord now: from here on, never offer a retry that would post it twice
  m.state='sent';
  try{const tx=new Tx(this);await tx.put('msg:'+peerId+':'+r.id,Object.assign({},m,{id:r.id,ts:r.ts,text:typeof r.text==='string'?r.text:m.text}));await tx.commit();this.pending.delete(m.id)}
  catch(e){console.warn('sent to Discord but not saved to history:',e.message)}
  this.emit('change');return r.id}

 /* ---- messaging ---- */

 async sendText(peerId,text,reuseId){
  text=String(text||'');
  if(!text.trim())return null;
  if(text.length>MAXTEXT)throw new Error('messages are limited to '+MAXTEXT+' characters');
  if(isDiscord(peerId))return this._sendDiscord(peerId,text,reuseId);
  const grp=isGroup(peerId);
  if(grp?!this.group(peerId):!this.isFriend(peerId))throw new Error(grp?'you are not in this group':'you can only message friends');
  const m={id:reuseId||uid(),peer:peerId,dir:'out',text,ts:Date.now(),state:'sending'};
  this.pending.set(m.id,m);this.emit('change');
  try{
   const inner={k:'text',id:m.id,t:text,ts:m.ts},save=tx=>tx.put('msg:'+peerId+':'+m.id,Object.assign({},m,{state:'sent'},grp?{got:[]}:{}));
   if(grp)await this._sendGroup(peerId.slice(2),Object.assign(inner,{g:peerId.slice(2)}),save);
   else await this._sendInner(peerId,inner,save);
   this.pending.delete(m.id);
  }catch(e){m.state='failed';m.error=e.message;this.emit('change');throw e}
  this.emit('change');
  return m.id}

 /** Encrypts `inner` to a friend and commits it with whatever `more(tx)` adds. */
 async _sendInner(peerId,inner,more){
  await this.lock(peerId,async()=>{
   const tx=new Tx(this);
   const env=await this._encryptTo(peerId,inner,tx);
   if(more)await more(tx);
   tx.send.push({to:peerId,payload:JSON.stringify(env)});
   await tx.commit()})}

 /** One step of peerId's ratchet into `tx`, opening a session from their prekey
     bundle first if there is none. The caller holds peerId's lock. */
 async _encryptTo(peerId,inner,tx){
  let rec=this.get('sess:'+peerId)||Ratchet.empty();
  if(tx.mem.has('sess:'+peerId))rec=tx.mem.get('sess:'+peerId)[0];
  if(!rec.active||!rec.active.cks){
   const b=(await this.api('GET','/api/bundle/'+encodeURIComponent(peerId))).bundle;
   if(b.userId!==peerId||await Acct.userId(b.ik,b.sk)!==peerId)throw new Error('the server returned keys that do not belong to this user');
   rec=Ratchet.install(rec,await Ratchet.initiate(this.me,b));
   if(!this.get('peer:'+peerId))await tx.put('peer:'+peerId,{userId:peerId,username:b.username,ik:b.ik,sk:b.sk,verified:false,added:Date.now()})}
  const out=await Ratchet.encrypt(rec,inner);
  await tx.put('sess:'+peerId,out.rec);
  return out.env}

  if(!this.token||this.get(key))return;
  const tx=new Tx(this);await tx.put(key,{id,peer,dir:'sys',ts,text});await tx.commit();
  if(missed){this.unread.set(peer,(this.unread.get(peer)||0)+1);this.emit('message',peer,text)}}

  if(this._replenishing||!this.token)return;
  this._replenishing=true;
  try{
   const me=await this.api('GET','/api/me');this.opkCount=me.opkCount;this.discoverable=!!me.discoverable;
   if(me.opkCount>=20)return;
   await this.lock('__prekeys',async()=>{
    const prof=this.get('prof')||{nextOpk:1};
    const list=await Acct.opks(prof.nextOpk,this.opkBatch);
    const tx=new Tx(this);
    for(const o of list)await tx.put('opk:'+o.id,o);
    await tx.put('prof',Object.assign({},prof,{nextOpk:prof.nextOpk+this.opkBatch}));
    tx.opks=list.map(o=>({id:o.id,pub:o.pub}));
    await tx.commit()});

 /** Global list for the current search; stale responses are ignored. */
 async loadGlobal(more){
  const G=this.S.global,q=this.S.filter.trim();
  if(!M.token)return;
  if(!more&&G.q===q&&!G.err&&G.users.length)return;   // already have it
  const seq=++G.seq;G.loading=true;G.err='';this.render();
  try{
   const r=await M.discover(q,more?G.users.length:0);
   if(seq!==G.seq)return;
   G.q=q;G.users=more?G.users.concat(r.users):r.users;G.more=r.more}

 /** Makes el's children match html while keeping the nodes that stay (matched by data-k),
     so a bubble that is still animating in, or easing from sending to sent, is not cut short. */
 patch(el,html){
  const t=document.createElement('div');t.innerHTML=html;
  const old=new Map();for(const c of el.children)if(c.dataset.k)old.set(c.dataset.k,c);
  const want=[...t.childNodes].map(n=>{
   const o=n.nodeType===1&&n.dataset.k&&old.get(n.dataset.k);
   if(o&&o.tagName===n.tagName){old.delete(n.dataset.k);this.morph(o,n);return o}
   return n});
  want.forEach((n,i)=>{if(el.childNodes[i]!==n)el.insertBefore(n,el.childNodes[i]||null)});
  while(el.childNodes.length>want.length)el.lastChild.remove()},
 morph(o,n){
  for(const a of [...o.attributes])if(!n.hasAttribute(a.name))o.removeAttribute(a.name);
  for(const a of n.attributes){
   // an entrance animation keeps running until it is done, even once the item is no longer new
   const v=a.name==='class'&&o.classList.contains('new')&&!n.classList.contains('new')?a.value+' new':a.value;
   if(o.getAttribute(a.name)!==v)o.setAttribute(a.name,v)}
  const oc=o.childNodes,nc=[...n.childNodes];
  nc.forEach((c,i)=>{
   const x=oc[i];
   if(x&&x.nodeType===c.nodeType&&(c.nodeType!==1||x.tagName===c.tagName)){
    if(c.nodeType===1)this.morph(x,c);else if(x.nodeValue!==c.nodeValue)x.nodeValue=c.nodeValue}
   else if(x)o.replaceChild(c,x);else o.appendChild(c)});
  while(oc.length>nc.length)o.lastChild.remove()},

 /** m => ' new' for messages that arrived since this thread was last drawn.

 fresh(id,list){

  const seen=this._seen;
  return m=>{if(seen.has(m.id))return '';seen.add(m.id);return first?'':' new'}},

   if(day!==lastDay){html+='<div class="day" data-k="d'+day+'"><i></i><span>'+day+'</span><i></i></div>';lastDay=day}
   if(m.dir==='sys'){html+='<div class="sys'+fresh(m)+'" data-k="m'+esc(m.id)+'">'+esc(m.text)+'</div>';continue}
   const state=m.dir==='out'?(m.state==='failed'
     ?' · failed — <button data-retry="'+esc(m.id)+'">retry</button> · <button data-discard="'+esc(m.id)+'">discard</button>'
     :m.state==='sending'?' · sending':''):'';
   html+='<div class="msg '+m.dir+fresh(m)+(m.state==='failed'?' failed':'')+(m.state==='sending'?' sending':'')+'" data-k="m'+esc(m.id)+'">'+
    (m.dir==='in'?'<div class="who">'+esc(m.author)+(m.src==='marmot'?' <i>· marmot</i>':'')+'</div>':'')+
    '<div class="body">'+esc(m.text)+'</div><div class="stamp">'+hm(m.ts)+state+'</div></div>'}
  this.patch(th,html);
  if(atBottom||this._stick){th.scrollTo({top:th.scrollHeight,behavior:opened?'auto':'smooth'});this._stick=false}},

 /** A group chat: each message shows who sent it, and mine show how many members confirmed delivery. */
 renderGroup(id,th){
  const g=M.group(id);
  $('#chatAv').textContent=initials(M.displayName(id));$('#chatAv').classList.add('grp');
  $('#chatName').textContent=M.displayName(id);
  $('#chatMeta').textContent=g?this.memberCount(id)+' · end-to-end encrypted':'you are no longer in this group';
  const gate=$('#gate');
  $('#composerBox').classList.toggle('hidden',!g);gate.classList.toggle('hidden',!!g);
  const ghtml='<span class="grow">You left this group. A member can invite you back if you are friends with them.</span>';
  if(!g&&gate.innerHTML!==ghtml)gate.innerHTML=ghtml;
  document.querySelectorAll('#chatActs button').forEach(b=>b.classList.toggle('hidden',!g));
  if(M.unread.get(id)&&!document.hidden){M.unread.delete(id);this.renderRail();this.renderCol()}
  const atBottom=th.scrollHeight-th.scrollTop-th.clientHeight<60;
  const others=g?g.members.length-1:0;
  let html='<div class="sys" data-k="intro">messages in this group are end-to-end encrypted with the Signal protocol,<br>sent separately to each member. new members do not see earlier messages.</div>',lastDay='';
  const list=M.thread(id),opened=this._seenFor!==id,fresh=this.fresh(id,list);
  for(const m of list){
   const day=dayLabel(m.ts);
   if(day!==lastDay){html+='<div class="day" data-k="d'+day+'"><i></i><span>'+day+'</span><i></i></div>';lastDay=day}
   if(m.dir==='sys'){html+='<div class="sys'+fresh(m)+'" data-k="m'+esc(m.id)+'">'+esc(m.text)+'</div>';continue}
   const got=(m.got||[]).length;
   const state=m.dir==='out'?(m.state==='failed'
     ?' · failed — <button data-retry="'+esc(m.id)+'">retry</button> · <button data-discard="'+esc(m.id)+'">discard</button>'
     :m.state==='sending'?' · sending':got?' · delivered to '+(others&&got>=others?'everyone':got):' · sent'):'';
   html+='<div class="msg '+m.dir+fresh(m)+(m.state==='failed'?' failed':'')+(m.state==='sending'?' sending':'')+'" data-k="m'+esc(m.id)+'">'+
    (m.dir==='in'?'<div class="who">'+esc(M.displayName(m.from))+(M.isFriend(m.from)?'':' <i>· not a friend</i>')+'</div>':'')+
    '<div class="body">'+esc(m.text)+'</div><div class="stamp">'+hm(m.ts)+state+'</div></div>'}
  this.patch(th,html);
  if(atBottom||this._stick){th.scrollTo({top:th.scrollHeight,behavior:opened?'auto':'smooth'});this._stick=false}},

 /** A checklist of friends for starting or growing a group; `skip` are ids already in it. */
 friendPicker(skip){
  const list=[...M.peers.values()].filter(p=>p.state==='friend'&&!(skip||[]).includes(p.userId)).sort((a,b)=>a.username.localeCompare(b.username));
  if(!list.length)return '<div class="picks"><div class="grouplbl">'+((skip||[]).length>1?'EVERY FRIEND IS ALREADY IN THIS GROUP':'NO FRIENDS YET · ADD SOME IN PEERS')+'</div></div>';
  return '<input class="search" id="pickFilter" placeholder="filter friends…" autocomplete="off" style="margin:0 0 8px;width:100%">'+
   '<div class="picks" id="picks">'+list.map(p=>'<label class="pick" data-name="'+esc(p.username.toLowerCase())+'"><input type="checkbox" value="'+esc(p.userId)+'">'+

    (M.peer(p.userId).verified?'<span class="chip ok">VERIFIED</span>':'')+'</label>').join('')+'</div>'},
 /** Wires a friendPicker's filter box and calls onPick(count) whenever the selection changes. */
 wirePicker(onPick){

 picked(){return [...document.querySelectorAll('#picks input:checked')].map(i=>i.value)},

 /** + NEW on Messages: start a group (empty, or with friends picked here), or a direct chat by username. */
 newChat(mode){
  mode=mode||'group';
  const seg='<div class="auth-seg"><button data-m="mode-group" aria-pressed="'+(mode==='group')+'">GROUP CHAT</button><button data-m="mode-direct" aria-pressed="'+(mode==='direct')+'">DIRECT MESSAGE</button></div>';
  if(mode==='direct')return this.addPeer(seg);

  this.modal('<h3>New conversation</h3>'+seg+
   '<div class="field"><div class="lbl">GROUP NAME</div><input class="inp" id="gName" maxlength="'+MAXNAME+'" spellcheck="false" autocomplete="off" placeholder="optional · members can change it later"></div>'+
   '<div class="field"><div class="lbl">INVITE FRIENDS · OPTIONAL</div>'+this.friendPicker()+'</div>'+

 groupInvite(id){

 groupRename(id){

 groupMembers(id){

 auth(mode,msg){
  mode=mode||'login';
  const saved=SERVER||(/^https?:$/.test(location.protocol)?location.origin:'')||store.get('server')||'http://localhost:8080';
  const o=$('#overlay');
  o.innerHTML='<div class="scrim solid"><div class="modal"><div class="brand" style="padding:0">'+LOGO+'<b>MARMOT</b><div class="ver">v0.4</div></div>'+
   '<div class="note" style="margin:8px 0 0">Create a password. Create a secure and memorable password. It cannot be recovered.</div>'+
   '<div class="auth-seg"><button data-mode="login" aria-pressed="'+(mode==='login')+'">LOG IN</button><button data-mode="signup" aria-pressed="'+(mode==='signup')+'">SIGN UP</button></div>'+
   '<form id="authForm" autocomplete="on">'+

   (ON_PAGES?'<div class="btnrow" style="margin:0 0 8px">'+DL_LINK+'</div>':'')+
   '<div class="modal-foot"><span class="grow note" style="margin:0" id="aNote">'+(mode==='signup'?'10+ character password. It cannot be recovered.':'')+'</span>'+
   '<button class="send" type="submit" id="aGo">'+(mode==='signup'?'CREATE ACCOUNT':'LOG IN')+'</button></div></form></div></div>';
  o.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>this.auth(b.dataset.mode));

 /** + ADD, and the direct side of + NEW (`seg` switches back to a group): a friend
     opens their chat; anyone else gets a friend request. */
 addPeer(seg){
  const chat=this.S.screen==='messages';
  this.modal('<h3>'+(chat?'New conversation':'Add a friend')+'</h3>'+(seg||'')+'<div class="note">Enter their exact username. '+
   (chat?'If you are already friends the chat opens; otherwise they get a friend request, and you can message once they accept.'
    :'They get a friend request, and you can message each other once they accept.')+'</div>'+
   '<div class="field"><div class="lbl">USERNAME</div><input class="inp" id="ncUser" spellcheck="false" autocomplete="off"></div>'+
   '<div class="err" id="ncErr"></div><div class="modal-foot"><span class="grow"></span><button class="tbtn" data-m="cancel">CANCEL</button><button class="send" data-m="go">'+(chat?'START':'SEND REQUEST')+'</button></div>',
   async act=>{
    if(act==='mode-group')return this.newChat('group');
    if(act==='cancel')return this.close();
    if(act!=='go')return;
    const err=$('#ncErr'),name=$('#ncUser').value.trim();err.textContent='';
    if(!name)return;
    const known=[...M.peers.values()].find(p=>p.username.toLowerCase()===name.toLowerCase());
    try{
     if(chat&&known&&known.state==='friend'){this.close();return this.open(known.userId)}
     const p=await M.requestFriend(name);
     this.close();
     if(p.state==='friend'){toast('you and '+p.username+' are now friends');if(chat)return this.open(p.userId)}
     else if(p.state==='outgoing')toast((known?'already waiting for ':'request sent to ')+p.username);
     this.showPeer(p.userId)}
    catch(e){err.textContent=e.status===404?'no user with that name':e.message}});
  $('#ncUser').addEventListener('keydown',e=>{if(e.key==='Enter')$('[data-m=go]').click()})},
 joinDiscord(){
