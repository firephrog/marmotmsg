   const b=this._batch;if(!b)return;this._batch=null;
   const puts=[],dels=[];for(const [k,v] of b.ops)v===null?dels.push(k):puts.push({k,v});
   try{const r=await this.api('POST','/api/commit',{puts,dels,ack:b.ack,send:b.send,opks:b.opks});if(r.opkCount!=null)this.opkCount=r.opkCount;this.emit('change')}
   catch(e){
    // anything staged on top of this batch was built on it: it goes too, newest first
    const later=this._batch;this._batch=null;
    for(const x of [later,b])if(x&&x.recs===this.recs){
     for(const [l,[d,k]] of x.undo)d===undefined?this._del(l):this._set(l,d,k);
     x.ids.forEach(id=>this.done.delete(id));
     x.notes.forEach(p=>{const n=(this.unread.get(p)||0)-1;n>0?this.unread.set(p,n):this.unread.delete(p)})}
    this.emit('change');throw e}};
  const f=(this._flushing||Promise.resolve()).catch(()=>{}).then(run);
  this._flushing=f;f.finally(()=>{if(this._flushing===f)this._flushing=null}).catch(()=>{});
  return f}

 /** True while a pile of envelopes is being worked through rather than news trickling in:
     draining the mailbox, or a burst the socket delivered at once. A tab the browser froze
     or throttled while it sat in the background gets everything that came in meanwhile as
     one flood of socket frames when it wakes, not through drain(). */
 catchingUp(){return !!this._draining||!!this._flushing||this.queued.size>BURST}

 _retrySoon(){clearTimeout(this._retryTimer);this._retryTimer=setTimeout(()=>{if(this.token)this.drain().catch(()=>{})},4000)}

 async _peerRecord(peerId,tx){
  const have=this.get('peer:'+peerId);if(have)return have;
  let p={userId:peerId,username:null,verified:false,added:Date.now()};
  try{const r=await this.api('GET','/api/users/lookup?id='+encodeURIComponent(peerId));
   if(await Acct.userId(r.user.ik,r.user.sk)===peerId){p=Object.assign(p,{username:r.user.username,ik:r.user.ik,sk:r.user.sk});this._learnAv(peerId,r.user.av);this._learnRole(peerId,r.user.role,r.user.muted);this._learnProf(r.user)}}
  catch(e){if(e.network)throw e}
  await tx.put('peer:'+peerId,p);return p}

 /** One inbound envelope → one atomic commit: the advanced ratchet, the stored
     message, the receipt going back, the spent prekey and the mailbox ack all
     land together, or nothing does and the envelope is retried. */
 async _handle(e,quiet){
  if(this.done.has(e.id)||!this.token)return;
  if(isDiscord(e.from))return this._handleDiscord(e,quiet);
  if(e.from==='sys:mod')return this._handleMod(e);
  const peerId=e.from;
  let note=null,sig=null,after=null;
  await this.lock(peerId,async()=>{
   if(this.done.has(e.id))return;
   let env=null;try{env=JSON.parse(e.payload)}catch(x){}
   const rec=this.get('sess:'+peerId)||Ratchet.empty(),v2=!!env&&env.v===2;
   let out=null,why='';
   if(!v2)try{out=await Ratchet.decrypt(rec,env,{me:this.me,peerId,spk:id=>this._spk(id),opk:id=>this.get('opk:'+id)})}
   catch(x){why=x.message||'authentication failed'}
   const tx=new Tx(this);tx.ack.push(e.id);
   await this._peerRecord(peerId,tx);
   if(v2){const r=await this._senderKeyEnv(peerId,env,e,tx);note=r.note;after=r.after||null;sig=r.sig||null}
   else if(!out){
    const id='x'+e.id;
    await tx.put('msg:'+peerId+':'+id,{id,peer:peerId,dir:'sys',ts:e.ts,text:'a message could not be decrypted ('+why+')'});
   }else{
    let sess=out.rec;
    const inner=out.inner||{};
    if(out.opk!=null)await tx.del('opk:'+out.opk);
    // someone I reach only through an encrypted server (not a friend, in none of my groups) may pass its keys, nothing more
    const keyOnly=inner.k!=='skreq'&&inner.k!=='skey'&&inner.g==null&&!this.isFriend(peerId)&&!this._sharesGroup(peerId)&&[...this.servers.values()].some(s=>s.e2ee);
    if(keyOnly&&inner.k!=='receipt'){}
    else if(inner.g!=null){
     const r=await this._groupInner(peerId,inner,e,tx,sess);
     sess=r.sess;note=r.note;after=r.after||null;sig=r.sig||null}
    else if(inner.k==='text'&&typeof inner.t==='string'&&inner.id){
     const key='msg:'+peerId+':'+inner.id;
     if(!this.get(key)){
      const ts=Math.min(Number(inner.ts)||e.ts,e.ts);
      const m=Object.assign({id:String(inner.id),peer:peerId,dir:'in',text:inner.t.slice(0,MAXTEXT),ts,state:'received',re:reOf(inner.re),poll:pollOf(inner.poll,e.ts+POLLMAX*60000)},imgOf(inner));
      await tx.put(key,m);
      note={peer:peerId,text:gist(m)}}
     const r=await Ratchet.encrypt(sess,{k:'receipt',ids:[inner.id]});
     sess=r.rec;tx.send.push({to:peerId,payload:JSON.stringify(r.env),optional:true});
    }else if(inner.k==='del'&&typeof inner.id==='string'){
     await this._tombstone(tx,'msg:'+peerId+':'+inner.id,m=>m.dir==='in')
    }else if(inner.k==='vote'&&typeof inner.id==='string'){
     await this._vote(tx,'msg:'+peerId+':'+inner.id,peerId,inner,e.ts)
    }else if(inner.k==='react'&&typeof inner.id==='string'){
     await this._react(tx,'msg:'+peerId+':'+inner.id,peerId,inner)
    }else if(inner.k==='receipt'&&Array.isArray(inner.ids)){
     for(const id of inner.ids.slice(0,100)){
      const key='msg:'+peerId+':'+id,m=this.get(key);
      if(m&&m.dir==='out'&&m.state!=='delivered')await tx.put(key,Object.assign({},m,{state:'delivered'}))}}
    else if(inner.k==='skreq'&&typeof inner.s==='string'){const q=inner;after=()=>{this._answerSkreq(peerId,q).catch(()=>{})}}
    else if(inner.k==='skey'&&typeof inner.s==='string'&&inner.keys&&typeof inner.keys==='object'){const q=inner;after=()=>{this._takeKeys(q.s,q.keys,false).catch(()=>{})}}
    else if(callSig(inner)){
     const key='msg:'+peerId+':call-'+inner.call;
     // an offer that waited in the mailbox past its ring time is a missed call, not a ringing phone
     if(inner.t==='offer'&&this.serverNow()-e.ts>this.voice.ring){
      if(!this.get(key)){
       await tx.put(key,{id:'call-'+inner.call,peer:peerId,dir:'sys',ts:e.ts,text:'missed voice call'});
       note={peer:peerId,text:'missed voice call'}}}
     else sig=inner}
    await tx.put('sess:'+peerId,sess)}
   await this._save(tx,e.id);
   this.done.add(e.id);
   if(this.done.size>5000)this.done=new Set([...this.done].slice(-2500))});
  if(sig)this.voice._signal(peerId,sig,e.ts);
  // after the lock: it sends to this same peer
  if(after)after();
  if(note)this._note(note.peer,note.text,quiet)}

 /** A group message under a member's sender key. Once opened it is handled like
     any other group message; a pairwise receipt may still step our session with
     the sender. One that cannot be opened for want of their key leaves a line in
     the chat and asks them for the key. The caller holds peerId's lock. */
 async _senderKeyEnv(peerId,env,e,tx){
  const gid=String(env.g||''),none={note:null};
  if(!GID.test(gid))return none;
  if(!this.inGroup(gid,peerId))await this.loadGroups().catch(()=>{});
  if(!this.inGroup(gid,peerId))return none;
  const conv='g:'+gid,k='skin:'+gid+':'+peerId;
  let o;
  try{o=await SKey.decrypt(this.get(k),env,gid,peerId)}
  catch(x){
   const id='x'+e.id;
   await tx.put('msg:'+conv+':'+id,{id,peer:conv,dir:'sys',ts:e.ts,text:'a message from '+this.displayName(peerId)+' could not be decrypted ('+(x.message||'authentication failed')+')'});
   return {note:null,after:x.nokey?()=>this._once('skreq:'+gid+':'+peerId,
    ()=>this._sendInner(peerId,{k:'group',t:'skreq',g:gid},null,{g:gid}).catch(()=>{})):null}}
  await tx.put(k,o.rec);
  const sess=this.get('sess:'+peerId)||Ratchet.empty();
  const inner=Object.assign({},o.inner,{g:gid});
  const r=await this._groupInner(peerId,inner,Object.assign({},e,{sk:true}),tx,sess);
  if(r.sess!==sess)await tx.put('sess:'+peerId,r.sess);
  return r}

 /** The group part of an inbound message: a text, a receipt for one of mine,
     or a new name. Only counts if the sender is in the group, as far as the
     server says; a message can beat the push about who joined, so an unknown
     sender means the member list is reloaded once before giving up. */
 async _groupInner(peerId,inner,e,tx,sess){
  const gid=String(inner.g),none={sess,note:null};
  if(!GID.test(gid))return none;
  if(!this.inGroup(gid,peerId))await this.loadGroups().catch(()=>{});
  if(!this.inGroup(gid,peerId))return none;
  const conv='g:'+gid;
  // a member's sender key for this group (only ever sent pairwise)
  if(inner.k==='skdm'){
   if(e.sk)return none;
   const k='skin:'+gid+':'+peerId,r=SKey.learn(this.get(k),inner);
   if(r)await tx.put(k,r);
   return none}
  // a member could not read one of mine: they get my key again with my next message
  if(inner.k==='group'&&inner.t==='skreq'&&!e.sk)
   return {sess,note:null,after:()=>this._once('skre:'+gid+':'+peerId,()=>this._resendKey(gid,peerId))};
  // a member muted in this group by its moderators: what they say is dropped here too
  if((says(inner)||inner.k==='react')&&this.groupMuted(gid,peerId))return none;
  if(inner.k==='text'&&typeof inner.t==='string'&&inner.id){
   const key='msg:'+conv+':'+inner.id;let note=null;
   if(!this.get(key)){
    const ts=Math.min(Number(inner.ts)||e.ts,e.ts);
    const m=Object.assign({id:String(inner.id),peer:conv,from:peerId,dir:'in',text:inner.t.slice(0,MAXTEXT),ts,state:'received',re:reOf(inner.re),poll:pollOf(inner.poll,e.ts+POLLMAX*60000)},imgOf(inner));
    await tx.put(key,m);
    note={peer:conv,text:this.displayName(peerId)+': '+gist(m)}}
   // the receipt goes back pairwise; with no session to the sender yet there is none
   let rs=sess;
   if(sess.active&&sess.active.cks){
    const r=await Ratchet.encrypt(sess,{k:'receipt',g:gid,ids:[inner.id]});
    rs=r.rec;tx.send.push({to:peerId,payload:JSON.stringify(r.env),optional:true})}
   // the sender has a newer name or icon than this account: ask them for it
   const gs=Array.isArray(inner.gs)?inner.gs:[],mine=this._groupStamp(gid);
   const behind=Number(gs[0])>mine[0]||Number(gs[1])>mine[1];
   return {sess:rs,note,after:behind?()=>this._once('want:'+gid+':'+peerId,
    ()=>this._sendGroup(gid,{k:'group',t:'want',g:gid},null,[peerId])):null}}
  if(callSig(inner)){
   // a group call: a ringing offer that waited in the mailbox past its ring time is a missed call
   if(inner.t==='offer'&&this.serverNow()-e.ts>this.voice.ring){
    if(!inner.ring||this.get('msg:'+conv+':call-'+inner.call))return none;
    const text='missed group call from '+this.displayName(peerId);
    await tx.put('msg:'+conv+':call-'+inner.call,{id:'call-'+inner.call,peer:conv,dir:'sys',ts:e.ts,text});
    return {sess,note:{peer:conv,text}}}
   return {sess,note:null,sig:inner}}
  if(inner.k==='group'&&inner.t==='want')
   return {sess,note:null,after:()=>this._once('give:'+gid+':'+peerId,()=>this._sendGroupMeta(gid,[peerId]))};
  if(inner.k==='del'&&typeof inner.id==='string'){
   // only whoever wrote a message can take it back
   await this._tombstone(tx,'msg:'+conv+':'+inner.id,m=>m.dir==='in'&&m.from===peerId);
   return none}
  if(inner.k==='vote'&&typeof inner.id==='string'){await this._vote(tx,'msg:'+conv+':'+inner.id,peerId,inner,e.ts);return none}
  if(inner.k==='react'&&typeof inner.id==='string'){await this._react(tx,'msg:'+conv+':'+inner.id,peerId,inner);return none}
  if(inner.k==='receipt'&&Array.isArray(inner.ids)){
   for(const id of inner.ids.slice(0,100)){
    const key='msg:'+conv+':'+id,m=this.get(key);
    if(m&&m.dir==='out'&&!(m.got||[]).includes(peerId))
     await tx.put(key,Object.assign({},m,{state:'delivered',got:(m.got||[]).concat(peerId)}))}
   return none}
  if(inner.k==='group'&&inner.t==='name'&&typeof inner.name==='string'&&Number.isFinite(inner.ts)){
   const name=inner.name.trim().slice(0,MAXNAME),cur=this.get('gname:'+gid);
   // newest name wins; a tie goes to the lower user id, so every member settles on the same one
   if(cur&&(inner.ts<cur.ts||(inner.ts===cur.ts&&peerId>cur.by)))return none;
   await tx.put('gname:'+gid,{name,ts:inner.ts,by:peerId});
   if(inner.announce&&(!cur||cur.name!==name))
    await tx.put('msg:'+conv+':n'+e.id,{id:'n'+e.id,peer:conv,dir:'sys',ts:e.ts,
     text:this.displayName(peerId)+(name?' renamed the group to “'+name+'”':' removed the group name')})}
  if(inner.k==='group'&&inner.t==='icon'&&(inner.icon===''||isPic(inner.icon))&&Number.isFinite(inner.ts)){
   const cur=this.get('gicon:'+gid);
   // same rule as the name: newest wins, a tie goes to the lower user id
   if(cur&&(inner.ts<cur.ts||(inner.ts===cur.ts&&peerId>cur.by)))return none;
   await tx.put('gicon:'+gid,{icon:inner.icon,ts:inner.ts,by:peerId});
   if(inner.announce&&(!cur||cur.icon!==inner.icon))
    await tx.put('msg:'+conv+':i'+e.id,{id:'i'+e.id,peer:conv,dir:'sys',ts:e.ts,
     text:this.displayName(peerId)+(inner.icon?' changed the group icon':' removed the group icon')})}
  return none}

 /** A moderator removed messages for everyone. The notice comes from the server, which
     cannot read the chat, so it names each message's author too, and a message is only
     blanked if that is who wrote it. */
 async _handleMod(e){
  let p=null;try{p=JSON.parse(e.payload)}catch(x){}
  const conv=p&&typeof p.conv==='string'?p.conv:'sys:mod';
  await this.lock(conv,async()=>{
   if(this.done.has(e.id))return;
   const tx=new Tx(this);tx.ack.push(e.id);
   if(p&&p.k==='mod'&&p.t==='del'&&Array.isArray(p.msgs)&&!isDiscord(conv)){
    const by=String(p.by||'staff').slice(0,24);
    for(const r of p.msgs.slice(0,500)){
     if(!r||typeof r.id!=='string'||typeof r.from!=='string')continue;
     await this._tombstone(tx,'msg:'+conv+':'+r.id,m=>(m.dir==='out'?this.me.userId:m.from||conv)===r.from,{mod:by})}}
   await this._save(tx,e.id);
   this.done.add(e.id)});
  this.emit('change')}

 /** Whether a text pings this account with @username. */
 pings(text){return !!this.me&&mentions(text).has(this.me.username.toLowerCase())}

 /* ---- moderation ---- */
 /** Runs a staff chat command typed in conv; returns {text} describing what happened,
     {help:true} for /help, or null if text is not a command. Throws with a readable reason. */
 async runCommand(conv,text){
  const c=parseCommand(text);if(!c)return null;
  if(c.cmd==='help')return {help:true};
  if(!this.staff)throw new Error('only staff can use /'+c.cmd);
  const who=async()=>{
   if(!c.user)throw new Error('say who: /'+c.cmd+(c.cmd==='mute'?' 1h':'')+' @username');
   if(c.user.toLowerCase()===this.me.username.toLowerCase())throw new Error('that is you');
   return (await this.api('GET','/api/users/lookup?username='+encodeURIComponent(c.user))).user};
  const why=c.reason?' — '+c.reason:'';
  if(c.cmd==='mute'){
   if(c.dur==null)throw new Error('say for how long: /mute 1h @username "reason" (m, h, d, w, mo, y, or perm)');
   const u=await who();
   await this.admin('POST','/mute',Object.assign({userId:u.userId,reason:c.reason},c.dur==='perm'?{permanent:true}:{minutes:c.dur}));
   return {text:'you muted '+u.username+(c.dur==='perm'?' permanently':' for '+fmtDur(c.dur))+why}}
  if(c.cmd==='unmute'){const u=await who();await this.admin('POST','/unmute',{userId:u.userId});return {text:'you unmuted '+u.username}}
  if(c.cmd==='ban'){const u=await who();await this.admin('POST','/ban',{userId:u.userId,reason:c.reason});return {text:'you banned '+u.username+' and deleted their account'+why}}
  if(c.cmd==='ipban'){const u=await who();await this.admin('POST','/ipban',{userId:u.userId,reason:c.reason});return {text:'you IP banned '+u.username+why}}
  if(c.cmd==='purge'){
   if(!c.n||c.n>500)throw new Error('say how many, up to 500: /purge 20, or /purge 20 @username');
   if(isDiscord(conv))throw new Error('Discord channels cannot be purged from here');
   const from=c.user?(await who()).userId:null;
   const ids=this.thread(conv).filter(m=>m.dir!=='sys'&&!m.deleted&&m.state!=='sending'&&m.state!=='failed'&&
    (!from||(m.dir==='out'?this.me.userId:m.from||conv)===from)).slice(-c.n).map(m=>m.id);
   if(!ids.length)throw new Error('there is nothing to purge');
   const r=await this.modRemove(conv,ids,true);
   return {text:'you purged '+r.removed+' message'+(r.removed===1?'':'s')+(c.user?' from '+c.user:'')+(r.skipped?' · skipped '+r.skipped+' from staff':'')}}
  return null}
 /** A line in conv's history that only this account sees, e.g. what a command did. */
 async sysLine(conv,text){
  const id='c'+uid(),tx=new Tx(this);
  await tx.put('msg:'+conv+':'+id,{id,peer:conv,dir:'sys',ts:Date.now(),text:String(text).slice(0,500)});
  await tx.commit();this.emit('change')}

 /* ---- moderation ---- */
 /** Staff endpoints: path is under /api/admin. */
 admin(method,path,body){return this.api(method,'/api/admin'+path,body)}
 /** Removes messages (ids in conv) for everyone in the chat: one needs the delete
     permission, several (or `purge`) need purge. Returns {removed, skipped}. */
 async modRemove(conv,ids,purge){
  const msgs=[];
  for(const id of ids){
   const m=this.get('msg:'+conv+':'+id);
   if(!m||m.dir==='sys'||m.deleted)continue;
   msgs.push({id:m.id,from:m.dir==='out'?this.me.userId:m.from||conv})}
  if(!msgs.length)throw new Error('there is nothing left to remove');
  return this.admin('POST',purge||msgs.length>1?'/purge':'/delete',{conv,msgs})}

 /* ---- group chats ---- */
 group(gid){return this.groups.get(String(gid).replace(/^g:/,''))||null}
 inGroup(gid,userId){const g=this.group(gid);return !!g&&g.members.some(m=>m.userId===userId)}
 groupName(gid){gid=String(gid).replace(/^g:/,'');const n=this.get('gname:'+gid);return n&&n.name?n.name:''}
 groupIcon(gid){gid=String(gid).replace(/^g:/,'');const n=this.get('gicon:'+gid);return n&&n.icon||null}

 /** Who is in which group, from the server. Joins and leaves since this account
     last looked become lines in the group's history. */
 async loadGroups(){
  if(!this.token)return;
  return this.lock('__groups',async()=>{
   const r=await this.api('GET','/api/groups');
   if(!this.token)return;
   const now=new Map(r.groups.map(g=>[g.groupId,g]));
   this.applied=new Map((r.applied||[]).map(a=>[a.groupId,a]));
   const known=new Map();for(const g of now.values())for(const m of g.members){known.set(m.userId,m.username);this._learnAv(m.userId,m.av);this._learnRole(m.userId,m.role,m.muted);this._learnProf(m)}
   const name=id=>!id?'someone':id===this.me.userId?'you':known.get(id)||this.displayName(id);
   const whose=id=>id===this.me.userId?'your':name(id)+"'s";
   const tx=new Tx(this);
   let n=0;const line=async(gid,text)=>{const id='j'+Date.now().toString(36)+'-'+(n++);
    await tx.put('msg:g:'+gid+':'+id,{id,peer:'g:'+gid,dir:'sys',ts:this.serverNow(),text})};
   for(const g of now.values()){
    const ids=g.members.map(m=>m.userId).sort(),rec=this.get('grp:'+g.groupId);
    if(!rec||rec.left){
     const me=g.members.find(m=>m.userId===this.me.userId)||{};
     await line(g.groupId,me.invitedBy?name(me.invitedBy)+(me.via?' let you in':' added you'):me.via?'you joined through '+whose(me.via)+' group tag':g.createdBy===this.me.userId?'you created this group':'you joined this group')}
    else{
     for(const m of g.members)if(!rec.members.includes(m.userId))await line(g.groupId,
      m.invitedBy?name(m.invitedBy)+(m.via?' let in ':' added ')+name(m.userId):name(m.userId)+' joined'+(m.via?' through '+whose(m.via)+' group tag':''));
     const kicks=g.kicks||[];
     for(const id of rec.members)if(!ids.includes(id)){
      const k=kicks.filter(x=>x.userId===id).pop();
      await line(g.groupId,k&&k.ts>(rec.at||0)-60000?name(id)+' was removed by '+name(k.by):name(id)+' left')}}
    if(!rec||rec.left||rec.members.join()!==ids.join())await tx.put('grp:'+g.groupId,{members:ids,at:this.serverNow()})}
   for(const [k,rec] of this.recs)if(k.startsWith('grp:')&&!rec.left&&!now.has(k.slice(4))){
    const gid=k.slice(4);
    await line(gid,this._leaving===gid?'you left this group':'you are no longer in this group');await tx.put(k,{members:[],left:true})}
   this.groups=now;this._prunePresence();
   if(tx.puts.length)await tx.commit();
   this.emit('change')})}

 /** A new group with me in it; `invite` (friends' ids) may be empty. */
 async createGroup(name,invite){
  name=String(name||'').trim().slice(0,MAXNAME);
  const r=await this.api('POST','/api/groups',{invite:invite||[]});
  const gid=r.group.groupId;
  await this.loadGroups();
  if(name)await this.renameGroup(gid,name,false);
  return gid}

 async inviteToGroup(gid,ids){
  gid=String(gid).replace(/^g:/,'');
  const r=await this.api('POST','/api/groups/invite',{group:gid,invite:ids});
  await this.loadGroups();
  // newcomers learn the current name from whoever invited them
  const n=this.get('gname:'+gid);
  if(n&&r.added.length)await this._sendGroup(gid,{k:'group',t:'name',g:gid,name:n.name,ts:n.ts},null,r.added).catch(()=>{});
  if(r.added.length)await this._sendGroupMeta(gid,r.added);
  return r.added}

 /** [name ts, icon ts] of the group as this account has it, sent along with each group text. */
 _groupStamp(gid){gid=String(gid).replace(/^g:/,'');
  return [(this.get('gname:'+gid)||{}).ts||0,(this.get('gicon:'+gid)||{}).ts||0]}

 /** Sends some members the group's current name and icon. The name and icon are one-off
     messages, so a member who missed one (a tab still running an older client acks what it
     does not understand) would otherwise never get it. */
 async _sendGroupMeta(gid,to){
  const n=this.get('gname:'+gid),ic=this.get('gicon:'+gid);
  if(n)await this._sendGroup(gid,{k:'group',t:'name',g:gid,name:n.name,ts:n.ts},null,to).catch(()=>{});
  if(ic)await this._sendGroup(gid,{k:'group',t:'icon',g:gid,icon:ic.icon,ts:ic.ts},null,to).catch(()=>{})}

 /** Runs fn at most once a minute per key, so a busy group does not repeat the same repair. */
 _once(key,fn){
  const seen=this._recent||(this._recent=new Map()),now=Date.now();
  if(now-(seen.get(key)||0)<60000)return;
  seen.set(key,now);
  if(seen.size>500)for(const [k,t] of seen)if(now-t>=60000)seen.delete(k);
  fn().catch(()=>{})}

 async leaveGroup(gid){
  gid=String(gid).replace(/^g:/,'');
  this._leaving=gid;
  try{await this.api('POST','/api/groups/leave',{group:gid});await this.loadGroups()}finally{this._leaving=null}}

 /* ---- group roles: owner, group moderators, members ---- */
 /** 'owner', 'mod' or null for someone in a group (this account by default). */
 groupRole(gid,userId){const g=this.group(gid);if(!g)return null;userId=userId||this.me.userId;
  const m=g.members.find(x=>x.userId===userId);return m&&m.gr||null}
 /** 2 owner · 1 group moderator · 0 member · -1 not in it. */
 groupRank(gid,userId){const g=this.group(gid);userId=userId||this.me.userId;
  if(!g||!g.members.some(m=>m.userId===userId))return -1;const r=this.groupRole(gid,userId);return r==='owner'?2:r==='mod'?1:0}
 /** When someone's mute in a group ends (0 = never), or undefined if they are not muted there. */
 groupMuteEnd(gid,userId){const g=this.group(gid);if(!g)return undefined;userId=userId||this.me.userId;
  const m=g.members.find(x=>x.userId===userId);const u=m&&m.gm;
  return Number.isFinite(u)&&(u===0||u>this.serverNow())?u:undefined}
 groupMuted(gid,userId){return this.groupMuteEnd(gid,userId)!==undefined}
 canInvite(gid){const g=this.group(gid);return !!g&&(g.invite!=='mods'||this.groupRank(gid)>=1)}
 async _groupPost(path,body){
  const r=await this.api('POST','/api/groups/'+path,body);
  await this.loadGroups();return r}
 setGroupMod(gid,userId,on){return this._groupPost('mod',{group:String(gid).replace(/^g:/,''),user:userId,on:!!on})}
 kickFromGroup(gid,userId){return this._groupPost('kick',{group:String(gid).replace(/^g:/,''),user:userId})}
 /** minutes: a number (0 = until unmuted), or null to unmute. */
 muteInGroup(gid,userId,minutes){return this._groupPost('mute',{group:String(gid).replace(/^g:/,''),user:userId,minutes})}
 /** patch: {invite?: 'all'|'mods', tag?: {text?, vis?: 'off'|'friends'|'all', mode?: 'join'|'apply'}} */
 groupSettings(gid,patch){return this._groupPost('settings',Object.assign({group:String(gid).replace(/^g:/,'')},patch))}
 /** Joins (or asks to join, with a reason) through the tag on `via`'s profile. */
 async joinByTag(gid,via,reason){
  const r=await this._groupPost('join',{group:gid,via,reason:reason||''});
  // a newcomer by tag was not handed the name and icon by an inviter: ask the members for them
  if(r.joined&&this.group(gid))this._sendGroup(gid,{k:'group',t:'want',g:gid},null,null).catch(()=>{});
  return r}
 withdrawApp(gid){return this._groupPost('withdraw',{group:gid})}
 async answerApp(gid,userId,accept){
  gid=String(gid).replace(/^g:/,'');
  const r=await this._groupPost('answer',{group:gid,user:userId,accept:!!accept});
  if(accept&&this.inGroup(gid,userId))await this._sendGroupMeta(gid,[userId]);
  return r}
 /** Shows (or, with '', stops showing) one of my groups' tags on my profile. */
 async showTag(gid){
  const r=await this.api('POST','/api/me/profile',{gtag:gid||''});
  this.myProfile=cleanProfile(r.profile);
  this._learnProf({userId:this.me.userId,pv:r.pv});this.emit('change')}
 /** The tag this account's profile shows, from the group it belongs to, or null. */
 myTag(){const gid=this.myProfile&&this.myProfile.gtag,g=gid&&this.group(gid);
  return g&&g.tag&&g.tag.vis!=='off'&&g.tag.text?{groupId:gid,text:g.tag.text,emoji:g.tag.emoji||'',vis:g.tag.vis,mode:g.tag.mode,n:g.members.length}:null}

 /** Names (or, with '', unnames) a group for every member. */
 async renameGroup(gid,name,announce){
  gid=String(gid).replace(/^g:/,'');
  name=String(name||'').trim().slice(0,MAXNAME);
  if(!this.group(gid))throw new Error('you are not in this group');
  announce=announce!==false;
  const ts=Math.max(Date.now(),((this.get('gname:'+gid)||{}).ts||0)+1);
  await this._sendGroup(gid,{k:'group',t:'name',g:gid,name,ts,announce},async tx=>{
   await tx.put('gname:'+gid,{name,ts,by:this.me.userId});
   if(announce){const id='n'+uid();await tx.put('msg:g:'+gid+':'+id,{id,peer:'g:'+gid,dir:'sys',ts:Date.now(),
    text:name?'you renamed the group to “'+name+'”':'you removed the group name'})}})}

 /** Sets (or, with '', removes) a group's icon for every member. `icon` is already shrunk. */
 async setGroupIcon(gid,icon){
  gid=String(gid).replace(/^g:/,'');icon=icon||'';
  if(icon&&!isPic(icon))throw new Error('that picture is not in a supported format');
  if(!this.group(gid))throw new Error('you are not in this group');
  const ts=Math.max(Date.now(),((this.get('gicon:'+gid)||{}).ts||0)+1);
  await this._sendGroup(gid,{k:'group',t:'icon',g:gid,icon,ts,announce:true},async tx=>{
   await tx.put('gicon:'+gid,{icon,ts,by:this.me.userId});
   const id='i'+uid();await tx.put('msg:g:'+gid+':'+id,{id,peer:'g:'+gid,dir:'sys',ts:Date.now(),
    text:icon?'you changed the group icon':'you removed the group icon'})})}

 /** Encrypts `inner` once under my sender key for the group and has the server
     fan it out to every other member (or just `only`), committed together with
     whatever `more(tx)` adds. Members who do not have my key yet get it first,
     pairwise, in the same commit; if anyone who had it has since left the group,
     a new key replaces it. The group's key is locked first, then each recipient
     in a fixed order: that also keeps what they send from being handled while
     `more` rewrites the same records (a poll's votes, say). A member the server no
     longer lets this account reach (one of you blocked the other) is skipped
     rather than failing the send for everyone. */
 async _sendGroup(gid,inner,more,only){
  const g=this.group(gid);if(!g)throw new Error('you are not in this group');
  const me=this.me.userId,members=g.members.map(m=>m.userId).filter(id=>id!==me);
  const to=members.filter(id=>!only||only.includes(id)).sort();
  await this.lock('sk:'+gid,async()=>{
   let out=this.get('skout:'+gid);
   out=out&&out.sent.every(id=>members.includes(id))?Ratchet.clone(out):await SKey.fresh();
   const need=to.filter(id=>!out.sent.includes(id)),d=SKey.dist(out);
   const run=async()=>{
    const tx=new Tx(this),reach=to.filter(id=>out.sent.includes(id));
    for(const id of need){
     let env;
     try{env=await this._encryptTo(id,Object.assign({k:'skdm',g:gid},d),tx)}catch(e){if(e.status===403||e.status===404)continue;throw e}
     tx.send.push({to:id,payload:JSON.stringify(env),optional:true,g:gid});
     out.sent.push(id);reach.push(id)}
    const r=await SKey.encrypt(out,gid,me,inner);
    await tx.put('skout:'+gid,r.out);
    if(reach.length)tx.send.push({to:reach,payload:JSON.stringify(r.env),optional:true,say:says(inner),g:gid});
    if(more)await more(tx);
    await tx.commit()};
   await to.reduceRight((fn,id)=>()=>this.lock(id,fn),run)()})}

 /** A member lost my key for a group: forget I gave it to them, so my next message carries it again. */
 async _resendKey(gid,userId){
  await this.lock('sk:'+gid,async()=>{
   const out=this.get('skout:'+gid);
   if(!out||!out.sent.includes(userId))return;
   const tx=new Tx(this);
   await tx.put('skout:'+gid,Object.assign({},out,{sent:out.sent.filter(id=>id!==userId)}));
   await tx.commit()})}

 /* ---- peers ---- */
 /** Looks a user up by exact username and pins their identity locally. */
 async pinUser(username){
  username=String(username||'').trim();
  if(username.toLowerCase()===this.me.username.toLowerCase())throw new Error('that is you');
  const r=await this.api('GET','/api/users/lookup?username='+encodeURIComponent(username));
  const u=r.user;
  if(await Acct.userId(u.ik,u.sk)!==u.userId)throw new Error('the server returned keys that do not match this user');
  this._learnAv(u.userId,u.av);this._learnRole(u.userId,u.role,u.muted);this._learnProf(u);
  const clash=[...this.recs.entries()].find(([k,p])=>k.startsWith('peer:')&&p.userId!==u.userId&&
   p.username&&p.username.toLowerCase()===u.username.toLowerCase());
  if(!this.get('peer:'+u.userId)){
   const tx=new Tx(this);
   await tx.put('peer:'+u.userId,{userId:u.userId,username:u.username,ik:u.ik,sk:u.sk,verified:false,added:Date.now(),
    replaced:clash?clash[1].userId:undefined});
   await tx.commit()}
  return {userId:u.userId,username:u.username,changed:!!clash}}

 /** Pins a user known only by id (an accepted request, a friend added elsewhere). */
 async _pinId(id){
  if(this.get('peer:'+id))return;
  await this.lock(id,async()=>{
   if(this.get('peer:'+id))return;
   const tx=new Tx(this);await this._peerRecord(id,tx);await tx.commit()})}

 async loadPeers(){
  if(!this.token)return;
  const r=await this.api('GET','/api/peers');
  const before=this.peers,first=!this.peersLoaded;
  this.peers=new Map(r.peers.map(p=>[p.userId,p]));this.peersLoaded=true;
  for(const p of r.peers){this._learnAv(p.userId,p.av);this._learnRole(p.userId,p.role,p.muted);this._learnProf(p)}
  for(const p of this.peers.values()){
   const was=before.get(p.userId);
   if(!first&&p.state==='incoming'&&(!was||was.state!=='incoming'))this.emit('peer','request',p);
   if(!first&&p.state==='friend'&&was&&was.state==='outgoing')this.emit('peer','accepted',p);
   if(p.state==='friend'&&!this.get('peer:'+p.userId))this._pinId(p.userId).catch(()=>{})}
  this._prunePresence();
  this.emit('change')}
 /** Forgets the presence of anyone this account can no longer reach: unfriended, blocked, or no
     group in common any more. The server stops telling us, so what we last heard would go stale. */
 _prunePresence(){
  const keep=new Set();
  for(const p of this.peers.values())if(p.state==='friend')keep.add(p.userId);
  for(const g of this.groups.values())for(const m of g.members)keep.add(m.userId);
  for(const [id,f] of this.prof)if(f.pr!=null&&!keep.has(id)&&!(this.me&&id===this.me.userId))this.prof.set(id,Object.assign({},f,{pr:null}))}

 /** action: request | accept | remove | block | unblock. target: a user id, or {username}. */
 async peerAction(action,target){
  const body={action};
  if(typeof target==='string')body.userId=target;
  else{
   // pin the identity first, so the keys we later message are the ones looked up here
   const u=await this.pinUser(target.username);body.userId=u.userId;
   if(u.changed)this.emit('peer','changed',{userId:u.userId,username:u.username})}
  const r=await this.api('POST','/api/peers',body);
  const p=r.peer;
  if(p.state==='none')this.peers.delete(p.userId);else this.peers.set(p.userId,p);
  if(p.state==='friend')await this._pinId(p.userId).catch(()=>{});
  this.emit('change');return p}
 requestFriend(username){return this.peerAction('request',{username})}

 async setDiscoverable(on){
  const r=await this.api('POST','/api/me/discovery',{on:!!on});
  this.discoverable=r.discoverable;this.emit('change');return r.discoverable}

 /** The chat filter, {level, action}: what it catches and whether caught messages are hidden or left out. */
 filter(){
  const f=this.get('pref:filter')||{};
  return {level:FILTER_LEVELS.includes(f.level)?f.level:'none',action:FILTER_ACTIONS.includes(f.action)?f.action:'hide'}}
 async setFilter(o){
  const f=Object.assign(this.filter(),o);
  if(!FILTER_LEVELS.includes(f.level)||!FILTER_ACTIONS.includes(f.action))throw new Error('unknown filter setting');
  const tx=new Tx(this);await tx.put('pref:filter',f);await tx.commit();return f}
 /** Alerts for new messages, {desktop, sound, mentions, preview}. Kept with the account (the
     installer can set them before the first sign-in), so they follow it to every browser. */
 notifyPrefs(){
  const n=this.get('pref:notify')||{};
  return {desktop:n.desktop===true,sound:n.sound===true,mentions:n.mentions===true,preview:n.preview!==false}}
 async setNotify(o){
  const n=Object.assign(this.notifyPrefs(),o);
  for(const k in n)if(typeof n[k]!=='boolean')throw new Error('unknown notification setting');
  const tx=new Tx(this);await tx.put('pref:notify',n);await tx.commit();return n}
 /** The account's theme, 'light' or 'dark', or '' when it has none. An image theme stays on its device. */
 themePref(){const t=(this.get('pref:theme')||{}).theme;return t==='light'||t==='dark'?t:''}
 async setThemePref(theme){
  if((theme!=='light'&&theme!=='dark')||this.themePref()===theme)return;
  const tx=new Tx(this);await tx.put('pref:theme',{theme});await tx.commit()}
 /** True when the chat filter catches m. Only what other people send is checked. */
 filtered(m){
  if(!m||m.dir!=='in'||m.deleted||!m.text)return false;
  const {level}=this.filter();if(level==='none')return false;
  const memo=this._fmemo||(this._fmemo=new WeakMap()),hit=memo.get(m);
  if(hit&&hit.level===level&&hit.text===m.text)return hit.v;
  const v=chatFilter.test(level,m.text);memo.set(m,{level,text:m.text,v});return v}
 /** Users who opted into global discovery; q filters by username. */
 async discover(q,offset){
  const r=await this.api('GET','/api/peers/global?q='+encodeURIComponent(q||'')+'&offset='+(offset||0));
  for(const u of r.users){this._learnAv(u.userId,u.av);this._learnProf(u)}
  return {users:r.users,more:r.more}}

 /* ---- profile pictures ---- */
 /** Notes the version of someone's picture the server last mentioned; true if it moved. */
 /** Notes whether a user is staff ('admin' | 'mod') and when their mute ends (0 = never), as the server last said. */
 _learnRole(id,role,muted){if(!id)return;
  if(role==='admin'||role==='mod')this.roles.set(id,role);else this.roles.delete(id);
  if(Number.isFinite(muted))this.mutes.set(id,muted);else this.mutes.delete(id)}
 /** Whether a user is muted right now; this account's own comes from its standing. */
 isMuted(id){if(this.me&&id===this.me.userId)return !!this.muted();
  const u=this.mutes.get(id);return u!=null&&(u===0||u>this.serverNow())}
 /** 'admin', 'mod' or null; this account's own comes from its standing. */
 role(id){return this.me&&id===this.me.userId?(this.staff?this.staff.role:null):this.roles.get(id)||null}
 _learnAv(id,v){if(!id||!Number.isFinite(v)||this.avv.get(id)===v)return false;this.avv.set(id,v);return true}
 /** Someone's profile picture as a data: URL, or null. It is fetched the first time it is
     asked for and again when its version moves on; 'change' fires once it arrives. */
 avatar(id){
  const v=this.avv.get(id),c=this.avc.get(id);
  if(!v)return null;
  if(c&&c.v===v)return c.src;
  if(this.token&&!this._avReq.has(id)){
   this._avReq.add(id);
   this.api('GET','/api/avatar/'+encodeURIComponent(id)).then(r=>{
    if(!this.token)return;
    this.avc.set(id,{v:r.av,src:isPic(r.avatar)?r.avatar:null});
    if(r.av>=(this.avv.get(id)||0))this.avv.set(id,r.av);
    this.emit('change')}).catch(()=>{}).finally(()=>this._avReq.delete(id))}
  return c?c.src:null}
 /** Uploads my picture (already shrunk), or removes it with null. */
 async setAvatar(src){
  if(src&&!isPic(src))throw new Error('that picture is not in a supported format');
  const r=await this.api('POST','/api/me/avatar',{avatar:src||null});
  this.avc.set(this.me.userId,{v:r.av,src:src||null});this.avv.set(this.me.userId,r.av);this.emit('change')}

 /* ---- profiles and presence ---- */
 /* Profiles are public like pictures, and like them are not end-to-end encrypted: a display
    name, a bio, a status line and an accent color. this.prof holds, per user, what the server
    last said in passing: {u: username, dn: display name, pv: profile version, pr: presence}.
    The rest of a profile is fetched once it is wanted, and again when pv moves on.
    Presence (pr) is only ever sent for people who can reach each other; null means unknown. */
 /** This account's own profile and presence mode, from a login or /api/me. */
 _mine(r){
  this.myProfile=cleanProfile(r.profile);
  this.presenceMode=PRESENCE_MODES.includes(r.presence)?r.presence:'auto';
  if(this.me)this.prof.set(this.me.userId,{u:this.me.username,dn:this.myProfile.display,ps:this.myProfile.status,pv:Number.isFinite(r.pv)?r.pv:0,pr:null})}
 /** Someone's custom status line, or ''. */
 status(id){
  if(this.me&&id===this.me.userId)return this.myProfile.status;
  const f=this.prof.get(id),c=this.profc.get(id);
  return f&&typeof f.ps==='string'?f.ps:c?c.data.status:''}
 /** Notes what a view of a user says about their profile; true if anything moved. A view
     without a `pr` key (the global list) says nothing about presence, so it is left alone. */
 _learnProf(u){
  if(!u||typeof u.userId!=='string'||!u.userId)return false;
  const o=this.prof.get(u.userId)||{},n=Object.assign({},o);
  if(typeof u.username==='string'&&u.username)n.u=u.username;
  if(typeof u.dn==='string')n.dn=u.dn.slice(0,PROFMAX.display);
  if(typeof u.ps==='string')n.ps=u.ps.slice(0,PROFMAX.status);
  if(Number.isFinite(u.pv))n.pv=u.pv;
  if('pr' in u)n.pr=PRESENCES.includes(u.pr)?u.pr:null;
  if(n.u===o.u&&n.dn===o.dn&&n.ps===o.ps&&n.pv===o.pv&&n.pr===o.pr)return false;
  this.prof.set(u.userId,n);return true}
 /** Someone's current username, as the server last said. */
 username(id){
  if(this.me&&id===this.me.userId)return this.me.username;
  const f=this.prof.get(id),r=this.peers.get(id),p=this.peer(id);
  if(f&&f.u)return f.u;
  if(r&&r.username)return r.username;
  if(p.username)return p.username;
  for(const g of this.groups.values()){const m=g.members.find(x=>x.userId===id);if(m)return m.username}
  return null}
 /** Someone's whole profile {username, created, display, bio, status, accent}, or null until it
     arrives: it is fetched the first time it is asked for and again when its version moves on;
     'change' fires once it is in. */
 profile(id){
  if(!id||isDiscord(id)||isGroup(id))return null;
  if(this.me&&id===this.me.userId)return Object.assign({username:this.me.username,created:this.me.created||0},this.myProfile,{tag:this.myTag(),stags:this.myStags||[]});
  const f=this.prof.get(id),c=this.profc.get(id);
  if(c&&(!f||!Number.isFinite(f.pv)||c.v===f.pv))return c.data;
  const failed=this._pfFail.get(id);
  if(this.token&&!this._pfReq.has(id)&&!(failed&&Date.now()-failed<30000))this.fetchProfile(id).catch(()=>{});
  return c?c.data:null}
 /** Fetches someone's profile now, cached or not, and returns it. Changes to a profile are only
     pushed to people who can reach its owner, so a stranger's copy (and the group tag on it) is
     refreshed this way whenever it is opened. */
 async fetchProfile(id){
  if(this.me&&id===this.me.userId)return this.profile(id);
  this._pfReq.add(id);
  try{
   const r=await this.api('GET','/api/profile/'+encodeURIComponent(id));
   if(!this.token)return null;
   const u=r.user;if(!u||u.userId!==id)throw new Error('wrong profile');
   this._learnProf(u);this._learnAv(id,u.av);this._learnRole(id,u.role,u.muted);
   const data=Object.assign({username:String(u.username||''),created:Number.isFinite(u.created)?u.created:0},cleanProfile(u.profile),{tag:cleanTag(u.gtag),stags:cleanStags(u.stags)});
   this.profc.set(id,{v:u.pv,data});
   this._pfFail.delete(id);this.emit('change');return data}
  catch(e){this._pfFail.set(id,Date.now());throw e}
  finally{this._pfReq.delete(id)}}
 /** Changes any of {display, bio, status, accent}; fields left out stay as they are. */
 async setProfile(o){
  const r=await this.api('POST','/api/me/profile',o);
  this.myProfile=cleanProfile(r.profile);
  this._learnProf({userId:this.me.userId,dn:this.myProfile.display,ps:this.myProfile.status,pv:r.pv});
  this.emit('change');return this.myProfile}
 /** What others see of this account: 'online', 'idle', 'dnd', 'offline', or 'invisible' (signed in, shown offline). */
 presence(id){
  if(this.me&&id===this.me.userId){
   if(this.wsState!=='live')return 'offline';
   return this.presenceMode==='invisible'?'invisible':this.presenceMode==='dnd'?'dnd':this.idle?'idle':'online'}
  const f=this.prof.get(id);return f&&f.pr||null}
 /** auto (online or idle, by activity), dnd (do not disturb) or invisible. */
 async setPresence(mode){
  if(!PRESENCE_MODES.includes(mode))throw new Error('unknown presence');
  const r=await this.api('POST','/api/me/presence',{mode});
  this.presenceMode=r.presence;this.emit('change');return r.presence}
 /** Whether the user has been away from the keyboard; the server shows them idle while they are. */
 setIdle(idle){
  idle=!!idle;if(idle===this.idle)return;
  this.idle=idle;
  if(this.ws&&this.wsState==='live'){try{this.ws.send(JSON.stringify({t:'idle',idle}))}catch(e){}}
  this.emit('change')}
 /** A new username. It takes the password, which is checked against the current one. */
 async rename(username,pass){
  username=String(username||'').trim();

/* ---------- image theme ----------
   A background picture the whole palette is drawn from. analyze() finds the picture's most
   common colors and sorts them dark to light; build() hands them out to the surfaces in that
   order (darkest first on a dark theme, lightest first on a light one) and picks the most
   colorful one as the accent. Whether the theme is dark or light, and so whether the text is
   light or dark, follows how bright the picture looks once darkened / lightened. Colors are
   worked in OKLab, where lightness matches what the eye sees. Kept on this device only. */
const Theme={
 DEF:{blur:12,tone:-25,op:72},
 VARS:[],
 cfg(){let c=null;try{c=JSON.parse(store.get('bgcfg')||'null')}catch(e){}return Object.assign({},this.DEF,c||{})},
 setCfg(p){store.set('bgcfg',JSON.stringify(Object.assign(this.cfg(),p)))},
 img(){return store.get('bgimg')},
 pal(){try{return JSON.parse(store.get('bgpal')||'null')}catch(e){return null}},
 has(){return !!(this.img()&&this.pal())},
 /** What the rail's switch shows: 'light', 'dark' or 'image' (only while a picture is saved). */
 choice(){const t=store.get('theme');return t==='image'?(this.has()?'image':'dark'):t==='light'?'light':'dark'},

 // sRGB (0–255) ↔ OKLab
 lin(c){c/=255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4)},
 gam(c){c=Math.min(1,Math.max(0,c));return 255*(c<=0.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-0.055)},
 lab(rgb){const [r,g,b]=rgb.map(c=>this.lin(c));
  const l=Math.cbrt(0.4122214708*r+0.5363325363*g+0.0514459929*b),
   m=Math.cbrt(0.2119034982*r+0.6806995451*g+0.1073969566*b),
   s=Math.cbrt(0.0883024619*r+0.2817188376*g+0.6299787005*b);
  return [0.2104542553*l+0.7936177850*m-0.0040720468*s,1.9779984951*l-2.4285922050*m+0.4505937099*s,0.0259040371*l+0.7827717662*m-0.8086757660*s]},
 /** OKLab → linear RGB (may fall outside 0–1). */
 linRGB([L,a,b]){const l=(L+0.3963377774*a+0.2158037573*b)**3,m=(L-0.1055613458*a-0.0638541728*b)**3,s=(L-0.0894841775*a-1.2914855480*b)**3;
  return [4.0767416621*l-3.3077115913*m+0.2309699292*s,-1.2684380046*l+2.6097574011*m-0.3413193965*s,-0.0041960863*l-0.7034186147*m+1.7076147010*s]},
 dist(p,q){return Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2])},
 /** An OKLCH color (h in radians) as [r,g,b] 0–255, its chroma eased down until it fits sRGB. */
 rgb(L,C,h){let v;
  for(let i=0;i<30;i++,C*=0.88){v=this.linRGB([L,C*Math.cos(h),C*Math.sin(h)]);if(v.every(x=>x>=-1e-4&&x<=1.0001))break}
  return v.map(x=>Math.round(this.gam(x)))},
 hex(L,C,h){return '#'+this.rgb(L,C,h).map(x=>x.toString(16).padStart(2,'0')).join('')},
 rgba(L,C,h,a){return 'rgba('+this.rgb(L,C,h).join(',')+','+(+a.toFixed(3))+')'},

 /** The picture's palette: up to 8 of its commonest distinct colors, sorted dark to light,
     each with its share of the picture, plus the picture's mean lightness. */
 analyze(img){
  const k=Math.min(1,96/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.max(1,Math.round(img.naturalWidth*k)),h=Math.max(1,Math.round(img.naturalHeight*k));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data,bins=new Map();let n=0;
  // count pixels in 32×32×32 color bins
  for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;
   const key=(d[i]>>3)<<10|(d[i+1]>>3)<<5|d[i+2]>>3;let e=bins.get(key);
   if(!e)bins.set(key,e={n:0,r:0,g:0,b:0});
   e.n++;e.r+=d[i];e.g+=d[i+1];e.b+=d[i+2];n++}
  if(!n)throw new Error('that image has no visible pixels');
  const all=[...bins.values()].map(e=>({lab:this.lab([e.r/e.n,e.g/e.n,e.b/e.n]),n:e.n})).sort((a,b)=>b.n-a.n);
  const lum=all.reduce((s,e)=>s+e.lab[0]*e.n,0)/n;
  // seeds: the commonest bins that differ enough from each other (looser until there are 6)
  let seeds=[];
  for(const gap of [0.12,0.09,0.06,0.04,0.02]){seeds=[];
   for(const e of all){if(seeds.length>=8)break;if(seeds.every(s=>this.dist(s,e.lab)>gap))seeds.push(e.lab)}
   if(seeds.length>=6)break}
  // a few k-means rounds, so each color is the mean of the pixels nearest it
  let groups;
  for(let round=0;round<4;round++){
   groups=seeds.map(()=>({n:0,s:[0,0,0]}));
   for(const e of all){let bi=0,bd=Infinity;
    seeds.forEach((s,i)=>{const dd=this.dist(s,e.lab);if(dd<bd){bd=dd;bi=i}});
    const g=groups[bi];g.n+=e.n;for(let j=0;j<3;j++)g.s[j]+=e.lab[j]*e.n}
   seeds=groups.map((g,i)=>g.n?g.s.map(v=>v/g.n):seeds[i])}
  // shades that ended up nearly the same are one color
  const cl=seeds.map((lab,i)=>({lab,n:groups[i].n}));
  for(let i=0;i<cl.length;i++)for(let j=cl.length-1;j>i;j--)if(this.dist(cl[i].lab,cl[j].lab)<0.04){
   const a=cl[i],b=cl[j],t=a.n+b.n||1;a.lab=a.lab.map((v,q)=>(v*a.n+b.lab[q]*b.n)/t);a.n+=b.n;cl.splice(j,1)}
  const colors=cl.map(c=>({lab:c.lab.map(v=>+v.toFixed(4)),share:c.n/n}))
   .filter(c=>c.share>=0.01).sort((a,b)=>a.lab[0]-b.lab[0]);
  return {lum:+lum.toFixed(4),colors:colors.map(c=>{const [L,a,b]=c.lab;return {lab:c.lab,share:+c.share.toFixed(4),hex:this.hex(L,Math.hypot(a,b),Math.atan2(b,a))}})}},

 /** How bright the picture looks behind its darken (tone < 0) or lighten (tone > 0) layer. */
 seen(pal,tone){const t=tone/100;return t<0?pal.lum*(1+t):pal.lum+(1-pal.lum)*t},
 /** The theme for a palette: {dark, vars} where vars are the CSS variables to set. */
 build(pal,cfg){
  const dark=this.seen(pal,cfg.tone)<0.6,op=cfg.op/100;
  const cols=pal.colors.map(c=>({L:c.lab[0],C:Math.hypot(c.lab[1],c.lab[2]),h:Math.atan2(c.lab[2],c.lab[1]),share:c.share}));
  // surfaces, from the one text sits on most to the one nearest the text's own lightness
  const order=dark?cols:cols.slice().reverse(),cap=dark?0.045:0.025;
  const SLOTS=dark?[['bg',.165],['list',.18],['rail',.19],['input',.195],['panel',.21],['bubble',.228],['row',.238],['avatar',.3]]
   :[['bg',.975],['list',.962],['rail',.948],['input',.948],['panel',.935],['bubble',.928],['row',.912],['avatar',.87]];
  const v={},at={};
  SLOTS.forEach(([name,L],i)=>{const c=order[Math.round(i*(order.length-1)/(SLOTS.length-1))];
   at[name]=[L,Math.min(c.C,cap),c.h];v[name]=this.hex(...at[name])});
  // the text takes the background's hue, barely tinted
  const h0=at.bg[1]>0.004?at.bg[2]:1.3,ink=(L,c)=>this.hex(L,c,h0);
  Object.assign(v,dark?{text:ink(.95,.008),muted:ink(.72,.014),dim:ink(.62,.014),faint:ink(.55,.014),'avatar-fg':ink(.87,.012),
    line:'rgba(255,255,255,.08)',line2:'rgba(255,255,255,.14)'}
   :{text:ink(.22,.012),muted:ink(.45,.016),dim:ink(.53,.016),faint:ink(.62,.014),'avatar-fg':ink(.33,.014),
    line:'rgba(20,16,12,.1)',line2:'rgba(20,16,12,.18)'});
  // accent: the most colorful of the common colors (amber if the picture is all greys)
  const best=cols.reduce((b,c)=>c.C*(0.5+Math.sqrt(c.share))>b.C*(0.5+Math.sqrt(b.share))?c:b,cols[0]);
  const ah=best.C>0.03?best.h:1.31,ac=Math.min(0.2,Math.max(0.12,best.C));
  Object.assign(v,dark?{accent:this.hex(.79,ac,ah),'accent-soft':this.hex(.85,ac*.75,ah),'accent-ink':this.hex(.24,.05,ah),'accent-wash':this.rgba(.79,ac,ah,.13)}
   :{accent:this.hex(.52,ac,ah),'accent-soft':this.hex(.45,ac,ah),'accent-ink':this.hex(.98,.015,ah),'accent-wash':this.rgba(.52,ac,ah,.1)});
  // see-through versions of the big surfaces
  v['glass-bg']=this.rgba(...at.bg,op);v['glass-rail']=this.rgba(...at.rail,Math.min(1,op+.08));v['glass-list']=this.rgba(...at.list,Math.min(1,op+.04));
  return {dark,vars:v}},

 /** Puts the chosen theme on the page. */
 apply(fade){
  const r=document.documentElement,ch=this.choice();
  if(fade){r.classList.add('theme-fade');clearTimeout(this._t);this._t=setTimeout(()=>r.classList.remove('theme-fade'),350)}
  for(const k of this.VARS)r.style.removeProperty(k);
  this.VARS=[];
  if(ch!=='image'){r.classList.remove('imgtheme');r.dataset.theme=ch;return}
  const cfg=this.cfg(),th=this.build(this.pal(),cfg);
  r.dataset.theme=th.dark?'dark':'light';r.classList.add('imgtheme');
  for(const k in th.vars){r.style.setProperty('--'+k,th.vars[k]);this.VARS.push('--'+k)}
  const bi=$('#bgImg'),u=this.img();
  if(this._url!==u){bi.style.backgroundImage='url("'+u+'")';this._url=u}
  // the blurred edge fades to nothing, so the picture is drawn past the screen's edges
  bi.style.filter=cfg.blur?'blur('+cfg.blur+'px)':'';bi.style.inset=(-cfg.blur*2)+'px';
  const t=cfg.tone/100;$('#bgTint').style.background=t<0?'rgba(0,0,0,'+(-t)+')':'rgba(255,255,255,'+t+')'},

 /** Saves a new picture (shrunk until it fits in local storage) and switches to its theme. */
 async setImage(file){
  await withImage(file,img=>{
   const pal=this.analyze(img);
   store.set('bgimg',null);
   for(const [max,q] of [[1920,.85],[1600,.8],[1280,.75],[960,.7]]){
    const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*k));c.height=Math.max(1,Math.round(img.naturalHeight*k));
    const x=c.getContext('2d');x.fillStyle='#808080';x.fillRect(0,0,c.width,c.height);x.imageSmoothingQuality='high';x.drawImage(img,0,0,c.width,c.height);
    try{localStorage.setItem('marmot.bgimg',c.toDataURL('image/jpeg',q));store.set('bgpal',JSON.stringify(pal));store.set('theme','image');return}catch(e){}}
   throw new Error('could not keep that image: this browser is out of space for it')});
  this.apply(true)},
 /** Forgets the picture and goes back to the plain theme it looked closest to. */
 clear(){
  const was=document.documentElement.dataset.theme;
  store.set('bgimg',null);store.set('bgpal',null);
  if(store.get('theme')==='image')store.set('theme',was==='light'?'light':'dark');
  this._url=null;$('#bgImg').style.backgroundImage='';this.apply(true)}
};

/** :shortcodes: for the emoji above, from their keywords: each word on its own (:sob:, :skull:),
    and the first two and all of them joined (:thumbs_up:, :slight_smile:). The first emoji to
    claim a name keeps it; a few common names are pinned to the emoji people expect. */
const ECODE=(()=>{
 const c=new Map([['heart','❤️'],['+1','👍'],['-1','👎'],['thumbsup','👍'],['thumbsdown','👎'],['100','💯'],['smile','😄'],['laughing','😆'],['cry','😢']]);
 for(const cat of EMOJI)for(const x of cat.list){
  const w=x.k.split(' ').filter(Boolean);
  for(const n of [w.join('_'),w.slice(0,2).join('_')].concat(w))if(n&&!c.has(n))c.set(n,x.e)}
 return c})();
/** Turns every :shortcode: that names an emoji into that emoji; anything else is left as typed. */
const emojify=t=>t.replace(/:([a-z][a-z0-9_]{0,31}|[+-]1|100):/gi,(all,n)=>ECODE.get(n.toLowerCase())||all);

 /** What a chat's row in the list shows: its last message (l) and unread count (n).
     When a pile of messages comes in for a chat that is not open (catching up), the row
     stops at the first of them, with its count frozen and marked "+" (more) while the rest
     are still being worked through. It stays on that message until the chat is opened,
     or until something newer arrives once the catch-up is over. */
 rowState(id){
  const t=this.thread(id),l=t[t.length-1]||null,n=M.unread.get(id)||0,lid=l&&l.id;
  const busy=M.catchingUp(),seen=this._rowLast,prev=seen.get(id);seen.set(id,lid);
  let s=this._snap.get(id);
  // the row stops at the first unread message, however far the catch-up has got by the time
  // the list is drawn (right after logging in, that is often well into it)
  if(!s&&busy&&n&&lid!==prev&&id!==this.cur()&&l&&l.dir!=='out')
   this._snap.set(id,s={l:t[Math.max(0,t.length-n)]||l,n,done:undefined});
  if(!s)return {l,n,more:false};
  if(!busy){
   // first look after the catch-up: remember where it ended; anything past that is news
   if(s.done===undefined)s.done=lid;
   else if(lid!==s.done){this._snap.delete(id);return {l,n,more:false}}}
  return {l:s.l,n:busy?s.n:n,more:busy}},

 ssMemberRows(s){

 async ssAct(act,btn){
  const st=this._ss;if(!st)return;
  const sid=st.sid,s=M.srv(sid);if(!s)return this.close();
  const [a,x,y]=act.split(':');
  const run=async(fn,ok)=>{if(btn)btn.disabled=true;
   try{await fn();if(ok)toast(ok)}catch(e){if(this._ss)this._ss.err=e.message}
   if(this._ss){this._ss.confirm=null;this.ssFill()}};
  const op=(path,body)=>M.serverOp(path,Object.assign({server:sid},body));
  switch(a){
   case 'close':return this.close();
   case 'tab':st.tab=x;st.confirm=null;st.edit=null;return this.ssFill();
   case 'no':st.confirm=null;return this.ssFill();
   case 'rename':return run(()=>op('settings',{name:$('#ssName').value}),'server renamed');
   case 'icon-pick':{const f=await pickImage();if(!f)return;return run(async()=>M.setServerIcon(sid,await shrinkImage(f)),'server icon changed')}
   case 'icon-clear':return run(()=>M.setServerIcon(sid,null),'server icon removed');
   case 'leave':this.close();
    if(!await this.confirm('Leave '+s.name+'?',s.owner===M.me.userId?'You are the only member, so leaving deletes the server and everything in it.':'You can come back only with a new invite.','LEAVE'))return;
    try{await M.leaveServer(sid);this.S.srv=null;this.render();toast('left '+s.name)}catch(e){toast(e.message)}return;
   case 'del-server':st.confirm='delete';return this.ssFill();
   case 'del-server-yes':if(btn)btn.disabled=true;
    try{await M.deleteServer(sid);this.close();this.S.srv=null;this.render();toast('deleted '+s.name)}catch(e){st.err=e.message;st.confirm=null;this.ssFill()}return;
   case 'transfer':st.to=$('#ssTo').value;st.confirm='transfer';return this.ssFill();
   case 'transfer-yes':return run(()=>op('transfer',{user:st.to}),'handed over to '+M.displayName(st.to));
   case 'inv-make':return run(async()=>{st.code=await M.createInvite(sid,{hours:Number($('#ssHours').value),uses:Number($('#ssUses').value)})});
   case 'inv-copy':try{await navigator.clipboard.writeText(st.code.code);toast('invite code copied')}catch(e){toast('could not copy: select the code instead')}return;
   case 'ch-kind':st.kind=x;return this.ssFill();
   case 'ch-new':{const n=$('#ssNewCh').value.trim();if(!n)return;return run(()=>op('channel',{op:'create',name:n,kind:st.kind}))}
   case 'ch-edit':st.edit=x;return this.ssFill();
   case 'ch-cancel':st.edit=null;return this.ssFill();
   case 'ch-save':{const t=$('#ssChTopic'),b={op:'update',channel:x,name:$('#ssChName').value};if(t)b.topic=t.value;
    return run(async()=>{await op('channel',b);st.edit=null})}
   case 'ch-ro':{const ch=s.channels.find(c=>c.id===x);return run(()=>op('channel',{op:'update',channel:x,readonly:!(ch&&ch.readonly)}))}
   case 'ch-move':return run(()=>op('channel',{op:'move',channel:x,dir:Number(y)}));
   case 'ch-del':st.confirm='ch:'+x;return this.ssFill();
   case 'ch-del-yes':return run(()=>op('channel',{op:'delete',channel:x}));
   case 'r-sel':st.role=x;st.confirm=null;return this.ssFill();
   case 'r-move':return run(()=>op('role',{op:'move',role:x,dir:Number(y)}));
   case 'r-new':{const n=$('#ssNewRole').value.trim();if(!n)return;return run(async()=>{const r=await op('role',{op:'create',name:n});st.role=r.role})}
   case 'r-save':{
    const perms={};document.querySelectorAll('#ssBox [data-perm]').forEach(i=>{if(!i.disabled)perms[i.dataset.perm]=i.checked});
    const b={op:'update',role:st.role,perms};
    if($('#ssRoleName')){b.name=$('#ssRoleName').value;b.color=$('#ssRoleNoColor').checked?'':$('#ssRoleColor').value}
    return run(()=>op('role',b),'role saved')}
   case 'r-del':st.confirm='role';return this.ssFill();
   case 'r-del-yes':return run(()=>op('role',{op:'delete',role:st.role}));
   case 'm-roles':st.mem=st.mem===x?null:x;return this.ssFill();
   case 'm-role':{const m=(M.smembers.get(sid)||[]).find(z=>z.userId===x);return run(()=>op('member-role',{user:x,role:y,on:!(m&&m.roles.includes(y))}))}
   case 'm-kick':case 'm-ban':st.confirm={user:x,kind:a.slice(2)};return this.ssFill();
   case 'm-kick-yes':case 'm-ban-yes':{const reason=$('#ssReason')?$('#ssReason').value:'';
    return run(()=>op('kick',{user:x,ban:a==='m-ban-yes',reason}),(a==='m-ban-yes'?'banned ':'kicked ')+M.displayName(x))}
   case 'b-unban':return run(()=>op('unban',{user:x}),'ban lifted')}},

 confirm(title,note,go){
  return new Promise(res=>{
   let done=false;const fin=v=>{if(done)return;done=true;this.close();res(v)};
   this.modal('<h3>'+esc(title)+'</h3><div class="note">'+esc(note)+'</div>'+
    '<div class="modal-foot"><span class="grow"></span><button class="tbtn" data-m="no">CANCEL</button><button class="send" data-m="yes">'+esc(go)+'</button></div>',
    act=>fin(act==='yes'));
   this._onClose=()=>fin(false)})},

 /* ---------- pane ---------- */
 renderPane(){
  const pane=$('#pane'),scr=this.S.screen;
  // on a narrow screen Peers is only ever the list: a profile opens over it
  const sel=scr==='settings'?!!this.S.set:scr==='peers'?false:scr==='admin'?!!(this.S.adm&&this.S.adm.sel):scr==='servers'?!!this.S.srv:!!this.cur();
  $('#app').classList.toggle('in-pane',sel);
  if(scr==='servers')return this.renderServerPane(pane);
  if(scr==='admin'){
   // rebuilt only when the selection or its data changes, so half-typed reasons survive other renders
   const A=this.adm(),pk='admin:'+(A.sel||'')+':'+A.v;
   if(this.S.paneKey!==pk){if(!this.S.paneKey.startsWith('admin:'+(A.sel||'')+':'))this.enter(pane);this.S.paneKey=pk;pane.innerHTML=this.adminPaneHTML()}
   return}
  const chat=this.cur(),sec=this.S.set||'profile';
  // a conversation keeps its pane across Messages and Peers, so switching between them does not redraw it
  const key=scr==='settings'?'settings:'+sec:chat?'conv:'+chat:'empty:'+scr;
  if(key!==this.S.paneKey){
   this.S.paneKey=key;this.enter(pane);
   if(scr==='settings'){pane.innerHTML=sec==='profile'?this.profileHTML():sec==='appearance'?this.appearanceHTML():sec==='notifications'?this.notificationsHTML():this.settingsHTML();if(sec==='profile')this.initProfileForm()}
   else if(!chat)pane.innerHTML='<div class="empty">'+(!M.me?'':scr==='discord'?'SELECT A CHANNEL<br>OR JOIN ONE WITH + JOIN':scr==='peers'?'PICK SOMEONE TO SEE THEIR PROFILE<br>OR ADD A FRIEND WITH + ADD':'SELECT A CONVERSATION<br>OR START ONE WITH + NEW')+'</div>';
   else{
    const dm=!isGroup(chat)&&!isDiscord(chat),pf=dm?' data-pf="'+esc(chat)+'"':'';
    pane.innerHTML='<div class="pane-head"><button class="tbtn back" data-act="back">←</button>'+
     '<div class="av av-34" id="chatAv"'+pf+'></div><div style="min-width:0"><div class="pane-title" id="chatName"'+pf+'></div><div class="meta" id="chatMeta"></div></div>'+
     '<div class="acts" id="chatActs">'+(isDiscord(chat)?'<button class="tbtn danger" data-act="leave">LEAVE</button>'
      :isGroup(chat)?(M.can('purge')?'<button class="tbtn danger" data-act="purge">PURGE</button>':'')+'<button class="tbtn" data-act="g-call" id="gCallBtn">CALL</button><button class="tbtn" data-act="g-invite">INVITE</button><button class="tbtn" data-act="g-members" id="gManage">MANAGE</button><button class="tbtn danger" data-act="g-leave">LEAVE</button>'
      :(M.can('purge')?'<button class="tbtn danger" data-act="purge">PURGE</button>':'')+'<button class="tbtn" data-act="call" id="callBtn">CALL</button><button class="tbtn" data-act="profile">PROFILE</button><button class="tbtn" data-act="verify">VERIFY</button>')+'</div></div>'+
     '<div class="thread" id="thread"></div>'+
     '<div class="composer" id="composerBox"><div class="replybar hidden" id="replyBar"></div><div class="attbar hidden" id="attBar"></div><textarea id="composer" placeholder="'+(isDiscord(chat)?'Message '+esc(M.displayName(chat))+' on Discord…':isGroup(chat)?'Message the group…':'Write a message…')+'" maxlength="'+(isDiscord(chat)?DCTEXT:MAXTEXT)+'"></textarea>'+
     '<div class="composer-bar"><button class="cbtn" data-act="emoji" title="Emoji" aria-label="Emoji" aria-expanded="false">'+ICON.smile+'</button>'+
     (isDiscord(chat)?'':'<button class="cbtn" data-act="attach" title="Send an image (or paste or drop one)" aria-label="Send an image">'+ICON.image+'</button>')+
     '<span class="hint" id="cHint">↵ send · shift+↵ newline</span><button class="send" data-act="send">SEND</button></div></div>'+
     '<div class="gate hidden" id="gate"></div>';
    if(M.isFriend(chat)||M.link(chat)||M.group(chat))$('#composer').focus()}}
  if(scr==='settings')sec==='profile'?this.fillProfile():sec==='appearance'?this.fillAppearance():sec==='notifications'?this.fillNotifications():this.fillSettings();
  else if(chat){this.renderThread();this.renderReply();this.renderAtt();this.renderHint();if(!this._follow)this.more()}},
 /** The composer's hint line, which says so while this account is muted. */
 renderHint(){
  const h=$('#cHint');if(!h)return;
  const mu=M.muted(),t=mu?'you are muted '+this.muteText(mu):'↵ send · shift+↵ newline';
  if(h.textContent!==t)h.textContent=t;h.classList.toggle('warn',!!mu)},
 muteText(m){return m.until===0?'permanently':'until '+new Date(m.until).toLocaleString()},

 renderThread(){
  const id=this.cur(),th=$('#thread');if(!id||!th)return;
  if(isDiscord(id))return this.renderDiscord(id,th);
  if(isGroup(id))return this.renderGroup(id,th);
  const p=M.peer(id),st=M.relation(id);
  this.setAv($('#chatAv'),id);
  $('#chatName').innerHTML=esc(M.displayName(id))+this.staffTag(id)+(p.verified?' <span class="chip ok">VERIFIED</span>':'');
  const pr=M.presence(id);
  $('#chatMeta').textContent=[pr&&this.PRES[pr],M.status(id),st==='friend'?'session '+M.sessionState(id):this.STATE[st][0].toLowerCase()].filter(Boolean).join(' · ');
  // only friends can be messaged: otherwise the composer gives way to the next step
  const gate=$('#gate'),friend=st==='friend',vc=M.voice.call;
  $('#composerBox').classList.toggle('hidden',!friend);gate.classList.toggle('hidden',friend);
  // CALL answers a call ringing from this person; otherwise one call at a time
  const cb=$('#callBtn');
  const withThem=!!vc&&!vc.group&&vc.peer===id;
  if(cb){cb.disabled=!friend||(!!vc&&!(withThem&&vc.state==='ringing'));cb.textContent=withThem?(vc.state==='ringing'?'ANSWER':'IN CALL'):'CALL'}
  if(!friend){
   const n=esc(M.displayName(id));
   const g={none:['You and '+n+' are not friends, so neither of you can send messages.','request','ADD FRIEND'],
    incoming:[n+' wants to be friends.','accept','ACCEPT'],
    outgoing:['Waiting for '+n+' to accept your friend request.',null],
    blocked:['You blocked '+n+'.','unblock','UNBLOCK']}[st];
   const html='<span class="grow">'+g[0]+'</span>'+(g[1]?'<button class="send" data-peer-act="'+g[1]+'">'+g[2]+'</button>':'');
   if(gate.innerHTML!==html)gate.innerHTML=html}
  if(M.unread.get(id)&&!document.hidden){M.unread.delete(id);M.pinged.delete(id);this.renderRail();this.renderCol()}
  const atBottom=this.following(th);
  let html='',lastDay='';
  const list=this.thread(id),opened=this._seenFor!==id,shown=this.win(id,list,atBottom),fresh=this.fresh(id,shown);
  if(!list.length)html='<div class="sys" data-k="intro">messages are end-to-end encrypted with the Signal protocol.<br>verify the safety number to be sure you are talking to '+esc(M.displayName(id))+'.</div>';
  if(p.replaced)html+='<div class="sys" data-k="replaced">this username used to belong to a different identity. verify before trusting it.</div>';
  if(this._more)html='<div class="sys" data-k="earlier"><button data-earlier>scroll up for earlier messages</button></div>'+html;
  shown.forEach((m,i)=>{
   const day=dayLabel(m.ts);
   if(day!==lastDay){html+='<div class="day" data-k="d'+day+'"><i></i><span>'+day+'</span><i></i></div>';lastDay=day}
   if(m.dir==='sys'){html+='<div class="sys'+fresh(m)+'" data-k="m'+esc(m.id)+'">'+esc(m.text)+'</div>';return}
   const state=m.dir==='out'?(m.state==='failed'
     ?' · failed — <button data-retry="'+esc(m.id)+'">retry</button> · <button data-discard="'+esc(m.id)+'">discard</button>'
     :' · '+m.state):'';
   html+=this.bubble(id,m,{fresh:fresh(m),state,reply:friend,av:this.runEnd(id,shown,i),run:this.runCls(id,shown,i)})});
  this.patch(th,html+this.heldBar());
  this.settle(th,atBottom,opened)},

 /** Makes el's children match html while keeping the nodes that stay (matched by data-k),
     so a bubble that is still animating in, or easing from sending to sent, is not cut short. */
 patch(el,html,key){
  key=key||(n=>n.dataset.k);
  const t=document.createElement('div');t.innerHTML=html;
  const old=new Map();for(const c of el.children){const k=key(c);if(k)old.set(k,c)}
  const want=[...t.childNodes].map(n=>{
   const k=n.nodeType===1&&key(n),o=k&&old.get(k);
   if(o&&o.tagName===n.tagName){old.delete(k);this.morph(o,n);return o}
   return n});
  want.forEach((n,i)=>{if(el.childNodes[i]!==n)el.insertBefore(n,el.childNodes[i]||null)});
  while(el.childNodes.length>want.length)el.lastChild.remove()},
 morph(o,n){
  for(const a of [...o.attributes])if(!n.hasAttribute(a.name))o.removeAttribute(a.name);
  for(const a of n.attributes){
   // an entrance animation keeps running until it is done, even once the item is no longer new
   const v=a.name==='class'&&o.classList.contains('new')&&!n.classList.contains('new')?a.value+' new':a.value;
   if(o.getAttribute(a.name)!==v)o.setAttribute(a.name,v)}
  const oc=o.childNodes,nc=[...n.childNodes];
  nc.forEach((c,i)=>{
   const x=oc[i];
   if(x&&x.nodeType===c.nodeType&&(c.nodeType!==1||x.tagName===c.tagName)){
    if(c.nodeType===1)this.morph(x,c);else if(x.nodeValue!==c.nodeValue)x.nodeValue=c.nodeValue}
   else if(x)o.replaceChild(c,x);else o.appendChild(c)});
  while(oc.length>nc.length)o.lastChild.remove()},

 /** The part of a thread that is drawn: the newest FIRST messages at first, PAGE more
     each time the reader nears the top (more), and back to FIRST once they are at the
     bottom again. The window starts at a timestamp, so new arrivals only add to it. */
 win(id,list,atBottom){
  if(this._winFor!==id){this._winFor=id;this._from=null;this._hold=false}
  if(!M.catchingUp())this._released=false;
  // a pile arriving in the open thread is held back (see heldBar) instead of drawn one by one
  if(this._seenFor===id&&!this._hold&&!this._released&&M.catchingUp())this._hold=true;
  // the catch-up is over and the reader is still at the bottom: straight to the newest few
  if(this._hold&&!M.catchingUp()&&atBottom){this._hold=false;this._from=null;this._stick=true}
  let i=this._from==null?-1:list.findIndex(m=>m.ts>=this._from);
  if(i<0||!this._hold&&atBottom&&list.length-i>2*PAGE){i=Math.max(0,list.length-FIRST);this._from=list.length?list[i].ts:null}
  this._more=i>0;
  let shown=list.slice(i);this._heldN=0;
  if(this._hold){
   const seen=this._seen,all=shown;
   shown=all.filter(m=>seen.has(m.id)||m.dir==='out');this._heldN=all.length-shown.length;
   if(!this._heldN&&!M.catchingUp())this._hold=false}
  return shown},
 /** While a thread holds back a pile of arrivals: the line at its foot that draws them. */
 heldBar(){
  const n=this._heldN;if(!n)return '';
  return '<div class="sys held" data-k="held"><button data-show-held>'+(M.catchingUp()?'loading new messages…':count(n)+' new message'+(n>1?'s':'')+' · show')+'</button></div>'},
 /** The reader tried to scroll up while already at the top (wheel or swipe). With only the
     newest few messages drawn, the thread may be too short to scroll at all, so this is how
     older ones are reached then. */
 pulled(th){if(th.scrollTop<=0){this._follow=false;this.more(true)}},
 /** Lets go of what the open thread held back, drawing the newest page of it at once. */
 showHeld(){
  this._hold=false;this._released=true;this._from=null;this._stick=true;this._follow=true;
  this.renderThread()},
 /** Whether the thread stays pinned to the newest message: the reader has not scrolled up
     since they were last at the bottom. The scroll position alone cannot tell: when a burst
     arrives (catching up after being offline), a smooth scroll to the bottom is still running
     when the next batch is drawn, so the thread would look scrolled away, stop following, and
     never trim its window, drawing every message that came in. */
 following(th){
  if(this._followFor!==this.cur()){this._followFor=this.cur();this._follow=true;this._lastTop=0}
  return this._follow||th.scrollHeight-th.scrollTop-th.clientHeight<60},
 /** After a redraw: back to the bottom when following (at once if it is far, or the thread just opened). */
 settle(th,atBottom,opened){
  this._lastTop=th.scrollTop;
  if(!atBottom&&!this._stick)return;
  const far=th.scrollHeight-th.scrollTop-th.clientHeight>th.clientHeight;
  th.scrollTo({top:th.scrollHeight,behavior:opened||far?'auto':'smooth'});
  this._stick=false;this._follow=true},
 /** The reader scrolled: up means they stopped following, reaching the bottom picks it up again.
     Older pages load only once they have scrolled up themselves, not while a redraw scrolls down. */
 scrolled(th){
  const t=th.scrollTop;
  if(t<this._lastTop-4)this._follow=false;
  if(th.scrollHeight-t-th.clientHeight<60)this._follow=true;
  this._lastTop=t;
  if(!this._follow)this.more()},
 /** Widens the window back to ts. What comes into view is history, not news, so it does not animate in. */
 reveal(ts){
  const seen=this._seen;
  if(seen)for(const m of M.thread(this.cur()))if(m.ts>=ts&&m.ts<this._from)seen.add(m.id);
  this._from=ts},
 /** Draws the next page of older messages when the reader is near the top, keeping their place. */
 more(force){
  const th=$('#thread'),id=this.cur();
  if(!th||!id||id!==this._winFor||!this._more||!force&&th.scrollTop>200)return;
  const list=this.thread(id),i=list.findIndex(m=>m.ts>=this._from);
  if(i<=0)return;
  this.reveal(list[Math.max(0,i-PAGE)].ts);
  const h=th.scrollHeight,top=th.scrollTop;
  this.renderThread();
  th.scrollTop=top+th.scrollHeight-h;this._lastTop=th.scrollTop},

 /** m => ' new' for messages that arrived since this thread was last drawn.
     Opening a thread animates the pane instead, so nothing counts as new then. Nor does a
     pile of arrivals (catching up on the mailbox, or back after being away): that is drawn
     as it is, not as a flurry of entrances. */
 fresh(id,shown){
  const first=this._seenFor!==id;
  if(first){this._seenFor=id;this._seen=new Set()}
  const seen=this._seen;
  const calm=first||M.catchingUp()||document.hidden||shown.reduce((n,m)=>n+!seen.has(m.id),0)>BURST;
  return m=>{if(seen.has(m.id))return '';seen.add(m.id);return calm?'':' new'}},

 /* ---- chat filter (see chatFilter) ---- */
 /** A conversation's messages as shown: under "delete", what the chat filter catches is left out. */
 thread(id){const list=M.thread(id);return M.filter().action==='delete'?list.filter(m=>!M.filtered(m)):list},
 /** True while the chat filter hides m and it has not been clicked open. */
 veiled(conv,m){return M.filtered(m)&&!this.S.unveiled.has(conv+'|'+m.id)},
 /** A message in one line, as the chat list and the reply strip show it. */
 gist(conv,m){return this.veiled(conv,m)?'hidden by your chat filter':gist(m)},

 /** Message text, escaped, with @username pings picked out (mine stand out more). */
 rich(t){
  const me=M.me?M.me.username.toLowerCase():'';
  return esc(t).replace(MENTION,(all,p,n)=>{const name=n.replace(/\.+$/,'');
   return p+'<span class="ping'+(name.toLowerCase()===me?' me':'')+'">@'+name+'</span>'+n.slice(name.length)})},
 /** One chat bubble: who wrote it, the message it quotes, and the actions that
     float over its corner on hover (or on tap, which focuses it).
     o: {fresh, state (stamp suffix), who (html), reply (whether replying is possible),
         av (true: the sender's picture beside it; false: the space for it; absent: neither)} */
 bubble(conv,m,o){
  const settled=m.state!=='sending'&&m.state!=='failed',r=this.S.reply,veil=this.veiled(conv,m),
   // a filtered message clicked open: outlined, and a click on it hides it again
   rv=!veil&&M.filtered(m)?' unveiled" data-reveil="'+esc(m.id)+'" title="Click to hide again':'';
  const acts=settled?'<div class="macts">'+
   (o.reply&&!m.deleted?'<button data-react="'+esc(m.id)+'" title="Add reaction" aria-label="Add reaction" aria-haspopup="true">'+ICON.react+'</button>'+
    '<button data-reply="'+esc(m.id)+'" title="Reply" aria-label="Reply">'+ICON.reply+'</button>':'')+
   '<button class="del" data-del="'+esc(m.id)+'" title="Delete" aria-label="Delete">'+ICON.trash+'</button></div>':'';
  const run=o.run||'';
  return '<div class="msg '+m.dir+o.fresh+run+(m.state==='failed'?' failed':'')+(m.state==='sending'?' sending':'')+(m.deleted?' gone':'')+
   (r&&r.conv===conv&&r.id===m.id?' replying':'')+(m.dir==='in'&&!m.deleted&&M.pings(m.text)?' pinged':'')+'" data-k="m'+esc(m.id)+'" tabindex="-1"'+
   (run.includes('mid')?' title="'+esc(hm(m.ts))+'"':'')+'>'+(run.includes('cont')?'':o.who||'')+
   (o.av==null?'':'<div class="mrow">'+(o.av?this.av(this.sender(conv,m),'mav','',isDiscord(conv)?'':' data-pf="'+esc(this.sender(conv,m))+'"'):'<div class="av mav ghost"></div>'))+
   '<div class="bub'+(m.re&&!m.deleted&&!veil?' has-re':'')+'">'+acts+(m.re&&!m.deleted&&!veil?this.quoteHTML(conv,m.re,true):'')+
   (veil?'<button class="body veil" data-unveil="'+esc(m.id)+'" title="Show this message">hidden by your chat filter · click to show</button></div>'
   :m.poll&&!m.deleted?'<div class="body'+rv+'">'+this.rich(m.text.split('\n')[0])+this.pollHTML(m)+'</div></div>'
   :m.img&&!m.deleted?'<div class="body has-img'+rv+'">'+this.imgHTML(m)+(m.text?'<div class="cap">'+this.rich(m.text)+'</div>':'')+'</div></div>'
    :'<div class="body'+rv+'">'+(m.deleted?(m.mod?'removed by staff':m.dir==='out'?'you deleted this message':'message deleted'):this.rich(m.text))+'</div></div>')+
   (o.av==null?'':'</div>')+(m.deleted||veil?'':this.reactsHTML(m,o.reply&&settled,o.av!=null))+
   '<div class="stamp">'+hm(m.ts)+(m.deleted?'':o.state)+'</div></div>'},
 /** The reactions under a bubble, one chip per emoji with how many chose it; hover one
     to see who. When `can`, a click adds my reaction or takes it back. */
 reactsHTML(m,can,indent){
  const r=Object.entries(m.reacts||{}).filter(([e,who])=>Array.isArray(who)&&who.length);
  if(!r.length)return '';
  return '<div class="reacts'+(indent?' indent':'')+'">'+r.map(([e,who])=>{
   const mine=who.includes(M.me.userId),names=who.map(x=>x===M.me.userId?'you':M.displayName(x)).join(', ');
   return '<button class="rx'+(mine?' mine':'')+'"'+(can?' data-rx="'+esc(m.id)+'" data-e="'+esc(e)+'"':' disabled')+
    ' title="'+esc(names)+' reacted with '+esc(e)+'" aria-pressed="'+mine+'">'+esc(e)+'<span>'+who.length+'</span></button>'}).join('')+'</div>'},
 /** A poll's options as buttons, each with its share of the votes; hover one to see who picked it. */
 pollHTML(m){
  const p=m.poll,votes=m.votes||{},n=p.opts.map(()=>[]),left=p.ends-M.serverNow(),open=left>0;
  for(const [who,o] of Object.entries(votes))if(n[o])n[o].push(who===M.me.userId?'you':M.displayName(who));
  const total=Object.keys(votes).length,mine=votes[M.me.userId],top=Math.max(...n.map(x=>x.length));
  const span=ms=>{const mi=Math.max(1,Math.round(ms/60000));return mi<60?mi+'m':mi<2880?Math.round(mi/60)+'h':Math.round(mi/1440)+'d'};
  return '<div class="poll"><div class="pq">'+esc(p.q)+'</div>'+p.opts.map((o,i)=>{
   const c=n[i].length,pct=total?Math.round(c*100/total):0;
   return '<button class="popt'+(mine===i?' mine':'')+(!open&&c&&c===top?' won':'')+'"'+(open?' data-vote="'+esc(m.id)+'" data-o="'+i+'"':' disabled')+
    ' title="'+esc(c?n[i].join(', '):'no votes yet')+'"><span class="bar" style="width:'+pct+'%"></span><span class="ot">'+esc(o)+'</span><span class="oc">'+c+'</span></button>'}).join('')+
   '<div class="pf">'+total+' vote'+(total===1?'':'s')+' · '+(open?'ends in '+span(left)+(mine!=null?' · click your pick again to take it back':''):'ended')+'</div></div>'},
 /** A message's image at most 320×360, sized up front so the thread does not jump as it decodes. */
 imgHTML(m){
  const w=m.w||320,h=m.h||240,k=Math.min(1,320/w,360/h);

   '<img src="'+esc(m.img)+'" width="'+Math.max(1,Math.round(w*k))+'" height="'+Math.max(1,Math.round(h*k))+'" alt=""></button>'},
 /** The full-size view of a message's image, with a way to save it. */
 viewImage(id){
  const conv=this.cur();
  const m=conv&&(M.get('msg:'+conv+':'+id)||[...M.pending.values()].find(x=>x.id===id));
  if(!m||!m.img)return;
  const ext=(m.img.match(/^data:image\/(\w+)/)||[])[1]||'img';
  this.modal('<img class="lightbox" src="'+esc(m.img)+'" alt="">'+(m.text?'<div class="note" style="white-space:pre-wrap">'+esc(m.text)+'</div>':'')+
   '<div class="modal-foot"><span class="grow note" style="margin:0">'+(m.w&&m.h?m.w+'×'+m.h+' · ':'')+esc(m.dir==='out'?'you':M.displayName(m.from||conv))+' · '+esc(hm(m.ts))+'</span>'+
   '<a class="tbtn" href="'+esc(m.img)+'" download="marmot-'+esc(m.id)+'.'+ext+'">SAVE</a><button class="send" data-m="close">CLOSE</button></div>',
   act=>{if(act==='close')this.close()})},

 /* ---- sending images ---- */
 async attach(){const f=await pickImage();if(f)this.attachFile(f)},
 /** Shrinks an image to send and parks it above the composer until SEND. */
 async attachFile(f){
  const conv=this.cur();if(!conv||isDiscord(conv)||!$('#composer'))return;
  try{const r=await fitImage(f);this.S.att=Object.assign({conv},r);this.render();const ta=$('#composer');if(ta)ta.focus()}
  catch(e){toast(e.message)}},
 renderAtt(){
  const bar=$('#attBar');if(!bar)return;
  const a=this.S.att;

 /* ---- emoji browser ---- */

 /** Opens the emoji browser over the composer, or with `react` (a message id) beside

   EMOJI.map((c,i)=>'<button data-ecat="'+i+'" title="'+c.name+'">'+c.icon+'</button>').join('')+'</div><div class="egrid"></div>';

 /** Keeps the reaction picker beside its message: above it when there is room, else below. */
 emojiPlace(){
