   'Discord chats are not end-to-end encrypted: the Marmot server and Discord can read them.</div>'+
   '<div class="field"><div class="lbl">INVITE CODE</div><input class="inp" id="dcCode" spellcheck="false" autocomplete="off" placeholder="XXXXX-XXXXX"></div>'+
   '<div class="err" id="dcErr"></div><div class="modal-foot"><span class="grow"></span><button class="tbtn" data-m="cancel">CANCEL</button><button class="send" data-m="go">JOIN</button></div>',

    const err=$('#dcErr'),code=$('#dcCode').value.trim();err.textContent='';

    catch(e){err.textContent=e.message}});
  $('#dcCode').addEventListener('keydown',e=>{if(e.key==='Enter')$('[data-m=go]').click()})},

 async verify(id){

 /* ---------- voice ---------- */
 async call(id){
  try{await M.voice.start(id)}
  catch(e){toast(/permission|denied|notallowed/i.test(e.name+' '+e.message)?'microphone access was blocked — allow it in the browser to call':'call failed: '+e.message,7000)}},
 async answer(){
  try{await M.voice.accept()}
  catch(e){toast(/permission|denied|notallowed/i.test(e.name+' '+e.message)?'microphone access was blocked — allow it in the browser to answer':'could not answer: '+e.message,7000)}},

 /** The floating call bar. It sits outside the panes so a call survives switching screens. */
 renderCall(){
  const box=$('#callbar'),c=M.voice.call,au=$('#callAudio');
  const remote=(c&&c.remote)||null;
  if(au.srcObject!==remote){au.srcObject=remote;if(remote)au.play().catch(()=>{})}
  Ring.set(!!c&&c.dir==='in'&&c.state==='ringing');
  $('#app').classList.toggle('with-call',!!c);
  if(!c){
   clearInterval(this._callTick);this._callTick=0;
   if(box.classList.contains('callbar')&&!box.classList.contains('out')){
    box.classList.add('out');
    setTimeout(()=>{if(!M.voice.call){box.innerHTML='';box.className=''}},180)}
   return}
  if(!this._callTick)this._callTick=setInterval(()=>this.renderCall(),1000);
  const ringing=c.dir==='in'&&c.state==='ringing';
  const st=c.state==='active'?(c.unstable?'reconnecting… · ':'')+clock(Math.floor((Date.now()-c.started)/1000))+(c.muted?' · muted':'')
   :{calling:'calling…',ringing:'incoming voice call',connecting:'connecting…'}[c.state];
  const html='<div class="av av-34">'+esc(initials(M.displayName(c.peer)))+'</div>'+
   '<div class="grow"><button class="who-btn" data-act="call-open"><div class="pane-title">'+esc(M.displayName(c.peer))+
   (M.peer(c.peer).verified?' <span class="chip ok">VERIFIED</span>':'')+'</div></button>'+
   '<div class="meta'+(c.unstable?' warn':'')+'">'+esc(st)+' · end-to-end encrypted</div></div>'+
   (ringing?'<button class="hang" data-act="call-decline">DECLINE</button><button class="send ok" data-act="call-accept">ACCEPT</button>'
    :'<button class="tbtn" data-act="call-mute" aria-pressed="'+c.muted+'">'+(c.muted?'UNMUTE':'MUTE')+'</button><button class="hang" data-act="call-hangup">HANG UP</button>');
  box.className='callbar'+(ringing?' ringing':'');
  if(box.innerHTML!==html)box.innerHTML=html}
};

/** Incoming-call tone, synthesised so the file stays standalone. */
const Ring={ctx:null,timer:0,on:false,
 set(on){
  if(on===this.on)return;
  this.on=on;clearInterval(this.timer);
  if(on){this.beep();this.timer=setInterval(()=>this.beep(),2200)}},
 beep(){
  try{
   const a=this.ctx||(this.ctx=new AudioContext());
   if(a.state==='suspended')a.resume().catch(()=>{});
   const t=a.currentTime;
   for(const [d,f] of [[0,880],[0.28,660]]){
    const o=a.createOscillator(),g=a.createGain();
    o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(0.12,t+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.24);
    o.connect(g).connect(a.destination);o.start(t+d);o.stop(t+d+0.26)}}
  catch(e){}}};

/* ---------- wiring ---------- */
document.addEventListener('click',async e=>{
 const t=e.target.closest('button');if(!t||t.closest('#overlay'))return;
 if(t.dataset.screen){UI.screen(t.dataset.screen);return}
 if(t.dataset.themeSet){const r=document.documentElement;r.classList.add('theme-fade');clearTimeout(UI._themeT);UI._themeT=setTimeout(()=>r.classList.remove('theme-fade'),350);r.dataset.theme=t.dataset.themeSet;store.set('theme',t.dataset.themeSet);UI.render();return}
 if(t.dataset.chat){UI.open(t.dataset.chat);return}
 if(t.dataset.dc){UI.open(t.dataset.dc);return}
 if(t.dataset.dcpub){UI.joinPublic(t.dataset.dcpub);return}
 if(t.dataset.peer){UI.S.peer=t.dataset.peer;UI.render();return}
 if(t.dataset.peerAct){UI.peerAct(t.dataset.peerAct,UI.S.screen==='peers'?UI.S.peer:UI.S.chat);return}
 if(t.dataset.retry){M.retry(t.dataset.retry).catch(err=>toast('not sent: '+err.message));return}
 if(t.dataset.discard){M.discard(t.dataset.discard);return}
 if(t.id==='colAction'){if(M.me)UI.S.screen==='discord'?UI.joinDiscord():UI.S.screen==='messages'?UI.newChat():UI.addPeer();return}
 switch(t.dataset.act){
  case 'send':UI.send();break;
  case 'back':
   if(UI.S.screen==='peers')UI.S.peer=null;else if(UI.S.screen==='settings')UI.S.set=false;
   else if(UI.S.screen==='discord')UI.S.dc=null;else UI.S.chat=null;
   UI.render();break;
  case 'verify':UI.verify(UI.S.chat);break;
  case 'call':UI.call(UI.S.chat);break;
  case 'call-accept':UI.answer();break;
  case 'call-decline':M.voice.decline();break;
  case 'call-hangup':M.voice.hangup();break;
  case 'call-mute':M.voice.setMuted(!(M.voice.call&&M.voice.call.muted));break;
  case 'call-open':if(M.voice.call)UI.open(M.voice.call.peer);break;
  case 'profile':UI.showPeer(UI.S.chat);break;
  case 'leave':UI.leaveDiscord(UI.S.dc);break;
  case 'g-invite':UI.groupInvite(UI.S.chat);break;
  case 'g-members':UI.groupMembers(UI.S.chat);break;
  case 'g-rename':UI.groupRename(UI.S.chat);break;
  case 'g-leave':UI.groupLeave(UI.S.chat);break;
  case 'open-settings':UI.S.set=true;UI.render();break;
  case 'goto-discovery':UI.screen('settings');UI.S.set=true;UI.renderNow();
   {const s=$('#secDiscovery');if(s)s.scrollIntoView({block:'start'})}break;
  case 'global-more':UI.loadGlobal(true);break;
  case 'disc-on':case 'disc-off':{
   const err=$('#discErr');err.textContent='';
   try{await M.setDiscoverable(t.dataset.act==='disc-on');UI.S.global.q=null}catch(x){err.textContent=x.message}
   break}
  case 'logout':await M.logout();break;
  case 'delete':{
   const err=$('#delErr');err.textContent='';
   try{await M.deleteAccount($('#delPass').value)}catch(x){err.textContent=x.message}
   break}}
});
document.addEventListener('keydown',e=>{
 if(e.target.id==='composer'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();UI.send()}
 if(e.key==='Escape'&&$('#overlay .scrim:not(.solid):not(.out)'))UI.close()});
let searchTimer=0;
$('#search').addEventListener('input',e=>{
 UI.S.filter=e.target.value;UI.renderCol();
 if(UI.S.screen==='peers'){clearTimeout(searchTimer);searchTimer=setTimeout(()=>UI.loadGlobal(),250)}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){UI.render();if(M.token&&M.wsState!=='live')M.connect()}});

M.on('change',()=>UI.render());
M.on('status',()=>UI.render());
M.on('message',(peer,text)=>UI.notify(peer,text));
M.on('call',()=>{UI.renderCall();UI.render()});
// closing the tab mid-call would drop it without telling the other side
window.addEventListener('beforeunload',e=>{const c=M.voice.call;if(c&&c.state!=='ringing'){e.preventDefault();e.returnValue=''}});
M.on('peer',(kind,p)=>{
 if(kind==='request')toast(p.username+' wants to be friends — see Peers',7000);
 else if(kind==='accepted')toast(p.username+' accepted your friend request',6000);
 else if(kind==='changed')toast('warning: '+p.username+' now belongs to a different identity than before',9000)});
M.on('signedout',reason=>{
 store.sset(null);Object.assign(UI.S,{chat:null,dc:null,peer:null,set:false,paneKey:'',filter:'',
  global:{q:null,users:[],more:false,loading:false,err:'',seq:UI.S.global.seq+1}});
 $('#search').value='';UI.render();
 UI.auth('login',reason||'')});

/* ---------- boot ---------- */
(async function boot(){
 document.documentElement.dataset.theme=store.get('theme')||'dark';
 const subtle=window.crypto&&crypto.subtle;
 let ok=!!subtle;
 if(ok){try{await crypto.subtle.generateKey({name:'X25519'},false,['deriveBits']);await crypto.subtle.generateKey({name:'Ed25519'},false,['sign'])}catch(e){ok=false}}
 if(!ok){
  document.body.innerHTML='<div style="font:13px/1.8 monospace;color:#ddd;background:#111;padding:40px;min-height:100vh">'+
   'Marmot needs WebCrypto with X25519 and Ed25519 — any current Chrome, Edge, Firefox or Safari.<br>'+
   'If you opened this file from disk and see this, serve it over http://localhost or open it from the Marmot server instead.</div>';
  return}
 if(ON_PAGES)$('#dlHtml').classList.remove('hidden');
 UI.renderNow();
 const s=store.sget();
 if(s&&s.token){
  try{await M.resume(s);UI.render();return}
  catch(e){store.sset(null);UI.auth('login',e.network?e.message:'session ended — sign in again');return}}
 UI.auth('login');
})();
</script>
