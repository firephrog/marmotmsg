<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marmot</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2216%22%20height%3D%2216%22%3E%3Crect%20width%3D%2216%22%20height%3D%2216%22%20fill%3D%22%23151311%22%2F%3E%3Crect%20x%3D%22.5%22%20y%3D%22.5%22%20width%3D%2215%22%20height%3D%2215%22%20fill%3D%22none%22%20stroke%3D%22%23f0a92a%22%2F%3E%3Cg%20transform%3D%22translate(1.75%201.25)%22%3E%3Cg%20transform%3D%22scale(.8)%22%3E%3Cline%20x2%3D%225.5%22%20stroke%3D%22%23f0a92a%22%20x1%3D%221.5%22%20y1%3D%2213.5%22%20y2%3D%2213.5%22%20stroke-width%3D%221.5%22%2F%3E%3Cline%20x2%3D%2214%22%20stroke%3D%22%23f0a92a%22%20y2%3D%222.5%22%20x1%3D%2214%22%20y1%3D%2214.5%22%20stroke-width%3D%222%22%2F%3E%3Cline%20x2%3D%229%22%20stroke%3D%22%23f0a92a%22%20y2%3D%222.5%22%20x1%3D%229%22%20y1%3D%2214.5%22%20stroke-width%3D%222%22%2F%3E%3Cpolyline%20fill%3D%22none%22%20stroke%3D%22%23f0be72%22%20points%3D%225.5%2014%201%2014%207%202.5%2015%202.5%22%2F%3E%3C%2Fg%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0e0d;--rail:#151311;--list:#121110;--row:#1d1a17;--bubble:#1f1c19;--panel:#1a1816;--input:#161412;--line:rgba(255,255,255,0.07);--line2:rgba(255,255,255,0.12);--text:#efece8;--muted:#a39d95;--dim:#837d75;--faint:#6f6962;--avatar:#2d2925;--avatar-fg:#d6d0c8;--accent:#f0a92a;--accent-soft:#f5c36a;--accent-ink:#2a1a02;--accent-wash:rgba(240,169,42,0.12);--ok:#6ecfa8;--ok-line:rgba(110,207,168,0.4);--warn:#e8b64c;--bad:#ff7a63}
[data-theme=light]{--bg:#f8f6f3;--rail:#efebe6;--list:#f3f0ec;--row:#e7e2dc;--bubble:#e9e4de;--panel:#ebe6e0;--input:#efebe6;--line:rgba(40,32,24,0.1);--line2:rgba(40,32,24,0.18);--text:#221d18;--muted:#5f5850;--dim:#736b62;--faint:#8b837a;--avatar:#d9d2ca;--avatar-fg:#3b352f;--accent:#a8620a;--accent-soft:#8a4e04;--accent-ink:#fff7ec;--accent-wash:rgba(168,98,10,0.1);--ok:#1f8a63;--ok-line:rgba(31,138,99,0.4);--warn:#8a6410;--bad:#c2381f}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;width:100%}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:var(--avatar) transparent}}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:var(--avatar);border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:var(--faint)}
::-webkit-scrollbar-thumb:active{background-color:var(--accent)}
::-webkit-scrollbar-button{display:none}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,'Segoe UI',sans-serif;overflow:hidden}
.mono,.lbl,.note,.chip,.time,.badge,.grouplbl,.status,.meta,.tbtn,.pill,.send,.stamp,.sys,.kv,.fp,.live,.seg button,.toast,.sn,.search,.inp,.empty{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
.app{position:fixed;inset:0;display:flex;background:var(--bg);overflow:hidden;transition:top .22s ease}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:disabled{opacity:.4;cursor:default}
.hidden{display:none!important}
/* rail */
.rail{width:210px;flex:none;display:flex;flex-direction:column;padding:20px 0 16px;background:var(--rail);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;padding:0 16px}
.logo{width:22px;height:22px;flex:none}
[data-theme=light] .logo>rect:first-child{fill:var(--accent)}
[data-theme=light] .logo>rect+rect{stroke:var(--accent)}
[data-theme=light] .logo line{stroke:var(--accent-ink)}
[data-theme=light] .logo polyline{stroke:#ffe1ad}
.brand b{font-size:17px;font-weight:700;letter-spacing:.04em}
.ver{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--accent);border:1px solid var(--accent);padding:2px 4px}
.tagline{padding:6px 16px 0;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim)}
.rule{height:1px;margin:18px 16px;background:var(--line)}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.nav button{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px 0 12px;color:var(--muted);font-size:13.5px;transition:background .15s,color .15s}
.nav button .dot{width:6px;height:6px;flex:none;border:1px solid var(--faint)}
.nav button .n{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim)}
.nav button:hover{background:var(--row);color:var(--text)}
.nav button[aria-current=page]{background:var(--accent-wash);border-left:2px solid var(--accent);padding-left:10px;color:var(--accent-soft);font-weight:500}
.nav button[aria-current=page] .dot{background:var(--accent);border-color:var(--accent)}
.spacer{flex:1}
.dl{display:block;margin:0 12px 8px;text-align:center}
.me{margin:0 12px 12px;padding:12px;background:var(--panel);border:1px solid var(--line)}
.me-top{display:flex;align-items:center;gap:8px;min-width:0}
.me-top div:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{flex:none;display:flex;align-items:center;justify-content:center;background:var(--avatar);color:var(--avatar-fg);font-family:'JetBrains Mono',monospace}
.av-26{width:26px;height:26px;font-size:11px;background:var(--accent);color:var(--accent-ink)}
.av-34{width:34px;height:34px;font-size:11px}
.av-64{width:64px;height:64px;font-size:18px}
.av{overflow:hidden}.av>img{width:100%;height:100%;object-fit:cover;display:block}
.fp{margin-top:8px;font-size:9.5px;line-height:1.6;color:var(--dim);word-break:break-all}
.live{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:9.5px;color:var(--ok)}
.live i{width:5px;height:5px;background:currentColor}
.live.off{color:var(--faint)}.live.warn{color:var(--warn)}
.seg{display:flex;gap:1px;margin:0 12px;border:1px solid var(--line2)}
.seg button{flex:1;text-align:center;padding:7px 0;font-size:10px;color:var(--dim);transition:background .2s,color .2s}
.seg button[aria-pressed=true]{background:var(--row);color:var(--text)}
/* list column */
.col{width:340px;flex:none;display:flex;flex-direction:column;background:var(--list);border-right:1px solid var(--line)}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 14px}
.col-head h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em}
.pill{font-size:10px;color:var(--accent-soft);border:1px solid var(--accent);padding:5px 9px}
.pill{transition:background .15s}
.pill:hover{background:var(--accent-wash)}
.search{margin:0 14px 12px;padding:9px 10px;width:calc(100% - 28px);background:var(--input);border:1px solid var(--line);color:var(--text);font-size:11px;transition:border-color .15s}
.search::placeholder,.inp::placeholder{color:var(--faint)}
.search:focus,.inp:focus{outline:none;border-color:var(--accent)}
.rows{flex:1;display:flex;flex-direction:column;overflow-y:auto}
.row{display:flex;gap:11px;align-items:center;padding:12px 16px 12px 18px;width:100%;transition:background .15s,border-color .15s,padding .15s}
.row:hover{background:var(--row)}
.row[aria-current=true]{background:var(--row);border-left:2px solid var(--accent);padding-left:16px}
.row-main{flex:1;min-width:0}
.row-top{display:flex;align-items:center;gap:6px}
.row-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{margin-top:3px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:9px;color:var(--dim);border:1px solid var(--line2);padding:1px 4px;white-space:nowrap}
.chip.ok{color:var(--ok);border-color:var(--ok-line)}
.row-right{flex:none;text-align:right}
.time{font-size:9.5px;color:var(--dim)}
.badge{margin-top:5px;min-width:18px;padding:1px 4px;background:var(--accent);color:var(--accent-ink);font-size:9.5px;text-align:center}
.grouplbl{padding:14px 18px 10px;font-size:9px;letter-spacing:.12em;color:var(--faint);line-height:1.8}
.status{display:flex;align-items:center;gap:8px;padding:11px 16px;border-top:1px solid var(--line);font-size:9.5px;color:var(--dim)}
.status i{width:5px;height:5px;flex:none;background:var(--ok)}
.status i.bad{background:var(--bad)}.status i.idle{background:var(--faint)}
/* main pane */
.pane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.pane-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);min-height:65px}
.pane-title{font-size:15px;font-weight:600}
.meta{margin-top:3px;font-size:9.5px;color:var(--dim)}
.acts{margin-left:auto;display:flex;align-items:center;gap:6px}
.tbtn{padding:7px 10px;border:1px solid var(--line2);font-size:10px;color:var(--muted);white-space:nowrap;transition:border-color .15s,color .15s,background .15s}
.tbtn:hover{border-color:var(--accent);color:var(--accent-soft)}
.tbtn.danger:hover{border-color:var(--bad);color:var(--bad)}
.thread{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;padding:20px 22px;overflow-y:auto;overflow-anchor:none}
.day{display:flex;align-items:center;gap:12px}
.day span{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;color:var(--faint)}
.day i{flex:1;height:1px;background:var(--line)}
.msg{max-width:68%}
.msg.in{align-self:flex-start}
.msg.out{align-self:flex-end}
.msg .body{padding:10px 13px;background:var(--bubble);font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;transition:opacity .2s,background .2s,color .2s}
.msg.out .body{background:var(--accent);color:var(--accent-ink)}
.msg.sending .body{opacity:.65}
.msg.failed .body{background:var(--bubble);color:var(--muted);border:1px dashed var(--bad)}
.stamp{margin-top:5px;font-size:9.5px;color:var(--faint)}
.msg.out .stamp{text-align:right}
.stamp button{color:var(--bad);text-decoration:underline}
.sys{align-self:center;max-width:80%;text-align:center;font-size:9.5px;line-height:1.7;color:var(--faint)}
.composer{margin:0 18px 18px;border:1px solid var(--line2);background:var(--input);transition:border-color .15s}
.composer:focus-within{border-color:var(--accent)}
.composer textarea{display:block;width:100%;height:48px;max-height:180px;padding:13px 14px;background:none;border:0;resize:none;color:var(--text);font:400 14px/1.4 'Space Grotesk',system-ui,sans-serif}
.composer textarea:focus{outline:none}
.composer textarea::placeholder{color:var(--faint)}
.composer-bar{display:flex;align-items:center;gap:10px;padding:0 10px 10px}
.composer{position:relative}
.cbtn{width:30px;height:30px;display:grid;place-items:center;color:var(--dim);transition:color .12s,background .12s}
.cbtn:hover,.cbtn[aria-expanded=true]{color:var(--text);background:var(--row)}
.cbtn svg{width:17px;height:17px}
.composer-bar .cbtn+.cbtn{margin-left:-6px}
/* an image waiting to be sent, above the composer */
.attbar{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;background:var(--accent-wash);border-bottom:1px solid var(--line);animation:replyIn .18s ease both}
.attbar img{width:44px;height:44px;object-fit:cover;display:block;flex:none}
.attbar .grow{flex:1;min-width:0}
.attbar .lbl{margin:0;color:var(--accent-soft)}
.attbar button{width:26px;height:26px;display:grid;place-items:center;color:var(--dim)}
.attbar button:hover{color:var(--text);background:var(--row)}
.attbar svg{width:15px;height:15px}
/* images in messages, and the full-size view */
.msg .body.has-img{padding:4px}
.mimg{display:block;max-width:100%;cursor:zoom-in}
.mimg img{display:block;max-width:100%;height:auto;background:var(--panel)}
.body .cap{padding:6px 9px 5px}
.modal:has(.lightbox){width:auto;max-width:min(94vw,1100px)}
.lightbox{display:block;max-width:100%;max-height:72vh;margin:0 auto}
/* the emoji browser */
.emojipop{position:absolute;left:-1px;bottom:calc(100% + 8px);z-index:20;width:min(352px,calc(100vw - 24px));height:340px;display:flex;flex-direction:column;background:var(--rail);border:1px solid var(--line2);box-shadow:0 18px 44px rgba(0,0,0,.34);animation:replyIn .16s ease both}
.emojipop .search{margin:8px 8px 6px;width:auto}
.emojipop.react{position:fixed;left:0;top:0;bottom:auto;z-index:40}
.acpop .emo{width:26px;text-align:center;font-size:19px;line-height:1;flex:none}
/* reactions under a bubble */
.reacts{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.reacts.indent{padding-left:36px}
.msg.out .reacts{justify-content:flex-end}
.rx{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;background:var(--panel);border:1px solid var(--line2);font-size:14px;line-height:1;transition:background .12s,border-color .12s;animation:replyIn .16s ease both}
.rx span{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-size:10.5px;color:var(--muted)}
.rx:not(:disabled):hover{background:var(--row);border-color:var(--accent)}
.rx.mine{background:var(--accent-wash);border-color:var(--accent)}
.rx.mine span{color:var(--accent-soft)}
.rx:disabled{cursor:default}
.etabs{display:flex;gap:2px;padding:0 6px 6px;border-bottom:1px solid var(--line)}
.etabs button{flex:1;height:30px;font-size:16px;filter:grayscale(1);opacity:.6;transition:opacity .12s,filter .12s,background .12s}
.etabs button:hover,.etabs button[aria-pressed=true]{filter:none;opacity:1;background:var(--row)}
.egrid{flex:1;overflow-y:auto;padding:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));align-content:start;gap:2px}
.egrid button{height:36px;font-size:22px;line-height:1;transition:background .1s,transform .1s}
.egrid button:hover,.egrid button:focus-visible{background:var(--row);transform:scale(1.12);outline:none}
.egrid .grouplbl{grid-column:1/-1;padding:6px 2px 2px}
.hint{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint)}
.hint.warn{color:var(--warn)}
.ping{color:var(--accent);font-weight:600}
.msg.out .body .ping{color:inherit;text-decoration:underline}
.ping.me{display:inline;width:auto;margin:0;border:0;background:var(--accent);color:var(--accent-ink);padding:0 3px}
.msg.out .body .ping.me{background:var(--accent-ink);color:var(--accent);text-decoration:none}
.msg.pinged .body{box-shadow:inset 3px 0 0 var(--accent)}
.badge.at{background:var(--warn)}
.acpop{position:absolute;left:-1px;bottom:calc(100% + 8px);z-index:21;width:min(340px,calc(100vw - 24px));max-height:300px;overflow-y:auto;display:flex;flex-direction:column;padding:4px;background:var(--rail);border:1px solid var(--line2);box-shadow:0 18px 44px rgba(0,0,0,.34);animation:replyIn .14s ease both}
.acpop button{display:flex;align-items:center;gap:10px;padding:6px 8px;text-align:left;font-size:13px;min-width:0}
.acpop button[aria-selected=true]{background:var(--row)}
.acpop .d{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acpop .grouplbl{padding:4px 6px 2px}
.poll{margin-top:8px;display:flex;flex-direction:column;gap:5px;min-width:220px;white-space:normal}
.poll .pq{font-weight:600}
.popt{position:relative;display:flex;align-items:center;gap:8px;padding:6px 9px;border:1px solid color-mix(in srgb,currentColor 35%,transparent);color:inherit;text-align:left;overflow:hidden}
.popt:not([disabled]):hover,.popt.mine{border-color:currentColor}
.popt.mine,.popt.won{font-weight:600}
.popt .bar{position:absolute;left:0;top:0;bottom:0;background:currentColor;opacity:.16;transition:width .3s}
.popt .ot{position:relative;flex:1;overflow-wrap:anywhere}
.popt .oc{position:relative;font-family:'JetBrains Mono',monospace;font-size:11px}
.poll .pf{font-family:'JetBrains Mono',monospace;font-size:10px;opacity:.7}
.cmdhelp{font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.7;color:var(--muted)}
.cmdhelp b{color:var(--text);font-weight:500}
select.inp{cursor:pointer}
.perm{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:12px;border-bottom:1px solid var(--line);max-width:640px;cursor:pointer}
.perm input{flex:none}
.perm .chip{margin-left:auto}
.logrow{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:11px;max-width:760px}
.logrow b{flex:none;width:150px;font-weight:400;color:var(--faint);font-family:'JetBrains Mono',monospace;font-size:10px}
.logrow span{color:var(--muted);word-break:break-word}
.send{padding:7px 14px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:500;transition:filter .15s,background .15s,opacity .15s}
.send:hover{filter:brightness(1.08)}
.empty{flex:1;display:grid;place-items:center;font-size:11px;color:var(--faint);text-align:center;line-height:2;padding:20px}
/* settings */
.sheet{flex:1;overflow-y:auto;padding:20px 22px 26px}
.sec{margin-bottom:28px}
.sec h3{margin:0 0 4px;font-size:14px;font-weight:600}
.note{font-size:9.5px;line-height:1.7;color:var(--dim);margin-bottom:14px;max-width:64ch}
.field{margin-bottom:14px}
.lbl{font-size:9px;letter-spacing:.12em;color:var(--faint);margin-bottom:6px}
.inp{width:100%;padding:9px 10px;background:var(--input);border:1px solid var(--line2);color:var(--text);font-size:11px;transition:border-color .15s}
.btnrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.kv{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:10px;max-width:640px}
.kv b{flex:none;width:150px;font-weight:400;color:var(--faint)}
.kv span{color:var(--muted);word-break:break-all}
.err{color:var(--bad);font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.6;min-height:16px;margin-top:8px}
/* overlays */
.scrim{position:fixed;inset:0;background:rgba(10,9,8,.62);display:grid;place-items:center;z-index:20;padding:16px;animation:fade .2s ease both}
.scrim.solid{background:var(--bg)}
.scrim.top{z-index:50}
.pnotes{margin-top:12px;max-height:46vh;overflow-y:auto}
.pnote+.pnote{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.pnote-v{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);margin-bottom:6px}
.pnote .lbl{margin-top:8px}
.pnote ol{margin:4px 0 0;padding-left:22px;font-size:13px;line-height:1.5}
.modal{width:440px;max-width:100%;max-height:90vh;overflow-y:auto;background:var(--rail);border:1px solid var(--line2);padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:lift .28s cubic-bezier(.2,.85,.25,1) both}
.modal h3{margin:0 0 4px;font-size:16px;font-weight:600}
.modal-foot{display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.modal-foot .grow{flex:1}
.auth-seg{display:flex;border:1px solid var(--line2);margin:16px 0}
.auth-seg button{flex:1;text-align:center;padding:9px 0;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;color:var(--dim);transition:background .2s,color .2s}
.auth-seg button[aria-pressed=true]{background:var(--accent-wash);color:var(--accent-soft)}
.toasts{position:fixed;left:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:40;max-width:380px}
.toast{padding:10px 12px;background:var(--panel);border:1px solid var(--line2);border-left:2px solid var(--accent);font-size:10px;line-height:1.6;color:var(--muted);animation:slide .25s ease}
.sn{font-size:14px;line-height:2;letter-spacing:.08em;color:var(--text);background:var(--input);border:1px solid var(--line2);padding:12px;text-align:center;word-spacing:.4em}
.back{display:none}
/* peers */
.chip.warn{color:var(--warn);border-color:var(--warn)}
.chip.bad{color:var(--bad);border-color:var(--bad)}
.chip.dc{color:var(--muted);border-color:var(--line2)}
.who{margin-bottom:4px;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--muted)}
.who i{font-style:normal;color:var(--faint)}
.plain{align-self:center;max-width:80%;text-align:center;font-family:'JetBrains Mono',monospace;font-size:9.5px;line-height:1.7;color:var(--warn)}
.grouplbl.note2{padding-top:4px;letter-spacing:.06em}
.more{margin:4px 18px 10px;align-self:flex-start}
.gate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 18px 18px;padding:12px 14px;border:1px dashed var(--line2);font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)}
.gate .grow{flex:1;min-width:160px;line-height:1.6}
.tbtn[aria-pressed=true]{border-color:var(--accent);color:var(--accent-soft);background:var(--accent-wash)}
/* group chats */
.av.grp{font-size:10px;box-shadow:inset 0 0 0 1px var(--accent)}
.pick.off{cursor:default;opacity:.55}
.pick .pstate{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim)}
.picks{max-height:260px;overflow-y:auto;border:1px solid var(--line2);background:var(--input)}
.pick{display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}
.pick:last-child{border-bottom:0}
.pick:hover{background:var(--row)}
.pick input{accent-color:var(--accent);margin:0;flex:none}
.pick .row-main{font-weight:500}
.pick .chip{margin-left:auto}
.picks .grouplbl{padding:12px 10px}
/* group control panel and tags */
.modal.wide{width:580px}
.gp-tabs{margin:14px 0 12px}
.gp-row{display:flex;align-items:center;gap:10px;padding:9px 10px;font-size:13px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.gp-row:last-child{border-bottom:0}
.gp-row .row-main{flex:1;min-width:140px;font-weight:500}
.gp-row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.gp-row .acts .tbtn{padding:4px 7px;font-size:9px}
.gp-durs{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;padding-top:2px}
.gp-durs .tbtn{padding:4px 7px;font-size:9px}
.gp-reason{flex-basis:100%;margin-left:36px;font-size:12.5px;line-height:1.5;color:var(--text);white-space:pre-wrap;word-break:break-word}
.gp-sec{margin-top:14px}
.gp-sec:first-child{margin-top:0}
.gp-sec .lbl{margin-bottom:6px}
.gp-sec .auth-seg{margin:0 0 8px}
.gp-sec .auth-seg button:disabled{cursor:default;opacity:.55}
.gp-sec .note{margin:6px 0 0}
.chip.own{color:var(--accent-soft);border-color:var(--accent)}
.gtag{display:inline-flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.06em;color:var(--accent-soft);border:1px solid var(--accent);background:var(--accent-wash);padding:2px 6px;margin-top:8px;cursor:pointer}
.gtag:hover{filter:brightness(1.15)}
.pcard.mini .gtag{cursor:default}
.gp-emo{margin:0 0 8px;border:1px solid var(--line2);background:var(--rail)}
.gp-emo .search{margin:8px 8px 4px;width:calc(100% - 16px)}
.gp-emo .egrid{max-height:190px}
.gp-tagrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.gp-tagrow .inp{max-width:140px;text-transform:uppercase}
.gp-emobtn{width:38px;height:34px;font-size:20px;line-height:1;border:1px solid var(--line2);background:var(--rail)}
.gp-emobtn[aria-pressed=true]{border-color:var(--accent)}
.gp-emobtn:disabled{opacity:.55;cursor:default}
.badge-n{display:inline-block;min-width:14px;padding:0 4px;margin-left:5px;font-size:9px;line-height:14px;text-align:center;background:var(--accent);color:var(--bg,#000)}
/* replies and deletes */
.msg{position:relative;outline:none}
.bub{position:relative}
.bub.has-re{min-width:min(240px,60vw)}
.macts{position:absolute;top:-17px;z-index:2;display:flex;gap:2px;padding:3px;background:var(--rail);border:1px solid var(--line2);box-shadow:0 8px 22px rgba(0,0,0,.32);opacity:0;transform:translateY(4px) scale(.96);pointer-events:none;transition:opacity .14s ease,transform .14s ease}
.msg.out .macts{right:8px;transform-origin:right bottom}.msg.in .macts{left:8px;transform-origin:left bottom}
.msg:hover .macts,.msg:focus-within .macts{opacity:1;transform:none;pointer-events:auto}
.macts button{width:30px;height:26px;display:grid;place-items:center;color:var(--muted);transition:background .12s,color .12s}
.macts button:hover,.macts button:focus-visible{background:var(--accent-wash);color:var(--accent-soft);outline:none}
.macts button.del:hover,.macts button.del:focus-visible{background:rgba(255,122,99,.12);color:var(--bad)}
.macts svg,.replybar svg{width:15px;height:15px;flex:none}
.quote{display:flex;flex-direction:column;gap:2px;width:100%;min-width:0;padding:7px 11px 7px 10px;background:var(--panel);border-left:2px solid var(--accent);font-size:12.5px;line-height:1.4;color:var(--muted);text-align:left;transition:background .15s}
.msg .quote{width:0;min-width:100%;margin-bottom:2px}
button.quote:hover{background:var(--row)}
.quote b{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-size:9.5px;font-weight:500;letter-spacing:.04em;color:var(--accent-soft)}
.quote span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quote span.gone,.msg.gone .body{font-style:italic;color:var(--faint)}
.msg .body.veil{display:block;width:100%;text-align:left;font-style:italic;cursor:pointer}
.msg .body.unveiled{outline:1px dotted var(--muted);outline-offset:2px;cursor:pointer}
.msg .body.unveiled:hover{outline-color:var(--accent)}
.msg .body.veil:hover{color:var(--muted);border-color:var(--accent)}
.msg.gone .body,.msg.out.gone .body,.msg .body.veil{background:none;color:var(--faint);border:1px dashed var(--line2);font-size:13px}
.msg.replying .body{outline:1px solid var(--accent);outline-offset:3px}
.replybar{display:flex;align-items:center;gap:10px;padding:9px 8px 9px 12px;background:var(--accent-wash);border-bottom:1px solid var(--line);box-shadow:inset 2px 0 0 var(--accent);animation:replyIn .18s ease both}
.replybar>svg{color:var(--accent)}
.replybar .grow{flex:1;min-width:0}
.replybar .lbl{margin:0 0 3px;color:var(--accent-soft)}
.replybar .rtext{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.replybar button{width:26px;height:26px;display:grid;place-items:center;color:var(--dim);transition:color .12s,background .12s}
.replybar button:hover{color:var(--text);background:var(--row)}
@keyframes replyIn{from{opacity:0;transform:translateY(4px)}}
@media (hover:none){.macts button{width:36px;height:32px}.macts{top:-22px}}
.tabs{display:none}
.tabs button{flex:1;padding:11px 0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;color:var(--dim)}
.tabs button[aria-current=page]{color:var(--accent-soft);box-shadow:inset 0 2px 0 var(--accent)}
.tabs .n{margin-left:4px;color:var(--accent)}
/* voice */
/* while a call is up the whole app moves down and the bar sits above it, so it covers nothing */
.app.with-call{top:58px}
.callbar{position:fixed;top:0;left:0;right:0;height:58px;z-index:30;display:flex;align-items:center;gap:10px;padding:0 16px 0 18px;background:var(--rail);border-bottom:1px solid var(--line2);box-shadow:inset 3px 0 0 var(--accent);animation:drop .22s ease both}
.callbar.ringing{box-shadow:inset 3px 0 0 var(--ok);background:linear-gradient(90deg,var(--accent-wash),transparent 60%),var(--rail)}
.callbar.ringing .av{animation:pulse 1.4s ease-in-out infinite}
.callbar .grow{flex:1;min-width:0}
.callbar .pane-title{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.callbar .who-btn{display:block;max-width:100%}
.callbar .meta{font-variant-numeric:tabular-nums}
.callbar .meta.warn{color:var(--warn)}
/* the buttons keep their size; on a narrow screen the row scrolls sideways rather than squashing the name */
.cacts{flex:none;display:flex;align-items:center;gap:8px;max-width:72%;overflow-x:auto;scrollbar-width:none}
.cacts::-webkit-scrollbar{display:none}
.cacts>button{flex:none}
.send.ok{background:var(--ok)}
.hang{padding:7px 12px;background:var(--bad);color:#fff;font-size:10px;font-weight:500;font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
.hang{transition:filter .15s}
.hang:hover{filter:brightness(1.08)}
.callbar.out{animation:rise .18s ease both;pointer-events:none}
/* the call window: a tile for everyone in the call, the camera if it is on and their picture if not,
   a screen share as a tile of its own. A grid of equals, or, with a tile picked (or a screen shared),
   that one large over a row of the rest. Floating under the call bar, or the whole window below it */
.stage{position:fixed;top:70px;right:16px;width:min(520px,calc(100vw - 32px));aspect-ratio:16/10;z-index:29;background:#0b0a09;border:1px solid var(--line2);box-shadow:0 12px 32px rgba(0,0,0,.45);overflow:hidden;animation:drop .22s ease both}
.stage[hidden]{display:none}
.stage.big{top:58px;left:0;right:0;bottom:0;width:auto;aspect-ratio:auto;border:0;box-shadow:none}
.tiles{position:absolute;inset:0;display:grid;gap:4px;padding:4px;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}
.tiles.focus{grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));grid-template-rows:minmax(0,1fr) var(--strip,22%);grid-auto-rows:0}
.tiles.focus .tile.main{grid-column:1/-1;grid-row:1}
.tile{position:relative;display:block;padding:0;min-width:0;min-height:0;background:#1a1816;overflow:hidden;outline:2px solid transparent;outline-offset:-2px;transition:outline-color .15s,opacity .2s}
.tile:hover{outline-color:var(--accent)}
.tile.main:hover{outline-color:transparent}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#000}
.tile.cam video{display:block}
.tile.screen video,.tile.main video{object-fit:contain}
.tile.mine:not(.screen) video{transform:scaleX(-1)}
.tile .tav{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.tile.cam .tav{display:none}
.tile .tav .av{width:min(96px,42%);height:auto;aspect-ratio:1;font-size:clamp(12px,3.2vw,26px);border-radius:0}
.tile.wait{opacity:.55}
.tile.wait .tav .av{animation:pulse 1.4s ease-in-out infinite}
.tile .tag{position:absolute;left:6px;bottom:6px;max-width:calc(100% - 12px);display:flex;align-items:center;gap:4px;padding:2px 6px;background:rgba(0,0,0,.62);color:#fff;font:10px 'JetBrains Mono',ui-monospace,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tag span{overflow:hidden;text-overflow:ellipsis}
.tile .tag svg{flex:none;width:12px;height:12px;color:var(--bad)}
.tile .tst{position:absolute;right:6px;top:6px;padding:2px 6px;background:rgba(0,0,0,.62);color:#fff;font:9px 'JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.04em}
.tile .tst:empty{display:none}
.tile .tst.warn{color:var(--warn)}
.tiles.focus .tile:not(.main) .tag{font-size:9px;left:3px;bottom:3px}
.tiles.focus .tile:not(.main) .tst{display:none}
.stage-ctl{position:absolute;top:8px;right:8px;z-index:2;display:flex;gap:6px;opacity:0;transition:opacity .15s}
.stage:hover .stage-ctl,.stage:focus-within .stage-ctl{opacity:1}
.stage-ctl .tbtn{background:rgba(0,0,0,.6);color:#fff;border-color:rgba(255,255,255,.25)}
@media (hover:none){.stage-ctl{opacity:1}}
.scrim.out{animation:fadeout .18s ease both;pointer-events:none}
.scrim.out .modal{animation:sink .18s ease both}
.toast.out{animation:slideout .25s ease both}
/* entering a pane, a column or a message: only when it changes, never on a plain re-render */
.pane.enter{animation:paneIn .24s cubic-bezier(.2,.85,.25,1) both}
.rows.enter{animation:rowsIn .22s ease both}
.msg.new{animation:msgIn .26s cubic-bezier(.2,.85,.25,1) both}
.msg.in.new{transform-origin:left bottom}.msg.out.new{transform-origin:right bottom}
/* the sender's picture beside a bubble; only the last of a run shows it, the rest keep its space */
.mrow{display:flex;align-items:flex-end;gap:8px}
.msg.out .mrow{flex-direction:row-reverse}
.mrow>.bub{min-width:0}
.mrow>.bub.has-re{min-width:min(240px,60vw)}
.mav{width:28px;height:28px;font-size:10px}
.mav.ghost{visibility:hidden}
.msg.in .mrow~.stamp,.msg.in>.who{margin-left:36px}
.msg.out .mrow~.stamp{margin-right:36px}
/* a run of messages from one sender sits as one group: tight together, the name on the first,
   the time on the last (a failed one keeps its stamp for retry / discard) */
.msg.cont{margin-top:-9px}
.msg.mid:not(.failed)>.stamp{display:none}
.sys.new{animation:fade .3s ease both}
.sys.held{position:sticky;bottom:0;max-width:none;animation:fade .2s ease both}
.sys.held button{padding:6px 14px;background:var(--panel);border:1px solid var(--line2);border-left:2px solid var(--accent);color:var(--muted);font:inherit;letter-spacing:.06em;box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer}
.sys.held button:hover{color:var(--accent)}
/* theme switch: everything eases between palettes for a moment */
.theme-fade,.theme-fade *,.theme-fade *::before,.theme-fade *::after{transition:background-color .3s ease,color .3s ease,border-color .3s ease,box-shadow .3s ease!important}
/* image theme: a picture behind everything (blurred, darkened or lightened), the palette drawn
   from it (set inline on <html> by Theme), and the big surfaces see-through so it shows */
#bgImg,#bgTint{position:fixed;inset:0;display:none;pointer-events:none}
#bgImg{background:center/cover no-repeat}
.imgtheme #bgImg,.imgtheme #bgTint{display:block}
.imgtheme body,.imgtheme .app{background:transparent}
.imgtheme .pane{background:var(--glass-bg)}
.imgtheme .rail{background:var(--glass-rail)}
.imgtheme .col{background:var(--glass-list)}
.bgpal{display:flex;max-width:420px;height:34px;border:1px solid var(--line2)}
.bgpal i{flex:1 1 0;min-width:10px}
.bgpal.none{background:repeating-linear-gradient(45deg,var(--input) 0 4px,var(--row) 4px 8px)}
.range{display:block;width:100%;max-width:360px;margin:0;accent-color:var(--accent)}
.range:disabled{opacity:.4}
.lbl .rv{float:right;color:var(--muted)}
.rng{max-width:360px}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
@keyframes rise{to{opacity:0;transform:translateY(-8px)}}
@keyframes fadeout{to{opacity:0}}
@keyframes sink{to{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes slideout{to{opacity:0;transform:translateX(-14px)}}
@keyframes paneIn{from{opacity:0;transform:translateY(6px)}}
@keyframes paneSide{from{opacity:0;transform:translateX(24px)}}
@keyframes rowsIn{from{opacity:0;transform:translateY(4px)}}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.97)}}
@keyframes pulse{50%{box-shadow:0 0 0 5px var(--accent-wash)}}
@keyframes fade{from{opacity:0}}
@keyframes lift{from{opacity:0;transform:translateY(12px) scale(.98)}}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
/* presence: a square in the corner of a picture, in the color of what others see */
.av{position:relative}
.pdot{position:absolute;right:0;bottom:0;width:32%;height:32%;min-width:7px;min-height:7px;max-width:14px;max-height:14px;background:var(--faint);box-shadow:0 0 0 2px var(--ring,var(--list))}
.pdot.online,.pi.online{background:var(--ok)}.pdot.idle,.pi.idle{background:var(--warn)}.pdot.dnd,.pi.dnd{background:var(--bad)}
.pdot.dnd::after,.pi.dnd::after{content:'';position:absolute;left:22%;right:22%;top:calc(50% - 1px);height:2px;background:var(--ring,var(--list))}
.pdot.offline,.pdot.invisible{background:var(--ring,var(--list));box-shadow:inset 0 0 0 2px var(--faint),0 0 0 2px var(--ring,var(--list))}
.pi{position:relative;display:inline-block;width:8px;height:8px;flex:none;background:var(--faint);--ring:var(--panel)}
.pi.offline,.pi.invisible{background:none;box-shadow:inset 0 0 0 2px var(--faint)}
.tbtn .pi{margin-right:4px;vertical-align:-1px;--ring:var(--bg)}
.row:hover,.row[aria-current=true]{--ring:var(--row)}
.pane-head{--ring:var(--bg)}.modal,.acpop,.side{--ring:var(--rail)}.me,.pcard{--ring:var(--panel)}
.live.bad{color:var(--bad)}
.live span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* the account box in the rail opens your profile */
.me{display:block;width:calc(100% - 24px);transition:border-color .15s}
.me:hover{border-color:var(--accent)}
.me .fp{display:block}
[data-pf]{cursor:pointer}
.who .pf:hover,.pane-title[data-pf]:hover{text-decoration:underline}
.av-80{width:80px;height:80px;font-size:22px}
/* a profile card: the accent banner, then picture, names, presence, status and bio */
.pcard{position:relative;background:var(--panel);border:1px solid var(--line2);overflow:hidden;text-align:left}
.pcard .banner{height:62px;background:var(--pacc,var(--row));border-bottom:1px solid var(--line)}
.pcard.mini .banner{height:48px}
.pc-top{display:flex;align-items:flex-end;padding:0 14px;margin-top:-34px}
.pcard.mini .pc-top{margin-top:-28px}
.pc-top .av{box-sizing:content-box;border:3px solid var(--panel)}
.pc-body{padding:10px 14px 14px}
.pc-name{font-size:17px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.pc-user{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:3px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);overflow-wrap:anywhere}
.pc-user .chip{font-size:8.5px}
.chip.stag{color:var(--stag);border-color:var(--stag);background:color-mix(in srgb,var(--stag) 12%,transparent)}
.pc-pres{display:flex;align-items:center;gap:7px;margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim)}
.pc-status{margin-top:6px;font-size:13px;line-height:1.45;color:var(--text);overflow-wrap:anywhere}
.pc-sec{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.pc-sec .lbl{margin-bottom:5px}
.pc-bio{font-size:13px;line-height:1.5;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.pcard.mini .pc-bio{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.pc-hint{margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.08em;color:var(--faint)}
/* the mini profile that hovering a picture brings up */
.hovercard{position:fixed;z-index:35;width:290px;max-width:calc(100vw - 16px);box-shadow:0 18px 44px rgba(0,0,0,.4)}
.hovercard[hidden]{display:none}
.hovercard:not([hidden]){animation:replyIn .14s ease both}
.hovercard .pcard{border-color:var(--line2)}
.hovercard:hover .pc-hint{color:var(--accent-soft)}
/* someone's full profile, on the right of the conversation */
.side{width:330px;flex:none;display:flex;flex-direction:column;min-height:0;background:var(--rail);border-left:1px solid var(--line);animation:sideIn .24s cubic-bezier(.2,.85,.25,1) both}
.side-head{display:flex;align-items:center;gap:8px;min-height:65px;padding:0 12px 0 18px;border-bottom:1px solid var(--line)}
.side-head .lbl{flex:1;margin:0}
.side-body{flex:1;overflow-y:auto;padding:16px}
.pc-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.pc-acts>:first-child{flex:1;text-align:center}
.pc-acts .tbtn,.pc-acts .send{padding:8px 12px}
.pc-kv{display:flex;gap:10px;padding:5px 0;font-family:'JetBrains Mono',monospace;font-size:10px}
.pc-kv b{flex:none;width:92px;font-weight:400;color:var(--faint)}
.pc-kv span{min-width:0;color:var(--muted);overflow-wrap:anywhere}
.pc-kv span.mono{font-size:9px;color:var(--dim)}
.pc-foot{display:flex;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.pc-foot .tbtn{flex:1;text-align:center;padding:7px 8px;font-size:9.5px;color:var(--dim)}
@keyframes sideIn{from{opacity:0;transform:translateX(18px)}}
/* settings → profile: the form, with a live preview of the card beside it */
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start;max-width:1000px}
.pgrid .preview{position:sticky;top:0}
.pgrid .preview .lbl{margin-bottom:8px}
textarea.inp{display:block;resize:vertical;min-height:88px;font:400 13px/1.5 'Space Grotesk',system-ui,sans-serif}

.swatches{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.sw{width:28px;height:28px;background:var(--c);border:1px solid var(--line2);transition:transform .12s,box-shadow .12s}
.sw:hover{transform:scale(1.08)}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}
.sw.none{background:repeating-linear-gradient(45deg,var(--input) 0 4px,var(--row) 4px 8px)}
.sw-custom{display:inline-flex;align-items:center;gap:8px;padding:4px 6px 4px 10px}
.sw-custom input{width:26px;height:20px;padding:0;border:0;background:none;cursor:pointer}
.hint.dirty{margin-left:0;color:var(--warn)}
@media (max-width:1180px){.side{position:absolute;top:0;right:0;bottom:0;z-index:15;box-shadow:-18px 0 44px rgba(0,0,0,.32)}}
@media (max-width:1100px){.pgrid{grid-template-columns:minmax(0,1fr)}.pgrid .preview{position:static;order:-1;max-width:340px}}
/* servers: a narrow list of servers, then the open server's channels beside its chat and members */
.app.srv-col .col{width:236px}
.av.stile{background:var(--row);color:var(--text);border:1px solid var(--line2);font-weight:600}
.av.stile svg{width:15px;height:15px}
.srow[aria-current=true] .av.stile{border-color:var(--accent);color:var(--accent-soft)}
.sdot{display:inline-block;width:7px;height:7px;background:var(--accent)}
.srv{flex:1;min-height:0;display:flex}
.chans{width:224px;flex:none;display:flex;flex-direction:column;min-height:0;background:var(--list);border-right:1px solid var(--line)}
.chans-head{display:flex;align-items:center;gap:8px;min-height:65px;padding:0 10px 0 16px;border-bottom:1px solid var(--line)}
.chans-head .grow{flex:1;min-width:0}
.chans-head .pane-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chans-head .tbtn{padding:6px 8px;font-size:9px}
.chans-list{flex:1;overflow-y:auto;padding:4px 0 10px}
.chans .grouplbl{padding:14px 16px 6px}
.ch{display:flex;align-items:center;gap:8px;width:100%;min-height:32px;padding:6px 12px 6px 16px;font-size:13.5px;color:var(--muted);transition:background .15s,color .15s}
button.ch:hover{background:var(--row);color:var(--text)}
.ch[aria-current=true]{background:var(--row);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.ch.live{color:var(--ok)}
.ch .cn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch.unread{color:var(--text);font-weight:600}
.ch.unread .cn::after{content:'';display:inline-block;width:6px;height:6px;margin-left:7px;vertical-align:2px;background:var(--accent)}
.ch.locked{opacity:.5}
.ch .badge{margin:0}
.ci{width:14px;flex:none;display:inline-grid;place-items:center;font-family:'JetBrains Mono',monospace;color:var(--faint)}
.ci svg{width:14px;height:14px}
.ch .vn{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--dim)}
.vusers{display:flex;flex-direction:column;gap:3px;padding:2px 10px 8px 38px}
.vu{display:flex;align-items:center;gap:7px;min-width:0;font-size:12px;color:var(--muted)}
.vu span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vu i{margin-left:auto;font-style:normal;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--faint)}
.vu .av{width:20px;height:20px;font-size:8px}
.chans-foot{border-top:1px solid var(--line);padding:10px 10px 10px 14px}
.vnow{display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--ok)}
.vnow>i{width:6px;height:6px;flex:none;background:currentColor}
.vnow .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vnow .tbtn,.vnow .hang{padding:5px 7px;font-size:9px}
.vnow.vmedia{margin-top:6px}.vnow.vmedia .tbtn{flex:1}
.schat{flex:1;min-width:0;display:flex;flex-direction:column}
.sbody{flex:1;min-height:0;display:flex}
.scol{flex:1;min-width:0;display:flex;flex-direction:column}

.sbody.mem .smembers{display:block}
.smembers .grouplbl{padding:14px 14px 6px}
.sm{display:flex;align-items:center;gap:9px;width:100%;padding:6px 14px;font-size:13px;transition:background .15s}
.sm:hover{background:var(--row)}
.sm .row-main{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.rolechip{color:var(--rc);border-color:var(--rc)}
.modal.wide{width:640px}
.ss-tabs{display:flex;flex-wrap:wrap;border:1px solid var(--line2);margin:14px 0}
.ss-tabs button{flex:1;padding:8px 6px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.06em;color:var(--dim);transition:background .2s,color .2s}
.ss-tabs button[aria-pressed=true]{background:var(--accent-wash);color:var(--accent-soft)}
.ss-list{border:1px solid var(--line2);background:var(--input);max-height:300px;overflow-y:auto}
.ss-list .row-sub{font-size:11.5px}
.perm{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.perm:last-child{border-bottom:0}
.perm input{accent-color:var(--accent);margin:3px 0 0;flex:none}
.perm small{display:block;margin-top:2px;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--dim)}
.perm.off{opacity:.5;cursor:default}
.rsw{width:12px;height:12px;flex:none;background:var(--rc)}
.code{font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.14em;color:var(--accent-soft);padding:12px;margin-bottom:8px;border:1px dashed var(--accent);text-align:center;user-select:all}
.code.long{font-size:14px;letter-spacing:.05em;overflow-wrap:anywhere}
.msg .body.gone{opacity:.6;font-style:italic}.msg .body.gone svg{width:12px;height:12px;vertical-align:-1px}
.ico-in{display:inline-flex;vertical-align:-2px}.ico-in svg{width:12px;height:12px}
select.inp{cursor:pointer}
@media (max-width:1100px){.sbody.mem .scol{display:none}.sbody.mem .smembers{flex:1;width:auto;border-left:0}}
/* narrow screens: one column at a time */
@media (max-width:820px){
 .rail{display:none}
 .col{width:100%;border-right:0}
 .app.in-pane .col{display:none}
 .app:not(.in-pane) .pane{display:none}
 .back{display:inline-block}
 .tabs{display:flex;border-top:1px solid var(--line)}
 .gate{margin:0 12px 12px}
 .pane-head .meta,.pane-head .pane-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .callbar .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .callbar{gap:6px;padding:0 10px 0 12px}
 .cacts{gap:6px;max-width:64%}
 .callbar .tbtn,.callbar .hang{padding:7px 8px}
 .stage{right:8px;width:calc(100vw - 16px)}
 .stage.big{right:0;width:auto}
 .msg{max-width:86%}
 .thread{padding:16px}
 .composer{margin:0 12px 12px}
 .pane.enter{animation-name:paneSide}
 .app.srv-col .col{width:100%}
 .chans{width:100%;border-right:0}
 .srv.in-chan .chans{display:none}
 .srv:not(.in-chan) .schat{display:none}
 .side{width:100%;border-left:0;z-index:16;box-shadow:none}
 .side .back{display:none}
}

[
 {"v": "0.6.4", "features": ["Added servers, which are similar to Discord servers."], "fixes": ["Fixed issues with the Marmot Installer, in which the API endpoint was not working."]},
 {"v": "0.6.3", "features": ["Group chats now use Sender Keys, as Signal does: each message is encrypted once and the server hands the same ciphertext to every member, instead of encrypting a copy per member. Each member has their own key for each group, shared once over the private one-to-one channel, and it is replaced whenever someone leaves or is removed, so former members cannot read anything sent afterwards"], "fixes": []},
 {"v": "0.6.2", "features": ["Restyled scrollbars to match the theme", "Image themes: pick a background image in Settings → Appearance and Marmot builds a theme from its most common colors. Blur, darken / lighten and panel opacity are adjustable, and the text turns light or dark to match the image"], "fixes": ["Coming back to many unread messages no longer floods the app: they are saved in batches, chats show only the first new message until opened, and opening a chat shows the newest 10 without replaying animations", "Unread counters cap at 99+"]},
 {"v": "0.6.1", "features": ["Staff profile tags: staff with the new create tag permission can make short colored tags (up to 10 characters), and those with the assign tag permission can put them on people. Tags show beside the username on a profile"], "fixes": ["Calls that cannot connect directly now go through a relay server, or as a last resort carry their audio over the existing connection, encrypted end to end", "Chats open faster: only the latest messages are drawn at first, and older ones load as you scroll up"]},
 {"v": "0.6.0", "features": ["Added profiles: a display name, a bio, a custom status and an accent color, edited in Settings → Profile with a live preview", "You can now change your username (it takes your password)", "Online status: see when friends are online, idle or on do not disturb, and choose to show as online, do not disturb or invisible", "Hover over someone's picture in a chat for a mini profile; click it to open their full profile on the right", "Peers keeps your conversation open: picking someone there opens their profile beside it", "Do not disturb silences message toasts and the call ringtone"], "fixes": []},
 {"v": "0.5.0", "features": ["Added auto updating (longer start times, can download latest html for faster start times).", "Added Video and Screenshare to calls", "Added admin panel, moderators, and muting", "Added customizable chat filter (completely client side, disableable)", "Added patch notes display"], "fixes": ["Fixed Burst loading, where messages would load in a burst after inactivity"]}

<script>
'use strict';
/* Everything below sits in one block, so this script declares nothing global. Auto-update
   (see "updates") writes a newer copy over this page in the same window, and that copy
   must be able to declare the same names again. Keep new code inside the block. */
{
/* ==========================================================================
   SERVER — the Marmot server everyone using this file connects to.

const SERVER='https://dzp7zbkpmcitu.cloudfront.net';
/* Tried in order when SERVER can't be reached. Browsers block an https page
   from calling an http:// server, so http:// ones are only tried when this
   file is opened from disk or over http. */
const FALLBACK_SERVERS=['https://3-232-71-161.sslip.io','http://marmot-beta.us-east-1.elasticbeanstalk.com'];
/** The GitHub Pages copy offers the raw page as a download, to run from disk. */
const ON_PAGES=/\.github\.io$/i.test(location.hostname);
const DL_LINK='<a class="tbtn" href="index.html" download="marmot.html">DOWNLOAD HTML</a>';
/** Bump on every client release: copies older than the server's offer the new file. */
const VERSION='0.6.4';
/** What each release changed, newest first; the top entry is VERSION. The list itself is
    the #patchNotes data block above this script, where an older copy can read it too. */
const PATCH_NOTES=JSON.parse(document.getElementById('patchNotes').textContent);

/** The first configured server that answers at all (any HTTP status counts). */
async function reachServer(){
 // served by a Marmot server (not opened from disk, not the GitHub Pages copy): that server first
 const own=/^https?:$/.test(location.protocol)&&!ON_PAGES?location.origin:null;
 const list=[own,SERVER,...FALLBACK_SERVERS].filter(u=>u&&!(location.protocol==='https:'&&/^http:/i.test(u)));
 for(const u of list){
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),5000);
  // any answer counts for a configured server; the page's own host must really be a Marmot server
  try{
   if(u!==own){await fetch(u.replace(/\/+$/,'')+'/api/ice',{signal:ac.signal,cache:'no-store'});return u}
   const r=await fetch(u+'/api/health',{signal:ac.signal,cache:'no-store'});
   if(r.ok&&(await r.json()).service==='marmot')return u}
  catch(e){console.warn('Marmot server not reachable:',u)}
  finally{clearTimeout(t)}}

/*<marmot-core>*/
/* Everything between these markers is DOM-free: the protocol, the account
   crypto and the client engine. server/test runs this exact code in Node to
   exercise real clients against a real server. */

/* ---------------------------------------------------------------- utils */
const te=new TextEncoder(),td=new TextDecoder();
function rand(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return a}
function b64(buf){const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)}
function ub64(str){const s=atob(str),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function cat(...parts){const p=parts.map(x=>new Uint8Array(x));const out=new Uint8Array(p.reduce((n,x)=>n+x.length,0));let o=0;for(const x of p){out.set(x,o);o+=x.length}return out}
function hex(buf){return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
const uid=()=>crypto.randomUUID?crypto.randomUUID():hex(rand(16));
/** Base32 (RFC 4648, no padding): the secret half of an encrypted server's invite code. */
const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function b32(bytes){let bits=0,v=0,out='';for(const x of bytes){v=((v<<8)|x)&0xffff;bits+=8;while(bits>=5){out+=B32[(v>>>(bits-5))&31];bits-=5}}if(bits>0)out+=B32[(v<<(5-bits))&31];return out}
function ub32(str){let bits=0,v=0;const out=[];for(const ch of str){const i=B32.indexOf(ch);if(i<0)return null;v=((v<<5)|i)&0xffff;bits+=5;if(bits>=8){out.push((v>>>(bits-8))&255);bits-=8}}return new Uint8Array(out)}
const Z32=new Uint8Array(32);
const MAXTEXT=8000,DCTEXT=2000,MAXSDP=60000;
const FIRST=10;  // messages drawn when a thread opens (or snaps back to the bottom)
const PAGE=40;   // older messages drawn each time the reader scrolls up to the top
const LIMIT_ACKS=290;  // envelopes acked in one catch-up commit (the server takes 300)
const BURST=3;   // more arrivals than this at once is catching up: drawn as is, summed up in one toast
const AVSIZE=128,AVCHARS=48000;   // pictures are shrunk to AVSIZE² and at most AVCHARS of data: URL
/** A picture as it may come off the wire: a small base64 JPEG, PNG or WebP data: URL. */
const PICRE=/^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/]+={0,2}$/;
const isPic=x=>typeof x==='string'&&x.length<=64*1024&&PICRE.test(x);

   envelope (LIMITS.payloadBytes on the server) with room for a caption. */
const IMGCHARS=84000,IMGTEXT=2000;
const isImg=x=>typeof x==='string'&&x.length<=IMGCHARS&&PICRE.test(x);

const imgOf=x=>x&&isImg(x.img)?{img:x.img,w:dim(x.w),h:dim(x.h)}:{};

const PROFMAX={display:32,bio:300,status:80};
const ACCENTRE=/^#[0-9a-f]{6}$/i;
/** What others see of someone (online / idle / dnd / offline), and the modes a user picks from. */
const PRESENCES=['online','idle','dnd','offline'],PRESENCE_MODES=['auto','dnd','invisible'];
/** A profile as it comes off the wire, cleaned up: {display, bio, status, accent}, '' for each one unset. */
function cleanProfile(x){
 x=x&&typeof x==='object'?x:{};
 const t=(v,n)=>typeof v==='string'?v.slice(0,n):'';
 return {display:t(x.display,PROFMAX.display),bio:t(x.bio,PROFMAX.bio),status:t(x.status,PROFMAX.status),
  accent:typeof x.accent==='string'&&ACCENTRE.test(x.accent)?x.accent.toLowerCase():'',
  ...(typeof x.gtag==='string'&&/^[0-9a-f]{24}$/.test(x.gtag)?{gtag:x.gtag}:{})}}
/** The group tag shown on a profile, as the server describes it, or null. */
function cleanTag(t){
 if(!t||typeof t!=='object'||typeof t.groupId!=='string'||!/^[0-9a-f]{24}$/.test(t.groupId)||typeof t.text!=='string'||!t.text)return null;
 return {groupId:t.groupId,text:[...t.text].slice(0,4).join(''),emoji:typeof t.emoji==='string'&&t.emoji.length<=16?t.emoji:'',
  vis:t.vis==='friends'?'friends':'all',mode:t.mode==='apply'?'apply':'join',n:Number.isFinite(t.n)?t.n:0}}
/** The staff-given tags on a profile, as the server describes them: [{text, color}]. */
function cleanStags(a){
 return (Array.isArray(a)?a:[]).filter(t=>t&&typeof t.text==='string'&&t.text&&typeof t.color==='string'&&ACCENTRE.test(t.color))
  .slice(0,6).map(t=>({text:t.text.slice(0,10),color:t.color.toLowerCase()}))}

const tagLabel=t=>(t.emoji?t.emoji+' ':'#')+t.text;
/** A message in one line: its text, or that it is a photo. */
const gist=m=>m.text||(m.img?'sent a photo':'');

/* The chat filter: the reader's own setting, applied on this device to what other
   people send, since nobody else can read an end-to-end encrypted message. Each
   level includes the one before:
     none    nothing

/* ---------------------------------------------------------- sender keys */
/* Group messages use Signal's Sender Keys. Each member keeps, per group, a
   sender key of their own: a symmetric chain key that steps forward once per
   message (HMAC-SHA256, as in a ratchet's chain) and an Ed25519 signing key.
   It reaches each other member once, in a distribution message over the
   ordinary pairwise ratchet; after that every group message is encrypted and
   signed ONCE, and the server fans the one ciphertext out to the members.
   Someone who joins gets the chain as it stands, so they cannot read what came
   before; when anyone who held the key leaves or is removed, the sender starts
   a new key, so they cannot read what comes after.
     out  {kid,ck,n,priv,pub,sent:[userId]}   my key in a group, and who has it
     in   {keys:[{kid,ck,n,pub,skipped:{n:mk}}]}  a member's keys, newest first
   An envelope is {v:2,g,kid,n,ct,sig}: AES-GCM under the n-th message key, with the
   group, the sender's id (which the server vouches for), kid and n as associated
   data, and the sender's signature over that and the ciphertext. */
const SKey={

 KID:/^[0-9a-f]{16}$/,
 async fresh(){const s=await CR.pair('sign');return {kid:hex(rand(8)),ck:b64(rand(32)),n:0,priv:s.priv,pub:s.pub,sent:[]}},
 /** What a distribution message carries: the chain from the next message on, and the public signing key. */
 dist(out){return {kid:out.kid,ck:out.ck,n:out.n,pub:out.pub}},
 aad(gid,from,kid,n){return te.encode('Marmot_SK1|'+gid+'|'+from+'|'+kid+'|'+n)},
 async encrypt(out,gid,from,inner){
  const o=Ratchet.clone(out),n=o.n;
  const [next,mk]=await CR.kdfChain(ub64(o.ck));
  const aad=this.aad(gid,from,o.kid,n);
  const ct=b64(await CR.aead(mk,te.encode(JSON.stringify(inner)),aad));
  const sig=await CR.sign(o.priv,cat(aad,te.encode('|'+ct)));
  o.ck=b64(next);o.n=n+1;
  return {out:o,env:{v:2,g:gid,kid:o.kid,n,ct,sig}}},
 /** A member's distribution message, checked, added to what is kept of theirs; null if malformed. */
 learn(rec,d){
  const ok=d&&this.KID.test(d.kid)&&Number.isInteger(d.n)&&d.n>=0&&typeof d.ck==='string'&&typeof d.pub==='string';
  if(!ok)return null;
  try{if(ub64(d.ck).length!==32||ub64(d.pub).length!==32)return null}catch(e){return null}
  const keys=((rec&&rec.keys)||[]).slice();
  const have=keys.find(k=>k.kid===d.kid);
  // the same key again: keep ours, unless it is a different key under that id or an earlier point we can still use
  if(have&&have.pub===d.pub&&have.n<=d.n)return {keys};
  return {keys:[{kid:d.kid,ck:d.ck,n:d.n,pub:d.pub,skipped:{}}].concat(keys.filter(k=>k.kid!==d.kid)).slice(0,this.KEEP)}},
 async decrypt(rec,env,gid,from){
  if(!this.KID.test(env.kid)||!Number.isInteger(env.n)||env.n<0||typeof env.ct!=='string'||typeof env.sig!=='string')throw new Error('malformed group message');
  const keys=((rec&&rec.keys)||[]).map(k=>Ratchet.clone(k)),k=keys.find(x=>x.kid===env.kid);
  if(!k)throw Object.assign(new Error('no key from this sender yet'),{nokey:true});
  const aad=this.aad(gid,from,env.kid,env.n);
  if(!await CR.verify(k.pub,env.sig,cat(aad,te.encode('|'+env.ct))))throw new Error('bad signature');
  let mk;
  if(env.n<k.n){
   mk=k.skipped[env.n];
   if(!mk)throw new Error('message key already used');
   delete k.skipped[env.n]}
  else{
   if(env.n-k.n>this.MAX_SKIP)throw new Error('too many skipped messages');
   while(k.n<env.n){const [next,m]=await CR.kdfChain(ub64(k.ck));k.skipped[k.n]=b64(m);k.ck=b64(next);k.n++}
   const [next,m]=await CR.kdfChain(ub64(k.ck));k.ck=b64(next);k.n++;mk=b64(m);
   const ns=Object.keys(k.skipped);
   if(ns.length>this.MAX_KEPT)ns.sort((a,b)=>a-b).slice(0,ns.length-this.MAX_KEPT).forEach(x=>delete k.skipped[x])}
  const pt=await CR.aead(ub64(mk),ub64(env.ct),aad,true);
  return {rec:{keys},inner:JSON.parse(td.decode(pt))}}
};

/* ----------------------------------------------------------- the engine */
/* Records live in memory under logical keys and are mirrored to the server
   as blobs, each AES-GCM sealed with the account's data key and stored under
   an HMAC of its logical key — the server sees neither names nor contents.
     prof              {nextOpk}
     opk:<id>          one-time prekey pair
     peer:<userId>     pinned identity {userId,username,ik,sk,verified}
     sess:<userId>     ratchet record {active,archived,eks}
     msg:<userId>:<id> message {id,peer,dir,text,ts,state,re?}; `re` {id,from,t} is the
                       message it replies to, as quoted when it was sent. A message
                       deleted for everyone stays as {..., text:'', deleted:true}
     pref:filter       {level,action} the chat filter (see chatFilter)
   Relationships (friends, requests, blocks) are not records: the server
   holds them, because it is the server that refuses traffic between
   strangers. They are kept in this.peers as {userId,username,state,since}.
   Discord channels are conversations too, under the id "dc:<linkId>". They
   are NOT end-to-end encrypted: the server relays them in plaintext. Their
   messages arrive as server-originated envelopes and are stored like any
   other msg: record; this.links holds the channels this account is in.
   Group chats are conversations under the id "g:<groupId>". Who is in a
   group is held by the server (this.groups), because it is the server that
   lets members who are not friends reach each other. Everything said in a
   group, its name included, is end-to-end encrypted with Sender Keys (see
   SKey): encrypted once under the sender's key for the group, and fanned out
   by the server. Receipts, key distribution and call signals stay pairwise.
     skout:<groupId>          my sender key in the group
     skin:<groupId>:<userId>  a member's sender keys
     grp:<groupId>     {members:[userId]} as last seen, to tell joins and leaves apart
     gname:<groupId>   {name,ts,by} the group's name, newest wins
     gicon:<groupId>   {icon,ts,by} the group's icon (a small data: URL, '' for none), newest wins
     msg:g:<groupId>:<id>  message, with `from` on inbound ones and `got`
                       (who has confirmed delivery) on outbound ones */
class Tx{
 constructor(c){this.c=c;this.puts=[];this.dels=[];this.ack=[];this.send=[];this.opks=[];this.mem=new Map()}
 async put(logical,d){
  const k=await this.c.name(logical);
  const box=await CR.seal(this.c.key,{k:logical,d},te.encode(k));
  this.puts=this.puts.filter(p=>p.k!==k);this.puts.push({k,v:JSON.stringify(box)});
  this.mem.set(logical,[d,k]);return this}
 async del(logical){const k=await this.c.name(logical);this.dels.push(k);this.mem.set(logical,[null,k]);return this}
 body(){return {puts:this.puts,dels:this.dels,ack:this.ack,send:this.send,opks:this.opks}}
 apply(){for(const [l,[d,k]] of this.mem)d===null?this.c._del(l):this.c._set(l,d,k)}

  // what a catch-up staged is older than this: it has to reach the server first
  if(this.c._batch||this.c._flushing)await this.c._flush();
  const r=await this.c.api('POST','/api/commit',this.body());
  this.apply();
  if(r.opkCount!=null)this.c.opkCount=r.opkCount;
  this.c.emit('change');return r}
}

/* ---------------------------------------------------------- relay audio */
/* Call audio for the socket fallback, in the browser: the microphone as 20 ms
   packets, and packets back to the speakers through a small jitter buffer
   (60 ms to start, never more than 300 ms behind). Opus through WebCodecs when
   both ends have it, otherwise 16 kHz G.711 mu-law, which needs nothing but Web
   Audio (128 kbit/s against Opus's 32). Voice picks the codec and does the
   encryption and numbering; this only turns sound into bytes and back. */
function mulawEnc(x){
 let s=Math.round(Math.max(-1,Math.min(1,x))*32635);

 let e=7;for(let m=0x4000;!(s&m)&&e>0;m>>=1)e--;
 return ~(sign|(e<<4)|((s>>(e+3))&0x0f))&0xff}
function mulawDec(u){
 u=~u&0xff;const e=(u>>4)&7,s=(((u&0x0f)<<3)+0x84<<e)-0x84;
 return (u&0x80?-s:s)/32768}
const RelayAudio={
 available(){return !!(globalThis.AudioContext||globalThis.webkitAudioContext)},
 async codecs(){
  const G=globalThis,out=[];
  if(G.AudioEncoder&&G.AudioDecoder&&G.AudioData&&G.EncodedAudioChunk)try{
   const cfg={codec:'opus',sampleRate:48000,numberOfChannels:1};
   const [e,d]=await Promise.all([G.AudioEncoder.isConfigSupported(Object.assign({bitrate:32000},cfg)),G.AudioDecoder.isConfigSupported(cfg)]);
   if(e.supported&&d.supported)out.push('opus')}catch(e){}
  out.push('pcmu');
  return out},

  const AC=globalThis.AudioContext||globalThis.webkitAudioContext;
  const ctx=new AC({sampleRate:48000,latencyHint:'interactive'});
  ctx.suspend().catch(()=>{});
  return ctx},

  if(!ctx)ctx=this.context();

  const out=ctx.createScriptProcessor(1024,1,1);

   const o=ev.outputBuffer.getChannelData(0);

   if(!primed&&avail>=sr*0.06)primed=true;

   for(let i=0;i<n;i++)o[i]=ring[(r+i)%ring.length];
   r+=n;
   if(n<o.length){o.fill(0,n);primed=false}};

  sink.gain.value=0;src.connect(cap);cap.connect(sink);sink.connect(ctx.destination);

   const enc=new G.AudioEncoder({output:ch=>{const b=new Uint8Array(ch.byteLength);ch.copyTo(b);send(b)},error:()=>{}});
   enc.configure({codec:'opus',sampleRate:sr,numberOfChannels:1,bitrate:32000});
   const dec=new G.AudioDecoder({output:ad=>{
    try{const f=new Float32Array(ad.numberOfFrames);ad.copyTo(f,{planeIndex:0,format:'f32-planar'});push(f)}finally{ad.close()}},error:()=>{}});
   dec.configure({codec:'opus',sampleRate:sr,numberOfChannels:1});
   cap.onaudioprocess=ev=>{
    if(enc.state!=='configured')return;

    const ad=new G.AudioData({format:'f32-planar',sampleRate:sr,numberOfFrames:f.length,numberOfChannels:1,timestamp:ts,data:f});
    ts+=Math.round(f.length*1e6/sr);

   play=p=>{if(dec.state!=='configured')return;dec.decode(new G.EncodedAudioChunk({type:'key',timestamp:dts,data:p}));dts+=20000};
   closers.push(()=>enc.close(),()=>dec.close())}

     acc+=x[i];cnt++;
     if(++ph>=step){
      ph-=step;frame[fill++]=mulawEnc(acc/cnt);acc=cnt=0;

   play=p=>{
    // back up to the context rate by linear interpolation, carrying the last sample over

   close(){
    cap.onaudioprocess=out.onaudioprocess=null;
    for(const n of [src,cap,sink,out])try{n.disconnect()}catch(e){}
    for(const f of closers)try{f()}catch(e){}}}}
};

/* ---------------------------------------------------------------- voice */
/* Voice calls are WebRTC, so the audio is SRTP keyed by a DTLS handshake
   between two browsers. What makes that end-to-end is the signalling: the
   offer and answer, which carry each side's DTLS certificate fingerprint,
   travel as ordinary Double Ratchet messages. The server relays them but can
   neither read nor alter them, so it cannot put itself in the middle of the
   DTLS handshake. A TURN relay, when one is needed, forwards SRTP it cannot
   decrypt.
   One call at a time. A call is a set of links, one peer connection to each
   other person in it: a direct call has one, a group call one per member who
   joined (a full mesh). Signals are {k:'call', t, call:<id>, g?, sdp?} with t
   one of offer | answer | decline | busy | end | media | relay | roster; in a
   group call g names the group, so it travels and is checked like any other
   group message (members only, and not from someone muted in the group). Each
   call leaves one line in the chat history, stored like any other record.
   A group call: whoever starts it rings the members they pick (an offer with
   ring:true), and anyone in it can ring more later. Someone who answers is
   connected to whoever rang them; to reach everyone else, each person sends a
   'roster' {ids} of who they are connected to whenever that changes, and of
   any two people in the call who are not yet connected, the lower user id
   dials the other (an offer without ring, answered without ringing). An offer
   without ring for a call this side is not in is turned away with 'end'.
   Video rides the same connections: each offer carries an audio section and
   two video sections, camera then screen, sending nothing until switched on.
   Turning either on swaps a track into every link's sender, so there is never
   a second round of offer and answer; a 'media' signal {cam, screen, muted}
   tells the others which of its videos to show and whether it is muted. A call
   from an older, audio-only client simply has no video sections, and video to
   that person stays off.
   Getting through: ICE tries a direct path first and the server's TURN relay
   second, both inside one peer connection. If that still fails, a link falls
   back to the WebSocket: the offer and answer also carry relay:{k, c}, a fresh
   AES-GCM key for frames that side sends and the codecs it can play. When ICE
   gives up, either side switches and sends a 'relay' signal so the other does
   too; audio then goes as encrypted 20 ms frames through the server, which
   cannot read them (see RelayAudio). A relayed link is voice only. */
class VCall{
 constructor(o){
  Object.assign(this,{group:null,peer:null,muted:false,cam:false,screen:false,camStream:null,screenStream:null,
   stream:null,actx:null,started:0,switching:new Set(),links:new Map()},o)}
 /** The link a direct call is about (or, in a group, whoever rang, else the first). */

 get pc(){const l=this.main();return l?l.pc:null}
 get relay(){const l=this.main();return !!l&&l.relay}
 get remote(){const l=this.main();return l?l.remote:null}
 get remoteCam(){const l=this.main();return l?l.remoteCam:null}
 get remoteScreen(){const l=this.main();return l?l.remoteScreen:null}
 get peerCam(){const l=this.main();return !!l&&l.peerCam}
 get peerScreen(){const l=this.main();return !!l&&l.peerScreen}
 get tx(){const l=this.main();return l?l.tx:null}
 /** Whether any link is going through the socket relay, or struggling. */
 get relayed(){for(const l of this.links.values())if(l.relay)return true;return false}
 get unstable(){for(const l of this.links.values())if(l.unstable)return true;return false}
}

   const d=await Acct.derive(pass,salt,this.iter);

  this.setServer(s.server);this.token=s.token;this.vk=s.vk;
  try{
   const me=await this.api('GET','/api/me');
   const v=await this.api('GET','/api/vault');
